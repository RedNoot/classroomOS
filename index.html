  .chip-link{border:none;background:transparent;cursor:pointer;padding:0;line-height:1;filter:grayscale(1);opacity:.3;transition:.12s;font-size:13px}
  .chip-link:hover{opacity:.8;filter:grayscale(.1)}
  .chip-link.on{filter:none;opacity:1}
  .chip-mates{cursor:pointer;font-size:11px;font-weight:900;color:#1f9d63;line-height:1}
  .chip-mates:hover{opacity:.7}
  .seat-chip.paired{border-color:#2aa66a;background:color-mix(in srgb,#2aa66a 12%,var(--surface))}
  .seat-chip.linking{border-color:#2aa66a;box-shadow:0 0 0 2px color-mix(in srgb,#2aa66a 55%,transparent)}
  .seat-chip.flagging{border-color:#e2362c;box-shadow:0 0 0 2px color-mix(in srgb,#e2362c 55%,transparent)}
  .chip-flag .chip-foenum{font-size:9px;font-weight:900;color:#e2362c;vertical-align:super;margin-left:1px}
  .seat-pairvcount{color:#1f9d63;font-weight:900}
  .pm-pick{margin-bottom:10px}
  .pm-arming{font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
  .pm-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;border:1px solid transparent}
  .pm-row:hover{background:var(--surface-2)}
  .pm-row.arming{background:color-mix(in srgb,#2aa66a 10%,var(--surface));border-color:color-mix(in srgb,#2aa66a 40%,var(--line));cursor:pointer}
  .pm-flag{border:none;background:transparent;cursor:pointer;font-size:14px;filter:grayscale(1);opacity:.35;padding:0}
  .pm-flag:hover{opacity:.8;filter:grayscale(.2)}
  .pm-flag.on{filter:none;opacity:1}
  .pm-name{font-weight:800;min-width:96px}
  .pm-mates{flex:1;display:flex;flex-wrap:wrap;gap:4px}
  .pm-mate{font-size:11px;font-weight:800;color:#1f9d63;background:color-mix(in srgb,#2aa66a 12%,var(--surface));
    border:1px solid color-mix(in srgb,#2aa66a 35%,var(--line));border-radius:999px;padding:2px 8px;cursor:pointer}
  .pm-mate:hover{background:color-mix(in srgb,#e2362c 12%,var(--surface));border-color:#e2362c;color:#c0271e}
  .pm-foe{font-size:11px;font-weight:800;color:#c0271e;background:color-mix(in srgb,#e2362c 12%,var(--surface));
    border:1px solid color-mix(in srgb,#e2362c 35%,var(--line));border-radius:999px;padding:2px 8px;cursor:pointer}

  .seat.linked.filled{border-color:#2aa66a;background:color-mix(in srgb,#2aa66a 16%,var(--surface))}

  @keyframes clashdash{to{stroke-dashoffset:-32}}

  /* the name you're holding — big, bold, right under the cursor so it reads as "grabbed" */

    box-shadow:0 10px 26px rgba(0,0,0,.4);animation:grabpop .14s ease-out}

                     to{transform:translate(-50%,-50%) rotate(-2deg) scale(1);opacity:1}}
  /* the desk they came from — clearly shows the seat is now "in hand" */

<script>
/* ============================================================
   Classroom OS
   Single-file app. Persistence via window.storage (artifact API),
   with graceful in-memory fallback so it still works anywhere.
   ============================================================ */

/* ---------- storage helper (async, safe) ---------- */
const mem = {};
/* ---------- persistence ----------
   Three backends, in order of preference:
     1. window.storage  — the artifact/preview sandbox (no localStorage there)
     2. localStorage    — REAL BROWSERS. This is what teachers actually use.
     3. mem             — last-resort in-memory (private mode / storage disabled).
   Everything is namespaced under cos_ so we never collide with anything else
   on the same origin. Data never leaves the teacher's own machine. */
const LS_PREFIX='cos_';
const APP_VERSION='1.2.0';
let LS_OK=false;
try{ const k=LS_PREFIX+'__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); LS_OK=true; }catch(e){ LS_OK=false; }
let storageWarned=false;
function storageKind(){ return (typeof window!=='undefined' && window.storage) ? 'sandbox' : (LS_OK ? 'local' : 'memory'); }
const Store = {
  async get(key, def){
    try{
      if(window.storage){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : def; }
    }catch(e){ /* missing key throws */ }
    if(LS_OK){
      try{ const v=localStorage.getItem(LS_PREFIX+key); if(v!==null) return JSON.parse(v); }
      catch(e){ /* corrupt value — fall through to default */ }
      return (key in mem) ? mem[key] : def;
    }
    return (key in mem) ? mem[key] : def;
  },
  async set(key, val){
    mem[key] = val;
    // every tool persists through here, so this is the one place undo needs to watch
    try{ if(typeof HIST!=='undefined' && HIST.base && !HIST.busy && HIST.map[key]) histPush(); }catch(e){}
    // DEMO MODE: keep everything in memory only — a sample classroom must never
    // overwrite a real teacher's saved class list, schedule or seating.
    if(typeof demoMode!=='undefined' && demoMode) return;
    try{ if(window.storage){ await window.storage.set(key, JSON.stringify(val)); return; } }catch(e){}
    if(LS_OK){
      try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }
      catch(e){ // quota exceeded or blocked
        if(!storageWarned){ storageWarned=true;
          try{ pushNote({emoji:'⚠️', title:'Could not save', msg:'Your browser blocked saving (storage full or private mode). Export your setup to keep it.'}); }catch(_){}
        }
      }
    }
  },
  async del(key){
    delete mem[key];
    try{ if(window.storage){ await window.storage.delete(key); return; } }catch(e){}
    if(LS_OK){ try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){} }
  }
};

/* ---------- sounds (Web Audio, no files needed) ----------
   Each preset is a list of [freq, startOffset, duration, wave?] notes. They're
   deliberately given distinct SHAPES — rising, falling, repeated knocks,
   arpeggios, a warble — so a teacher can tell "pack up" from "line up" by ear,
   not just by remembering which is which. Volume is global (SETTINGS.soundVolume,
   0–1) and scales the peak gain of every note. */
let AC;
const SOUND_PRESETS = {
  // name : { label, notes:[[freq, t, dur, wave]] }
  ding:   {label:'Ding',        notes:[[880,0,.0001],[1320,.02,.4]]},
  bell:   {label:'Bell',        notes:[[660,0,.0001],[990,.01,.5],[1980,.01,.3]]},
  chime:  {label:'Chime ↗',     notes:[[523,0,.3],[659,.12,.3],[784,.24,.5]]},
  descend:{label:'Chime ↘',     notes:[[784,0,.3],[659,.12,.3],[523,.24,.5]]},
  knock:  {label:'Knock-knock', notes:[[300,0,.12,'square'],[300,.2,.12,'square']]},
  triad:  {label:'Fanfare',     notes:[[523,0,.18],[659,.1,.18],[784,.2,.18],[1047,.3,.5]]},
  warble: {label:'Warble',      notes:[[880,0,.1],[988,.1,.1],[880,.2,.1],[988,.3,.2]]},
  alarm:  {label:'Alert',       notes:[[740,0,.14,'square'],[622,.16,.14,'square'],[740,.32,.14,'square'],[622,.48,.2,'square']]},
  drop:   {label:'Low tone',    notes:[[300,0,.5,'triangle']]},
  pop:    {label:'Pop',         notes:[[600,0,.08],[1200,.03,.12]]},
  blip:   {label:'Blip',        notes:[[440,0,.25]]},
};
function soundVol(){
  const v = (SETTINGS && typeof SETTINGS.soundVolume==='number') ? SETTINGS.soundVolume : 0.7;
  return Math.max(0, Math.min(1, v));
}
function tone(type){
  try{
    const vol=soundVol();
    if(vol<=0) return;                          // muted
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
    const now = AC.currentTime;
    const preset = SOUND_PRESETS[type]||SOUND_PRESETS.ding;
    const peak = .5*vol;                         // headroom: full-scale would clip on chords
    preset.notes.forEach(([f,t,d,wave])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.frequency.value=f; o.type=wave||'sine';
      o.connect(g); g.connect(AC.destination);
      const s=now+t;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,s+d+.02);
      o.start(s); o.stop(s+d+.05);
    });
  }catch(e){}
}
/* Browsers block audio until the page has had a user gesture — so a reminder that
   fires before the teacher has clicked anything is silently swallowed. Create and
   resume the AudioContext on the very first interaction, so it's alive and ready
   when a reminder later needs it. Runs once. */
function primeAudio(){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
  }catch(e){}
  window.removeEventListener('pointerdown',primeAudio);
  window.removeEventListener('keydown',primeAudio);
  window.removeEventListener('touchstart',primeAudio);
}
/* A reusable "alert sound" chooser — the same dropdown reminders uses, so every
   tool that plays a completion sound offers the same set with a preview. Returns
   HTML; call wireSoundPicker(container, getCurrent, onChange) to make it live. */
function soundPickerHTML(current, label){
  const opts=Object.entries(SOUND_PRESETS)
    .map(([k,v])=>`<option value="${k}"${k===current?' selected':''}>${esc(v.label)}</option>`).join('');
  return `<label class="snd-pick"><span class="muted">${esc(label||'Sound')}</span>
    <select class="field sm" data-snd>${opts}</select>
    <button class="btn sm ghost" data-snd-play title="Hear it" type="button">🔊</button></label>`;
}
function wireSoundPicker(scope, onChange){
  const sel=scope.querySelector('[data-snd]'), play=scope.querySelector('[data-snd-play]');
  if(!sel) return;
  sel.onchange=()=>{ onChange(sel.value); tone(sel.value); };
  if(play) play.onclick=()=>tone(sel.value);
}
/* Per-tool completion sound, persisted. Sensible defaults so existing setups
   keep the sound they had before this was configurable. */
const TOOL_SOUND_DEFAULTS = { timer:'bell', pomodoro:'bell', settle:'chime' };
function toolSound(tool){
  const m = (SETTINGS && SETTINGS.toolSounds) || {};
  const v = m[tool];
  return (v && SOUND_PRESETS[v]) ? v : (TOOL_SOUND_DEFAULTS[tool]||'ding');
}
function setToolSound(tool, val){
  if(!SETTINGS.toolSounds) SETTINGS.toolSounds={};
  SETTINGS.toolSounds[tool]=val; saveSettings();
}

/* ---------- global state ---------- */
let SETTINGS = { theme:'daylight', accent:null, enabled:{}, soundVolume:0.7, browserNotify:'off' };
let STUDENTS = [];           // class list — stored in the TEACHER'S order (roll-call,
                             // seating groups, whatever they arranged). Never re-sorted
                             // in place; A/Z is a display lens (see studentList()).
/* The list as it should be READ. `SETTINGS.studentSort==='az'` sorts a copy for
   places that show a roster to scan; everything else (picker, groups, seating)
   keeps the teacher's own order by calling STUDENTS directly. */
function studentList(){
  if(SETTINGS.studentSort==='az'){
    return [...STUDENTS].sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base', numeric:true}));
  }
  return STUDENTS;
}
let ACTIVITIES = [];         // morning riddles/activities
let REMINDERS = [];          // {id,label,time,recur,sound,dismiss,emoji,_firedToday}
let SPINNER = [];            // spinner entries
let JOBS = [];               // job wheel entries
let JOBASSIGN = {};          // { jobName: studentName }
let POINTS = { mode:'class', class:0, students:{} };
let BEHAVIOR = [];           // {id,name,type,note,time}
let GRID = { stages:[], status:{} }; // stages:[{emoji,label}], status:{name:stageIndex}
let WEATHER = { lat:-37.8136, lon:144.9631, name:'Melbourne, Victoria' };
let SCHEDULE = { side:'left', days:{} };
let SUBJECTS = [];        // [{id,emoji,name,color,links:[{label,url}]}] — the "velcro cards"
let SCHED_TPL = [];       // [{id,name,slots:[subjectId|null]}] — which card in which slot
/* ---------- the year ----------
   TERMS  : [{n,start:'YYYY-MM-DD',end:'YYYY-MM-DD'}] — real dates, so the app can
            answer "which week is today?" without asking. Empty = feature dormant,
            and everything behaves exactly as it did before terms existed.
   WEEKPLAN: { 't2w3': { 3:[sessions] } } — SPARSE OVERRIDES ONLY. A week that
            matches the usual timetable stores nothing at all. Only the days a
            teacher actually changed (the excursion, the assembly) are written.
            This is what keeps 40 weeks from becoming 40 copies of the timetable. */
let TERMS = [];
let WEEKPLAN = {};
let SCOREBOARD = [];   // [{id,name,score,color}]
let CORK = [];         // [{id,text,color,x,y,rot}] — sticky-note corkboard
let SEATING = {seats:[]}; // {seats:[{id,x,y,student}]} — draggable seating chart
/* "Keep together" (pairs) and "keep apart" (flagged) are about the KIDS, not the
   furniture — so the group picker reads the same lists the seating chart uses,
   rather than making a teacher set them twice. Top-level readers so any tool can
   consult them safely. */
function seatPairs(){ return Array.isArray(SEATING.pairs)?SEATING.pairs:[]; }
/* keep-apart is now PAIRWISE — a list of tuples like pairs, not a flat list. So
   A↔B and C↔D are independent: flagging all four no longer wrongly couples A↔D. */
function seatApartPairs(){ return Array.isArray(SEATING.apartPairs)?SEATING.apartPairs:[]; }
function isKept(a,b){ if(!a||!b) return false; const x=a.toLowerCase(), y=b.toLowerCase();
  return seatPairs().some(p=>{ const l=p[0].toLowerCase(), r=p[1].toLowerCase(); return (l===x&&r===y)||(l===y&&r===x); }); }
function isApart(a,b){ if(!a||!b) return false; const x=a.toLowerCase(), y=b.toLowerCase();
  return seatApartPairs().some(p=>{ const l=p[0].toLowerCase(), r=p[1].toLowerCase(); return (l===x&&r===y)||(l===y&&r===x); }); }
// is this student in ANY keep-apart pair? (for the 🚩 badge on a chip/seat)
function isFlaggedAny(n){ if(!n) return false; const l=n.toLowerCase();
  return seatApartPairs().some(p=>p[0].toLowerCase()===l||p[1].toLowerCase()===l); }
function apartPartnersList(n){ if(!n) return []; const l=n.toLowerCase();
  return seatApartPairs().filter(p=>p[0].toLowerCase()===l||p[1].toLowerCase()===l).map(p=>p[0].toLowerCase()===l?p[1]:p[0]); }
function partnersList(n){ if(!n) return []; const l=n.toLowerCase();
  return seatPairs().filter(p=>p[0].toLowerCase()===l||p[1].toLowerCase()===l).map(p=>p[0].toLowerCase()===l?p[1]:p[0]); }

/* ---------- undo / redo ----------
   Snapshot layer: every tracked global is serialisable and saved under a known
   storage key, so we snapshot the lot, diff against the last snapshot, and push
   only what actually changed. Restore = write back + re-render the affected tools. */
const HIST = {
  // key -> {get, set, apps:[tool ids to refresh]}
  map:{
    students:  {get:()=>STUDENTS,   set:v=>STUDENTS=v,   apps:['names','groups','queue','points','behavior','grid','jobs','seating','settings'], label:'class list'},
    schedule:  {get:()=>SCHEDULE,   set:v=>SCHEDULE=v,   apps:[], label:'schedule', after:()=>renderSchedule()},
    subjects:  {get:()=>SUBJECTS,   set:v=>SUBJECTS=v,   apps:[], label:'subjects', after:()=>renderSchedule()},
    sched_tpl: {get:()=>SCHED_TPL,  set:v=>SCHED_TPL=v,  apps:[], label:'day templates'},
    terms:     {get:()=>TERMS,      set:v=>TERMS=v,      apps:[], label:'term dates', after:()=>renderSchedule()},
    weekplan:  {get:()=>WEEKPLAN,   set:v=>WEEKPLAN=v,   apps:[], label:'week plans', after:()=>renderSchedule()},
    seating:   {get:()=>SEATING,    set:v=>SEATING=v,    apps:['seating'], label:'seating'},
    cork:      {get:()=>CORK,       set:v=>CORK=v,       apps:['cork'], label:'corkboard'},
    points:    {get:()=>POINTS,     set:v=>POINTS=v,     apps:['points'], label:'points'},
    behavior:  {get:()=>BEHAVIOR,   set:v=>BEHAVIOR=v,   apps:['behavior'], label:'behaviour log'},
    scoreboard:{get:()=>SCOREBOARD, set:v=>SCOREBOARD=v, apps:['scoreboard'], label:'scoreboard'},
    jobs:      {get:()=>JOBS,       set:v=>JOBS=v,       apps:['jobs'], label:'jobs'},
    jobassign: {get:()=>JOBASSIGN,  set:v=>JOBASSIGN=v,  apps:['jobs'], label:'job assignments'},
    grid:      {get:()=>GRID,       set:v=>GRID=v,       apps:['grid'], label:'task grid'},
    spinner:   {get:()=>SPINNER,    set:v=>SPINNER=v,    apps:['spinner'], label:'spinner'},
    reminders: {get:()=>REMINDERS,  set:v=>REMINDERS=v,  apps:['reminders'], label:'reminders'},
    activities:{get:()=>ACTIVITIES, set:v=>ACTIVITIES=v, apps:['activity'], label:'activities'},
  },
  undo:[], redo:[], base:null, depth:40, busy:false,
  snap(){ const o={}; for(const k in this.map) o[k]=JSON.stringify(this.map[k].get()??null); return o; },
  /* call once state is loaded in boot() */
  init(){ this.base=this.snap(); this.undo=[]; this.redo=[]; this.paint(); },
  /* diff current state vs last snapshot; if anything changed, push an undo entry */
  push(label){
    if(this.busy||!this.base) return;
    const now=this.snap(), before={}, after={}; let changed=0, only='';
    for(const k in now){ if(now[k]!==this.base[k]){ before[k]=this.base[k]; after[k]=now[k]; changed++; only=k; } }
    if(!changed) return;
    this.undo.push({before, after, label: label || (changed===1 ? this.map[only].label : changed+' changes')});
    if(this.undo.length>this.depth) this.undo.shift();
    this.redo.length=0; this.base=now; this.paint();
  },
  apply(patch){
    this.busy=true;
    clearTimeout(_histT);   // kill any pending debounced push so it can't corrupt the baseline
    const apps=new Set(); const afters=[];
    for(const k in patch){
      const m=this.map[k]; if(!m) continue;
      m.set(JSON.parse(patch[k]));
      Store.set(k, m.get());
      (m.apps||[]).forEach(a=>apps.add(a));
      if(m.after) afters.push(m.after);
    }
    this.base=this.snap();
    if(apps.size) refreshOpen([...apps]);
    afters.forEach(f=>{ try{ f(); }catch(e){} });
    clearTimeout(_histT);   // and again, in case a refresh triggered a save
    this.busy=false; this.paint();
  },
  doUndo(){ const e=this.undo.pop(); if(!e){ this.flash('Nothing to undo'); return; }
    this.redo.push(e); this.apply(e.before); this.flash('Undid '+e.label); },
  doRedo(){ const e=this.redo.pop(); if(!e){ this.flash('Nothing to redo'); return; }
    this.undo.push(e); this.apply(e.after); this.flash('Redid '+e.label); },
  paint(){
    const u=document.getElementById('undo-btn'), r=document.getElementById('redo-btn');
    if(u){ u.disabled=!this.undo.length; u.title=this.undo.length?('Undo '+this.undo[this.undo.length-1].label+' (Ctrl+Z)'):'Nothing to undo'; }
    if(r){ r.disabled=!this.redo.length; r.title=this.redo.length?('Redo '+this.redo[this.redo.length-1].label+' (Ctrl+Shift+Z)'):'Nothing to redo'; }
  },
  flash(msg){
    let t=document.getElementById('undo-toast');
    if(!t){ t=document.createElement('div'); t.id='undo-toast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('show');
    clearTimeout(this._ft); this._ft=setTimeout(()=>t.classList.remove('show'),1600);
  }
};

let zTop = 100;                       // windows live in 100..899 (see --z-win-* scale)
const Z_WIN_MAX = 899;
/* Bring a window to the front — but never above the chrome tier. When the counter
   would exceed the band, renumber the open windows compactly and keep going, so a
   long session can't push a window over the rail/dock/topbar. */
function focusWin(el){
  if(zTop>=Z_WIN_MAX) restackWindows();
  el.style.zIndex = ++zTop;
}
function restackWindows(){
  const wins=Object.values(openWindows||{})
    .filter(w=>w && w.style)
    .sort((a,b)=>(+a.style.zIndex||0)-(+b.style.zIndex||0));
  let z=100; wins.forEach(w=>{ w.style.zIndex = z++; });
  zTop = z;
}
let winSeq = 0;
let minTrayCollapsed = false;
const openWindows = {}; // instanceKey -> element (element carries dataset.app and dataset.key)

/* ---------- remember open tools across a refresh ----------
   Captures the same shape the demo snapshot uses: which tools are open, where,
   how big, stacking order, and whether minimised. Saved (debounced) whenever the
   set of windows changes or one is moved/resized, and replayed at boot.
   Deliberately NOT part of undo/backup — it's session furniture, not data. */
let _sessSaveT=null;
function captureSession(){
  return Object.values(openWindows).map(w=>({
    app:w.dataset.app, x:w.offsetLeft, y:w.offsetTop, w:w.offsetWidth, h:w.offsetHeight,
    z:+w.style.zIndex||0, min:w.style.display==='none'
  }));
}
function saveSession(){
  // never persist the sample session (guarded: demoMode is declared later)
  try{ if(demoMode) return; }catch(e){}
  clearTimeout(_sessSaveT);
  _sessSaveT=setTimeout(()=>{
    try{ Store.set('session_wins', captureSession()); }catch(e){}
  }, 400);
}
async function restoreSession(){
  let wins=[];
  try{ wins = await Store.get('session_wins', []); }catch(e){ return; }
  if(!Array.isArray(wins) || !wins.length) return;
  // lowest z first so the stacking order comes back the way it was
  wins.slice().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(s=>{
    if(!s || !APPS[s.app] || APPS[s.app].toggle) return;   // skip removed/toggle apps
    openApp(s.app, true);
    const win=Object.values(openWindows).find(w=>w.dataset.app===s.app && !w.dataset.restored);
    if(!win) return;
    win.dataset.restored='1';
    if(Number.isFinite(s.x) && Number.isFinite(s.y)){
      // clamp back inside the viewport in case the screen got smaller
      win.style.left=Math.max(0,Math.min(s.x, Math.max(0,window.innerWidth-120)))+'px';
      win.style.top =Math.max(0,Math.min(s.y, Math.max(0,window.innerHeight-80)))+'px';
    }
    if(Number.isFinite(s.w) && s.w>0) win.style.width=s.w+'px';
    if(Number.isFinite(s.h) && s.h>0) win.style.height=s.h+'px';
    if(s.min) win.style.display='none';
  });
  Object.values(openWindows).forEach(w=>delete w.dataset.restored);
  renderDock(); renderMinTray();
  requestAnimationFrame(fitAllWindows);
}

/* tray of minimised windows — visible even when the dock is hidden */
function renderMinTray(){
  const tray=document.getElementById('min-tray');
  tray.innerHTML='';
  const mins=Object.entries(openWindows).filter(([k,w])=>w.style.display==='none');
  if(!mins.length){ tray.style.display='none'; minTrayCollapsed=false; return; }
  tray.style.display='flex';
  if(minTrayCollapsed){
    const launch=document.createElement('button'); launch.className='min-launch';
    launch.title='Show minimised windows';
    launch.innerHTML=`🗂 Minimised <span class="ml-count">${mins.length}</span>`;
    launch.onclick=()=>{ minTrayCollapsed=false; renderMinTray(); };
    tray.appendChild(launch);
    return;
  }
  const collapse=document.createElement('button'); collapse.className='min-collapse';
  collapse.title='Collapse minimised windows'; collapse.textContent='⌄';
  collapse.onclick=()=>{ minTrayCollapsed=true; renderMinTray(); };
  tray.appendChild(collapse);
  mins.forEach(([key,w])=>{
    const a=APPS[w.dataset.app];
    const c=document.createElement('button'); c.className='min-chip';
    c.title='Reopen '+a.name;
    c.innerHTML=`<span class="mc-dot"></span><span class="mc-emoji">${a.emoji}</span>${a.name}<span class="mc-restore">⤢</span>`;
    c.onclick=()=>{ w.style.display='flex'; focusWin(w); renderMinTray(); renderDock(); saveSession(); };
    tray.appendChild(c);
  });
}

/* rebuild the body of any open windows whose data changed (all instances of those apps) */
function refreshOpen(ids){
  Object.values(openWindows).forEach(w=>{
    if(ids.includes(w.dataset.app)){ const b=w.querySelector('.win-body'); b.innerHTML=''; APPS[w.dataset.app].build(b, w);
      if(b.dataset.nofit!=='1'){ wrapForFit(b); requestAnimationFrame(()=>fitWindowContent(w)); } }
  });
}

function openApp(id, forceNew){
  const app = APPS[id]; if(!app) return;
  if(app.toggle){ if(id==='schedule') toggleSchedule(); return; }
  // focus an existing instance unless we're explicitly opening another
  if(!forceNew){
    const existing = Object.values(openWindows).find(w=>w.dataset.app===id);
    if(existing){ existing.style.display='flex'; focusWin(existing); renderMinTray(); flashDock(); return; }
  }
  const key = (!forceNew && !openWindows[id]) ? id : id+'#'+(++winSeq);

  const desktop = document.getElementById('desktop');
  const win = document.createElement('div');
  win.className='win'+(id==='settings'?' win-settings':'');
  win.dataset.app=id; win.dataset.key=key;
  const n = Object.keys(openWindows).length;
  win.style.left = (90 + (n*28) % 300) + 'px';
  win.style.top  = (90 + (n*24) % 200) + 'px';
  win.style.width=(app.w||480)+'px'; win.style.height=(app.h||360)+'px';
  win.style.zIndex = ++zTop;

  win.innerHTML = `
    <div class="win-head">
      <button class="win-btn dup" title="Open another ${app.name}">⧉</button>
      <span class="win-emoji">${app.emoji}</span>
      <span class="win-title">${app.name}</span>
      ${GUIDES[id]?`<button class="win-btn help" title="What is this? How does it work?">?</button>`:''}
      <button class="win-btn full" title="Fullscreen (projector mode)">⛶</button>
      <button class="win-btn min" title="Minimise">—</button>
      <button class="win-btn close" title="Close">✕</button>
    </div>
    <div class="win-body"></div>
    <div class="win-resize"></div>`;
  desktop.appendChild(win);
  openWindows[key]=win;
  saveSession();

  win.addEventListener('mousedown',()=>focusWin(win));
  const hb=win.querySelector('.help');
  if(hb) hb.onclick=(e)=>{ e.stopPropagation(); openGuide(id); };
  win.querySelector('.dup').onclick=(e)=>{ e.stopPropagation(); openApp(id, true); };
  win.querySelector('.close').onclick=()=>{ if(win===fullWin) exitWinFull(); win.remove(); delete openWindows[key]; renderDock(); renderMinTray(); saveSession(); };
  win.querySelector('.min').onclick=()=>{ win.style.display='none'; renderDock(); renderMinTray(); saveSession(); };
  win.querySelector('.full').onclick=(e)=>{ e.stopPropagation(); toggleWinFull(win); };
  makeDraggable(win, win.querySelector('.win-head'));
  // double-click the header to fill the screen (and again to restore)
  win.querySelector('.win-head').addEventListener('dblclick',e=>{
    if(e.target.closest('.win-btn')) return;
    toggleWinMax(win);
  });
  makeResizable(win, win.querySelector('.win-resize'));

  // A tool that throws must not leave a blank window in front of the class.
  try{
    app.build(win.querySelector('.win-body'), win);
    // wrap the tool's content and scale it to fit the window (unless it opts out)
    const _b=win.querySelector('.win-body');
    if(_b && _b.dataset.nofit!=='1'){ wrapForFit(_b); requestAnimationFrame(()=>fitWindowContent(win)); }
  }catch(e){
    logError('tool', e, app.name);
    const b=win.querySelector('.win-body');
    b.innerHTML=`<div class="tool-crash">
      <div class="tc-emoji">😵</div>
      <div class="tc-title">${esc(app.name)} couldn't open</div>
      <div class="tc-msg">Something in this tool hit a problem. Everything else still works, and none of your data is lost.</div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="btn sm primary" data-retry>↻ Try again</button>
        <button class="btn sm" data-bug>🐞 Report it</button>
      </div></div>`;
    const rt=b.querySelector('[data-retry]');
    if(rt) rt.onclick=()=>{ b.innerHTML=''; try{ app.build(b,win); }catch(e2){ logError('tool', e2, app.name); } };
    const bg=b.querySelector('[data-bug]');
    if(bg) bg.onclick=()=>reportBug();
  }
  renderDock();
  flashDock();
  if(GUIDES[id]) setTimeout(()=>maybeCoach(id), 350);   // first-open coach mark
}

/* ============================================================
   ERROR HANDLING & BUG REPORTING
   Nothing should ever fail silently in front of a class. Errors are caught,
   shown calmly in the 🔔 notifications, and can be sent as a pre-filled GitHub
   issue — the teacher clicks submit, so no API token is ever embedded here.
   ============================================================ */
const BUG_REPO = 'https://github.com/RedNoot/classroomOS';
const errorLog = [];
let lastErrKey='', lastErrAt=0;

function logError(kind, err, where){
  const msg = (err && (err.message||err.reason||err.toString())) || String(err);
  const key = kind+'|'+msg;
  const now = Date.now();
  if(key===lastErrKey && now-lastErrAt < 5000) return;   // don't spam the same fault
  lastErrKey=key; lastErrAt=now;
  const entry = {
    kind, msg, where: where||'',
    stack: (err && err.stack) ? String(err.stack).split('\n').slice(0,6).join('\n') : '',
    at: new Date().toISOString(),
  };
  errorLog.push(entry);
  if(errorLog.length>20) errorLog.shift();
  console.error('[Classroom OS]', kind, err);
  try{ sendCrashReport(entry); }catch(e){}   // opt-in, rate-limited, scrubbed; fails silently
  try{
    pushNote({
      emoji:'⚠️',
      title: where ? ('Something went wrong in '+where) : 'Something went wrong',
      msg: friendlyError(msg)+' Your work is safe. Click 🐞 Report in Settings if it keeps happening.'
    });
  }catch(e){}
}
/* translate the jargon into something a teacher can act on */
function friendlyError(msg){
  const m=(msg||'').toLowerCase();
  if(m.includes('quota')||m.includes('exceeded')) return 'Your browser\'s storage is full, so saving failed.';
  if(m.includes('getusermedia')||m.includes('permission denied')||m.includes('notallowed')) return 'The microphone was blocked — check the browser\'s permission prompt.';
  if(m.includes('network')||m.includes('failed to fetch')) return 'Couldn\'t reach the internet for that bit.';
  if(m.includes('is not a function')||m.includes('undefined')) return 'A tool hit an unexpected value and stopped.';
  return 'A tool ran into a problem and stopped.';
}
function initErrors(){
  window.addEventListener('error', e=>{
    if(e && e.message && /ResizeObserver/.test(e.message)) return;    // harmless browser noise
    logError('error', e.error||e, guessTool(e));
  });
  window.addEventListener('unhandledrejection', e=>{
    logError('promise', e.reason||e, '');
  });
}
/* best guess at which tool blew up, from the stack */
function guessTool(e){
  const s=(e && e.error && e.error.stack) ? e.error.stack : '';
  const m=s.match(/at build([A-Z]\w+)/);
  if(!m) return '';
  const fn='build'+m[1];
  for(const [id,a] of Object.entries(APPS)) if(a.build && a.build.name===fn) return a.name;
  return '';
}

function githubIssueFallback(kind, text){
  const k=FEEDBACK_KINDS[kind]||FEEDBACK_KINDS.other;
  const caps=capsSummary();
  const recent=errorLog.slice(-3).map(e=>`- **${e.kind}**: ${scrub(e.msg)}${e.where?` (in ${e.where})`:''}\n  \`\`\`\n${scrub(e.stack)||'(no stack)'}\n  \`\`\``).join('\n');
  const body =
`${scrub(text)}

---
### Details
- Version: ${APP_VERSION}
- Browser: ${navigator.userAgent}
- Address: ${location.protocol}//${location.host||'(local file)'}
- Storage: ${storageKind()}
- Backups: ${SETTINGS.bkMode||'off'}
- Class size: ${(STUDENTS||[]).length}
- Features blocked: ${caps.issues.join(', ')||'none'}

### Recent errors
${recent||'_None recorded._'}
`;
  if(!BUG_REPO.includes('YOUR-USERNAME')){
    const url = BUG_REPO.replace(/\/$/,'') + '/issues/new?title='
      + encodeURIComponent(`[${k.tag}] `) + '&body=' + encodeURIComponent(body);
    window.open(url, '_blank', 'noopener');
    return;
  }
  // not published yet — give them something copyable
  const ov=document.createElement('div'); ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal" style="width:min(620px,95vw);min-height:0">
    <div class="modal-head">${k.emoji} ${k.tag}<button class="x" data-close style="margin-left:auto">✕</button></div>

      <textarea class="field" readonly rows="14" style="width:100%;box-sizing:border-box;font-size:11px;font-family:monospace">${esc(body)}</textarea>

    <div class="modal-foot"><button class="btn sm" data-copy>📋 Copy</button><span style="flex:1"></span>
      <button class="btn primary" data-close>Done</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>ov.remove());
  ov.querySelector('[data-copy]').onclick=async e=>{
    try{ await navigator.clipboard.writeText(body); e.currentTarget.textContent='✓ Copied'; }catch(_){}
  };
}

/* ============================================================
   DISCORD REPORTING
   Two webhooks, two channels:
     CRASH_HOOK    — automatic, unattended. Errors the app caught.
     FEEDBACK_HOOK — manual. A teacher deliberately telling us something.
                     Tagged 🐞 Bug / 💡 Idea / 💬 Other so suggestions can
                     feed the roadmap instead of being lost in a bug queue.

   ⚠️ SECURITY: these URLs are visible to anyone who views the page source.
   A leaked webhook can only spam THAT channel — it can't read messages or
   touch the rest of the server. Use throwaway channels; if abused, delete the
   webhook and the app silently falls back to the GitHub issue flow.
   If it ever becomes a problem, put a Cloudflare Worker in front and swap
   these for the proxy URL — no other code changes needed.

   ⚠️ PRIVACY: student names must NEVER leave the machine. Everything sent is
   passed through scrub() first, and we send class SIZE, never the class list.
   ============================================================ */
const CRASH_HOOK    = 'https://discord.com/api/webhooks/1525711041504477328/VtRqpTc8AX_gPIZ8902N7ELLsVaWCpY2GM8iXGzvB0gL0Ci7cZMAetpKsRNhSmKqJxA1';
const FEEDBACK_HOOK = 'https://discord.com/api/webhooks/1525711191937257624/JxsK1-sebiicv7oZtzAQ4sHtWnQbVY397Gvy0GqOogPwYkunzWHJT7LsLoPxiMXpSXU-';

/* Remove anything that could identify a child before it leaves the browser. */
function scrub(text){
  let s = String(text||'');
  // 1. any name from the class list (longest first, so "Anna-Maria" goes before "Anna").
  //    Word-boundary matched, or "Ned" would corrupt "undefined" into "undefi[name]".
  const names=[...(STUDENTS||[])].filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const n of names){
    if(n.length<2) continue;
    const esc=n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s = s.replace(new RegExp('(^|[^\\w])'+esc+'(?![\\w])','gi'), '$1[name]');
  }
  // 2. anything that looks like an email or a URL with a query string
  s = s.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, '[email]');
  s = s.replace(/(https?:\/\/[^\s"']+)/g, m=>m.split('?')[0]+'[...]');
  // 3. long free-text runs (a stack trace shouldn't contain prose; if it does,
  //    it's probably user content that got embedded in an error message)
  s = s.replace(/"[^"]{80,}"/g, '"[long text removed]"');
  return s.slice(0, 1500);
}

/* rate limiting — one broken tool must never flood the channel */
const RL = { sent:0, last:0, max:5 };
function rateOk(){
  const now=Date.now();
  if(RL.sent >= RL.max) return false;             // per page-load ceiling
  if(now - RL.last < 20000) return false;         // no more than one per 20s
  RL.sent++; RL.last=now; return true;
}

function reportingOn(){ return SETTINGS.crashReports===true; }

async function postDiscord(hook, payload){
  if(!hook) return false;
  try{
    const r = await fetch(hook, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    return r.ok;
  }catch(e){ return false; }   // offline, blocked, or webhook deleted — fail quietly
}

function envFields(){
  const caps=capsSummary();
  const f=(name,value,inline)=>({name, value:(String(value||'').trim()||'—'), inline:!!inline});
  return [
    f('Version',  APP_VERSION, true),
    f('Storage',  storageKind(), true),
    f('Backups',  SETTINGS.bkMode||'off', true),
    f('Class size', String((STUDENTS||[]).length), true),   // a NUMBER, never names
    f('Address',  location.protocol+'//'+(location.host||'local file'), true),
    f('Blocked',  caps.issues.join(', ')||'nothing', true),
    f('Browser',  '`'+String(navigator.userAgent||'?').slice(0,120)+'`', false),
  ];
}

/* --- automatic crash report --- */
async function sendCrashReport(entry){
  if(!reportingOn() || demoMode) return false;
  if(!CRASH_HOOK) return false;
  if(!rateOk()) return false;
  const title = (scrub(entry.msg)||'Unknown error').slice(0,240);
  const ok = await postDiscord(CRASH_HOOK, {
    username:'Classroom OS',
    embeds:[{
      title:'💥 '+title,
      color:0xe2574c,
      description: entry.stack ? '```\n'+scrub(entry.stack).slice(0,900)+'\n```' : '_no stack trace_',
      fields:[
        {name:'Where', value: (entry.where||'unknown'), inline:true},
        {name:'Kind',  value: (entry.kind||'error'), inline:true},
        ...envFields(),
      ],
      timestamp: entry.at,
    }],
  });
  return ok;
}

/* --- manual report: bug, idea, or general feedback --- */
const FEEDBACK_KINDS = {
  bug:  {emoji:'🐞', label:'Something is broken', color:0xe2574c, tag:'BUG'},
  idea: {emoji:'💡', label:'I have an idea',      color:0x33a06f, tag:'IDEA'},
  other:{emoji:'💬', label:'Something else',      color:0x3a8dde, tag:'FEEDBACK'},
};
async function sendFeedback(kind, text){
  const k = FEEDBACK_KINDS[kind] || FEEDBACK_KINDS.other;
  if(!FEEDBACK_HOOK) return false;
  const recent = errorLog.slice(-2).map(e=>`• ${scrub(e.msg)}${e.where?` (${e.where})`:''}`).join('\n');
  const fields = [...envFields()];
  // only attach error context to bug reports — an idea doesn't need a stack trace
  if(kind==='bug' && recent) fields.unshift({name:'Recent errors', value:'```\n'+recent.slice(0,500)+'\n```', inline:false});
  const clean = scrub(text) || '(no description)';
  return postDiscord(FEEDBACK_HOOK, {
    username:'Classroom OS',
    embeds:[{
      title:`${k.emoji} [${k.tag}] ${clean.slice(0,80)}${clean.length>80?'…':''}`,
      color:k.color,
      description: clean.slice(0,1200),
      fields,
      timestamp:new Date().toISOString(),
    }],
  });
}

/* ---------- window maximise + snap layouts (split screen) ----------
   Zones are computed from the free area of the screen (below the dock/topbar),
   so snapped windows never hide under the chrome. */
function workArea(){
  const pad=10;
  const top = (document.body.classList.contains('has-demo-bar')?38:0) + 62;   // demo bar + topbar
  const bottom = 96;                                                          // dock
  return { x:pad, y:top, w:window.innerWidth-pad*2, h:window.innerHeight-top-bottom };
}
function placeWin(win, r){
  win.style.left=Math.round(r.x)+'px'; win.style.top=Math.round(r.y)+'px';
  win.style.width=Math.round(r.w)+'px'; win.style.height=Math.round(r.h)+'px';
}
/* Native fullscreen for a single tool — hides ALL browser chrome (tab bar,
   address bar, OS taskbar), so a timer or seating chart fills the projector.
   Distinct from maximise above, which only fills the in-app workspace.
   Falls back to maximise if the browser refuses the request (rare, but e.g.
   some locked-down school devices disable the Fullscreen API). */
let fullWin=null;
function fsElement(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
function toggleWinFull(win){
  if(win.classList.contains('winfull')){ exitWinFull(); return; }
  // a fullscreen window can't also be minimised/snapped — normalise first
  win.style.display='';
  const rq=win.requestFullscreen||win.webkitRequestFullscreen;
  if(rq){
    try{
      Promise.resolve(rq.call(win)).then(()=>{
        fullWin=win; win.classList.add('winfull'); focusWin(win); syncFullBtn(win,true);
      }).catch(()=>fullFallback(win));
    }catch(e){ fullFallback(win); }
  } else fullFallback(win);
}
function fullFallback(win){
  // no native fullscreen available — at least fill the app workspace
  if(win.dataset.max!=='1') toggleWinMax(win);
  pushNote({emoji:'⛶', title:'Fullscreen limited', msg:"This browser blocked true fullscreen, so the tool was maximised instead. Press F11 to hide the browser bar."});
}
function exitWinFull(){
  if(fsElement() && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} }
  if(fullWin){ fullWin.classList.remove('winfull'); syncFullBtn(fullWin,false); const fw=fullWin; fullWin=null; requestAnimationFrame(()=>fitWindowContent(fw)); }
}
function syncFullBtn(win,on){
  const b=win.querySelector('.win-btn.full');
  if(b){ b.textContent = on?'🡼':'⛶'; b.title = on?'Exit fullscreen (Esc)':'Fullscreen (projector mode)'; }
}
/* App-wide fullscreen — the WHOLE ClassroomOS edge-to-edge, browser bars hidden.
   Shares the one native fullscreen slot with per-window fullscreen, so entering
   one exits the other rather than leaving both flags set. */
let appFull=false;
function toggleAppFull(){
  if(appFull || fsElement()===document.documentElement){ exitAppFull(); return; }
  if(fullWin) exitWinFull();                       // give up the slot cleanly first
  const el=document.documentElement, rq=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rq){ try{ Promise.resolve(rq.call(el)).then(()=>{ appFull=true; syncAppFullBtn(); }).catch(()=>{}); }catch(e){} }
  else pushNote({emoji:'⛶', title:'Fullscreen unavailable', msg:'This browser blocked fullscreen. Press F11 to hide the browser bar instead.'});
}
function exitAppFull(){
  if(fsElement() && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} }
  appFull=false; syncAppFullBtn();
}
function syncAppFullBtn(){
  const b=document.getElementById('appfull-btn');
  if(b){ b.textContent = appFull?'🡼':'⛶'; b.classList.toggle('on',appFull);
    b.title = appFull?'Exit fullscreen (Esc)':'Fullscreen — hide all browser bars'; }
  document.body.classList.toggle('app-fullscreen', appFull);
}
/* Esc, F11, or the browser's own exit all fire fullscreenchange — keep our state
   in sync so the button and class never lie about what's happening. */
document.addEventListener('fullscreenchange',()=>{
  if(!fsElement() && fullWin){ fullWin.classList.remove('winfull'); syncFullBtn(fullWin,false); fullWin=null; }
  if(!fsElement() && appFull){ appFull=false; syncAppFullBtn(); }

/* ============================================================
   FIT-TO-WINDOW — scales a tool's content down to fit its window, like zooming
   out, so the whole layout stays visible in a small window (down to a floor).
   Below the floor the body scrolls, which is the "truly tiny" fallback.
   Some tools opt OUT (data-nofit) when their content is already scroll-native
   (long lists) or self-manages layout. ============================================ */
let FIT_MIN_SCALE = 0.14;   // 25% of the original 0.55 — shrink hard for big-TV display
function fitFloor(){ return FIT_MIN_SCALE; }
/* pure: given natural content size and available space, return {scale, floored}.
   Separated from the DOM so the shrink math can be tested headless. */
function computeFitScale(natW, natH, availW, availH){
  if(!natW || !natH || !availW || !availH) return {scale:1, floored:false};
  const floor=fitFloor();
  let scale=Math.min(1, availW/natW, availH/natH);
  const floored = scale < floor;
  if(floored) scale=floor;
  return {scale, floored};
}
function wrapForFit(body){
  if(body.querySelector(':scope > .win-scale')) return body.querySelector(':scope > .win-scale');
  const wrap=document.createElement('div'); wrap.className='win-scale';
  while(body.firstChild) wrap.appendChild(body.firstChild);
  body.appendChild(wrap);
  // when the tool re-renders (adds a student, changes stages…), its natural size
  // changes — re-fit. Guarded: the observer measures at scale 1 inside fit().
  if(typeof ResizeObserver!=='undefined'){
    const win=body.closest('.win');
    let ro=new ResizeObserver(()=>{
      if(!win || !document.body.contains(win)){ ro.disconnect(); return; }
      if(win._fitting) return;        // ignore the size change our OWN transform just caused
      fitWindowContent(win);
    });
    try{ ro.observe(wrap); }catch(e){}
  }
  return wrap;
}
function fitWindowContent(win){
  const body=win.querySelector('.win-body'); if(!body) return;
  if(body.dataset.nofit==='1' || win.classList.contains('winfull')){ // fullscreen has room; no scaling
    const w=body.querySelector(':scope > .win-scale'); if(w){ w.style.transform=''; w.style.width=''; }
    body.classList.remove('scaling','floored'); return;
  }
  const wrap=body.querySelector(':scope > .win-scale'); if(!wrap) return;
  win._fitting=true;   // flag so the observer ignores the reflow WE are about to cause
  try{
    wrap.style.transform='none'; wrap.style.width='';   // measure NATURAL size at scale 1
    const availW=body.clientWidth, availH=body.clientHeight;
    const natW=wrap.scrollWidth, natH=wrap.scrollHeight;
    if(!natW || !natH || !availW || !availH){ return; }
    const {scale, floored} = computeFitScale(natW, natH, availW, availH);
    wrap.style.transform = scale<1 ? `scale(${scale.toFixed(4)})` : '';
    if(scale<1) wrap.style.width=(availW/scale)+'px'; else wrap.style.width='';
    body.classList.add('scaling');
    body.classList.toggle('floored', floored);
  } finally {
    // clear on the next frame so the observer callback triggered by our transform
    // is swallowed — but direct callers (slider, resize) are never blocked
    requestAnimationFrame(()=>{ win._fitting=false; });
  }
}
// re-fit every open window (used on viewport resize)
function fitAllWindows(){ Object.values(openWindows||{}).forEach(w=>{ if(w&&w.style&&w.style.display!=='none') fitWindowContent(w); }); }

/* make a centered .modal user-resizable via a corner grip (pins to fixed pos on first drag) */
function makeModalResizable(modal){
  if(modal.dataset.enh==='1' && modal.querySelector('.modal-resize')) return;   // already enhanced
  modal.dataset.enh='1';
  const grip=document.createElement('div'); grip.className='modal-resize'; modal.appendChild(grip);
  let pinned=false;
  const pin=()=>{ if(pinned)return; const r=modal.getBoundingClientRect();
    modal.style.position='fixed'; modal.style.margin='0'; modal.style.transform='none';
    modal.style.left=r.left+'px'; modal.style.top=r.top+'px';
    modal.style.width=r.width+'px'; modal.style.height=r.height+'px'; modal.style.maxHeight='none';
    pinned=true; };
  // double-click the header to fill the screen (and again to restore)
  const head=modal.querySelector('.modal-head');
  if(head){
    head.dataset.dbl='1';
    head.title='Double-click to maximise';

      if(e.target.closest('button')||e.target.closest('input')||e.target.closest('select')) return;
      if(modal.classList.contains('maxed')){
        modal.classList.remove('maxed');
        if(prev){ modal.style.cssText=prev; prev=null; }
      } else {
        prev=modal.style.cssText;
        modal.classList.add('maxed');
      }
    });
  }
  grip.addEventListener('pointerdown',e=>{
    if(modal.classList.contains('maxed')) return;      // resizing a maximised modal makes no sense
    e.preventDefault(); e.stopPropagation(); pin(); grip.setPointerCapture(e.pointerId);
    const r=modal.getBoundingClientRect(); const sx=e.clientX, sy=e.clientY, ow=r.width, oh=r.height, ol=r.left, ot=r.top;
    const move=ev=>{
      const maxW=window.innerWidth-ol-8, maxH=window.innerHeight-ot-8;
      modal.style.width=Math.max(320,Math.min(maxW, ow+ev.clientX-sx))+'px';
      modal.style.height=Math.max(240,Math.min(maxH, oh+ev.clientY-sy))+'px';
    };
    const up=()=>{ grip.releasePointerCapture(e.pointerId); grip.removeEventListener('pointermove',move); grip.removeEventListener('pointerup',up); };
    grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up);
  });
}

let dockTimer;
function showDock(){ const d=document.getElementById('dock'); d.classList.add('show'); document.getElementById('dock-handle').classList.add('hidden'); clearTimeout(dockTimer); }
function hideDock(){ const d=document.getElementById('dock'); d.classList.remove('show'); document.getElementById('dock-handle').classList.remove('hidden'); }
function flashDock(){
  showDock(); clearTimeout(dockTimer);
  dockTimer=setTimeout(()=>{ if(!document.getElementById('dock').matches(':hover'))hideDock(); },1800);
}
function initDock(){
  const dock=document.getElementById('dock');
  const zone=document.getElementById('dock-zone');
  const handle=document.getElementById('dock-handle');
  zone.addEventListener('mouseenter',showDock);
  handle.addEventListener('mouseenter',showDock);
  handle.addEventListener('click',showDock);
  dock.addEventListener('mouseenter',()=>{clearTimeout(dockTimer);showDock();});
  dock.addEventListener('mouseleave',hideDock);
  // touch has no mouseleave — without this the dock opens and never closes
  document.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse') return;
    if(dock.classList.contains('show') && !dock.contains(e.target)
       && !handle.contains(e.target) && !e.target.closest('#dock-submenu')) hideDock();
  },true);
  const sm=document.getElementById('dock-submenu');
  sm.addEventListener('mouseenter',()=>{ clearTimeout(submenuTimer); clearTimeout(dockTimer); });
  sm.addEventListener('mouseleave',()=>{ hideSubmenuSoon(); hideDock(); });
  // vertical wheel scrolls the dock sideways
  dock.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ dock.scrollLeft+=e.deltaY; e.preventDefault(); }
  },{passive:false});
  // tapping empty desktop closes the dock (handy on touch screens)
  document.getElementById('desktop').addEventListener('click',e=>{ if(e.target.id==='desktop')hideDock(); });
  renderDock();
  flashDock();
}

/* ---------- "Lite mode" signalling ----------
   Several features (Forms, the task-grid iPad view) need a hosted backend to work
   across devices. Unhosted or unconfigured, they still run locally — but the
   teacher must be able to SEE that, rather than wonder why nothing syncs.
   One shared badge + explainer so the language is identical everywhere. */
function backendLive(){

/* ============================================================
   NOTIFICATION HISTORY (today)
   ============================================================ */
let NOTES=[]; let unseen=0; let notifOpen=false;
/* ---------- browser notifications (opt-in) ----------
   Mirrors in-app notifications to real OS/browser pop-ups. Three modes, stored in
   SETTINGS.browserNotify: 'off' (default), 'reminders' (only timed reminders), or
   'all'. Requesting permission is triggered by the user picking a mode, never on
   its own. Blocked on file:// like other browser APIs — we surface that plainly. */
function browserNotifyMode(){ return SETTINGS.browserNotify || 'off'; }
function browserNotifySupported(){ return (typeof Notification!=='undefined') && location.protocol!=='file:'; }
function fireBrowserNote(n, isReminder){
  try{
    const mode=browserNotifyMode();
    if(mode==='off') return;
    if(mode==='reminders' && !isReminder) return;
    if(!browserNotifySupported() || Notification.permission!=='granted') return;
    const note=new Notification((n.emoji?n.emoji+' ':'')+(n.title||'Classroom OS'), {
      body:n.msg||'', tag:'classroomos', silent:true   // the app plays its own sound
    });
    setTimeout(()=>{ try{note.close();}catch(e){} }, 8000);
  }catch(e){}
}
/* Ask the browser for permission, then apply the chosen mode. If the user has
   previously denied it, we can't re-prompt — tell them how to fix it in the browser. */
async function setBrowserNotify(mode, onResult){
  if(mode==='off'){ SETTINGS.browserNotify='off'; saveSettings(); if(onResult)onResult('off'); return; }
  if(!browserNotifySupported()){
    if(onResult)onResult(location.protocol==='file:'?'file':'unsupported'); return;
  }
  if(Notification.permission==='granted'){ SETTINGS.browserNotify=mode; saveSettings(); if(onResult)onResult('granted'); return; }
  if(Notification.permission==='denied'){ if(onResult)onResult('denied'); return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm==='granted'){ SETTINGS.browserNotify=mode; saveSettings(); if(onResult)onResult('granted'); }
    else { if(onResult)onResult(perm); }   // 'denied' or 'default'
  }catch(e){ if(onResult)onResult('error'); }
}

function pushNote(n){
  NOTES.unshift({emoji:n.emoji||'🔔', title:n.title||'', msg:n.msg||'',
    time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
  if(NOTES.length>60)NOTES.pop();
  Store.set('notes',{date:new Date().toDateString(), items:NOTES});
  if(notifOpen){ renderNotes(); } else { unseen++; updateBadge(); }
  fireBrowserNote(n, !!n._reminder);   // mirror to a browser pop-up if opted in
}
function updateBadge(){
  const b=document.getElementById('notif-badge');
  if(unseen>0){ b.textContent=unseen>9?'9+':unseen; b.classList.remove('nhide'); }
  else b.classList.add('nhide');
}
function renderNotes(){
  const wrap=document.querySelector('[data-notes]');
  wrap.innerHTML = NOTES.length?'':'<div class="empty" style="height:auto;padding:24px">Nothing yet today.</div>';
  NOTES.forEach(n=>{const d=document.createElement('div');d.className='note';
    d.innerHTML=`<span class="n-emoji">${n.emoji}</span>
      <div style="flex:1"><div class="n-title">${esc(n.title)}</div>
      ${n.msg?`<div class="n-meta">${esc(n.msg)}</div>`:''}</div>
      <span class="n-meta">${n.time}</span>`;
    wrap.appendChild(d);});
}
function initNotif(){
  const btn=document.getElementById('notif-btn'), panel=document.getElementById('notif-panel');
  btn.onclick=()=>{ notifOpen=!notifOpen; panel.classList.toggle('nhide',!notifOpen);
    if(notifOpen){ unseen=0; updateBadge(); renderNotes(); syncPushUI(); } };
  document.querySelector('[data-clear-notes]').onclick=()=>{ NOTES=[]; Store.set('notes',{date:new Date().toDateString(),items:[]}); renderNotes(); };

  // browser-notification mode buttons
  const seg=panel.querySelector('[data-pushmode]'), hint=panel.querySelector('[data-pushhint]');
  function syncPushUI(){
    const mode=browserNotifyMode();
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.pm===mode));
    if(location.protocol==='file:'){ hint.textContent='⚠️ Browser pop-ups need the app to be hosted (not opened from a file).'; hint.className='notif-pushhint warn'; return; }
    if(typeof Notification==='undefined'){ hint.textContent='This browser doesn\u2019t support pop-up notifications.'; hint.className='notif-pushhint warn'; return; }
    if(mode!=='off' && Notification.permission==='granted'){ hint.textContent='✅ Pop-ups on'+(mode==='reminders'?' for reminders.':' for everything.'); hint.className='notif-pushhint ok'; }
    else if(Notification.permission==='denied'){ hint.textContent='Pop-ups are blocked in your browser settings — allow notifications for this site to use them.'; hint.className='notif-pushhint warn'; }
    else { hint.textContent='Off. Choose Reminders or All to enable browser pop-ups.'; hint.className='notif-pushhint'; }
  }
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    setBrowserNotify(b.dataset.pm, res=>{
      syncPushUI();
      if(res==='denied') hint.textContent='Your browser blocked notifications. Enable them for this site in the address-bar site settings.';
      else if(res==='file') hint.textContent='⚠️ Pop-ups need the hosted app (not a file).';
      else if(res==='granted' && b.dataset.pm!=='off'){ try{ new Notification('🔔 Classroom OS', {body:'Browser pop-ups are on.', silent:true}); }catch(e){} }
    });
  });
  syncPushUI();
  // keep a handle so opening the panel refreshes status (permission can change)
  initNotif._syncPushUI=syncPushUI;

  document.addEventListener('click',e=>{
    if(notifOpen && !panel.contains(e.target) && e.target!==btn && !btn.contains(e.target)){
      notifOpen=false; panel.classList.add('nhide'); }
  });
}

/* ============================================================
   THE YEAR — terms, weeks, and "which week is today?"

   The whole point of planning ahead is that the plan shows up on the board on
   the day. That only works if the app can turn a real date into a term+week,
   which is why terms carry actual start/end dates rather than bare numbers.

   Weeks INHERIT the usual timetable and store only their differences. A teacher
   plans Term 3 Week 2, drops in an excursion on the Wednesday, and only that one
   day of that one week diverges — editing the usual timetable still updates
   every other week at once, which is what they expect.
   ============================================================ */
const MS_DAY = 86400000;
/* Parse 'YYYY-MM-DD' as a LOCAL midnight. `new Date('2026-01-27')` parses as UTC
   and lands on the previous evening for anyone west of Greenwich — which for an
   Australian teacher would put the whole year off by a day. */
function ymdToDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!m) return null;
  const y=+m[1], mo=+m[2], da=+m[3];
  const d = new Date(y, mo-1, da);
  if(isNaN(d)) return null;
  // JS ROLLS OVER: new Date(2026,12,99) is a perfectly valid day in 2027, so a
  // typo like 2026-13-99 would be silently accepted and shift the whole year.
  // Insist the date we built is the date we asked for.
  if(d.getFullYear()!==y || d.getMonth()!==mo-1 || d.getDate()!==da) return null;
  return d;
}
function dateToYmd(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function midnight(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
/* the Monday on or before `d` — weeks are anchored to Monday regardless of the
   day a term happens to begin (a term starting Tue is still "Week 1"). */
function mondayOf(d){
  const x = midnight(d);
  const dow = x.getDay();                 // 0=Sun
  const back = dow===0 ? 6 : dow-1;       // Sunday belongs to the week just gone
  x.setTime(x.getTime() - back*MS_DAY);
  return x;
}
function termWeeks(t){
  const s=ymdToDate(t&&t.start), e=ymdToDate(t&&t.end);
  if(!s||!e||e<s) return 0;
  return Math.floor((mondayOf(e) - mondayOf(s))/(7*MS_DAY)) + 1;
}
function validTerms(){
  return (Array.isArray(TERMS)?TERMS:[])
    .filter(t=>t && ymdToDate(t.start) && ymdToDate(t.end) && termWeeks(t)>0);
}
function termsReady(){ return validTerms().length>0; }
/* the identity for a week's overrides. Stable, human-readable, greppable. */
function weekKey(term, week){ return 't'+term+'w'+week; }
/* Which term+week does a real date fall in? Null during the holidays, or when
   terms were never set up — both of which mean "just use the usual timetable". */
function termWeekFor(date){
  const d = midnight(date||new Date());
  for(const t of validTerms()){
    const s=ymdToDate(t.start), e=ymdToDate(t.end);
    if(d < mondayOf(s) || d > e) continue;
    const wk = Math.floor((mondayOf(d) - mondayOf(s))/(7*MS_DAY)) + 1;
    if(wk < 1 || wk > termWeeks(t)) continue;
    return {term:t.n, week:wk, key:weekKey(t.n,wk)};
  }
  return null;
}
/* The date a given term+week's Monday falls on. */
function mondayOfWeek(term, week){
  const t = validTerms().find(x=>x.n===term);
  if(!t) return null;
  const m = mondayOf(ymdToDate(t.start));
  m.setTime(m.getTime() + (week-1)*7*MS_DAY);
  return m;
}
function dateOfWeekday(term, week, dow){
  const m = mondayOfWeek(term, week);
  if(!m) return null;
  const off = dow===0 ? 6 : dow-1;        // Mon..Sun laid out from that Monday
  const d = new Date(m); d.setTime(d.getTime() + off*MS_DAY);
  return d;
}
function fmtDayDate(d){
  return d ? d.toLocaleDateString([], {day:'numeric', month:'short'}) : '';
}
/* --- the override layer --- */
function weekOverride(key){ const o=WEEKPLAN&&WEEKPLAN[key]; return (o&&typeof o==='object'&&!Array.isArray(o))?o:null; }
function dayOverride(key, dow){
  const o = weekOverride(key); if(!o) return null;
  const list = o[dow];
  return Array.isArray(list) ? list : null;
}
function weekHasOverrides(key){ const o=weekOverride(key); return !!(o && Object.keys(o).length); }
function overriddenDays(key){ const o=weekOverride(key); return o?Object.keys(o).map(Number):[]; }
/* THE resolver. Base timetable, unless this exact week+day was changed.
   Everything that displays a day goes through here. */
function baseDay(dow){ return (SCHEDULE.days&&SCHEDULE.days[dow])||[]; }
function resolveDay(dow, key){
  const ov = key ? dayOverride(key, dow) : null;
  return (ov || baseDay(dow) || []).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
}
/* Today, as the board should show it: this week's plan if there is one. */
function todayKey(){ const tw=termWeekFor(new Date()); return tw?tw.key:null; }

/* ============================================================
   DAILY SCHEDULE RAIL (auto-ticks through today's sessions)
   ============================================================ */
let schedHover=false, schedEnabled=true, schedLevel='mini', schedHoverTimer, schedPinned=false;
/* schedLocked is the USER'S "keep the rail open" pin — persisted, and separate
   from schedPinned (a transient internal hold that keeps the rail up mid-drag).
   Overloading schedPinned would let a card-drag silently release the user's pin. */
let schedLocked=false;
function hmNow(){ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
function todayList(){ return resolveDay(new Date().getDay(), todayKey()); }
function activeIndex(list, now){ let idx=-1; for(let i=0;i<list.length;i++){ if(list[i].start<=now) idx=i; else break; } return idx; }
function toggleSchedule(){ schedEnabled=!schedEnabled; SETTINGS.schedEnabled=schedEnabled; saveSettings(); schedHover=false; renderSchedule(); renderDock(); }
function renderSchedule(){
  const rail=document.getElementById('sched-rail');
  if(!rail || !SCHEDULE || !SCHEDULE.days) return;   // not ready yet (can be called early via HIST.after)
  const list=todayList(), side=(SCHEDULE.side==='right'?'right':'left'), hasToday=list.length>0;
  // NOTE: the rail stays up even on a day with no sessions (e.g. a weekend), otherwise
  // there'd be no toggle tab left to click and no way back into the editor.
  rail.style.display = schedEnabled?'flex':'none';
  if(!schedEnabled) return;
  rail.className = side+' '+schedLevel+((schedHover||schedLocked)?' open':'')+(schedPinned?' pinned':'')+(schedLocked?' locked':'');
  // let the min-tray dodge to the opposite corner: rail visible on the left means
  // the tray (also bottom-left) would collide, so flag the body to flip it right.
  const railLeftVisible = schedEnabled && side==='left';
  document.body.classList.toggle('rail-left', railLeftVisible);
  const now=hmNow(), act=hasToday?activeIndex(list,now):-1;
  const nowItem = (act>=0 && list[act]) ? list[act] : null;
  const minIcon = nowItem ? (nowItem.emoji||'🗓️') : '🗓️';
  const chevron = schedLevel==='hidden' ? minIcon : (side==='right'?'»':'«');
  rail.innerHTML=`
    <div class="sched-head">
      <div class="sched-headrow">
        <button class="sched-toggle" title="${schedLevel==='hidden'?('Show schedule'+(nowItem?' — now: '+esc(nowItem.label):'')):'Collapse to bar'}">${chevron}</button>
        <button class="sched-hbtn sched-pin${schedLocked?' on':''}" title="${schedLocked?'Unpin — let the schedule tuck away':'Pin the schedule open'}">📌</button>
        <button class="sched-hbtn sched-cards" title="Subject cards — drag onto a session">🎴</button>
        <button class="sched-hbtn sched-cog" title="Edit schedule">⚙️</button>
      </div>
      <span class="sched-today">Today${(()=>{ const tw=termWeekFor(new Date());
        if(!tw) return '';
        const diff = !!dayOverride(tw.key, new Date().getDay());
        return `<span class="sched-tw" title="Term ${tw.term}, Week ${tw.week}${diff?' — today differs from your usual timetable':''}">T${tw.term} · W${tw.week}${diff?' <span class="sched-diff" title="This day was planned separately">✱</span>':''}</span>`;
      })()}</span>
    </div>
    <div class="sched-list">`
    +(hasToday?'':`<div class="sched-item sched-empty"><div class="sched-emoji">💤</div><div class="sched-text"><span class="sched-label">Nothing on today</span><span class="sched-detail">Open the editor to add sessions</span></div></div>`)
    +list.map((s,i)=>`<div class="sched-item ${i===act?'now':(i<act?'done':'')}">
        <div class="sched-emoji">${s.emoji||'•'}</div>
        <div class="sched-text"><span class="sched-label">${esc(s.label)}</span>
          ${s.detail?`<span class="sched-detail">${esc(s.detail)}</span>`:''}
          <span class="sched-time">${s.start}${list[i+1]?' – '+list[i+1].start:''}</span></div>
      </div>`).join('')
    +`</div>`;
  rail.querySelectorAll('.sched-list .sched-item:not(.sched-empty)').forEach((el,i)=>{
    const sess=list[i]; if(!sess) return;
    const links=(sess.links||[]).filter(l=>l&&l.url);
    if(links.length){ el.classList.add('has-links'); el.addEventListener('mouseenter',()=>showFlyout(el,links,sess)); el.addEventListener('mouseleave',hideFlyout); }
    // drop a subject card straight onto today's session — the velcro board move.
    // Write to whichever layer today is actually being READ from: if this week
    // already differs, the change belongs to this week alone. Otherwise it's a
    // change to the usual timetable, exactly as it always was.
    makeSubjDrop(el, subj=>{
      const today=new Date().getDay(), key=todayKey();
      const overridden = !!(key && dayOverride(key, today));
      const day = overridden ? dayOverride(key, today) : (SCHEDULE.days[today]||[]);
      const target=day.find(x=>x.start===sess.start && x.label===sess.label) || day[i];
      if(!target) return;
      if(subj==='__clear'){ target.subjId=null; target.emoji=''; target.label=''; target.links=(target.links||[]).filter(l=>!l._fromSubj); }
      else applySubjectToSession(target, subj);
      if(overridden) Store.set('weekplan', WEEKPLAN); else Store.set('schedule',SCHEDULE);
      renderSchedule();
    });
  });
  const tgl=rail.querySelector('.sched-toggle');
  if(tgl) tgl.onclick=e=>{ e.stopPropagation(); schedLevel = schedLevel==='hidden'?'mini':'hidden'; SETTINGS.schedLevel=schedLevel; saveSettings(); schedHover=false; renderSchedule(); };
  const pin=rail.querySelector('.sched-pin');
  if(pin) pin.onclick=e=>{ e.stopPropagation();
    schedLocked=!schedLocked; SETTINGS.schedLocked=schedLocked;
    // pinning a collapsed rail should actually reveal it, else nothing appears to happen

function pinSchedule(on){
  schedPinned=!!on;
  if(schedPinned){ clearTimeout(schedHoverTimer); if(!schedHover){ schedHover=true; renderSchedule(); } }
  else { schedHoverTimer=setTimeout(()=>{ if(!schedPinned){ schedHover=false; renderSchedule(); } },300); }

function initSchedule(){
  const rail=document.getElementById('sched-rail');
  const onEnter=()=>{ clearTimeout(schedHoverTimer); if(!schedHover){ schedHover=true; renderSchedule(); } };
  const onLeave=()=>{ clearTimeout(schedHoverTimer);
    if(schedPinned||schedLocked) return;          // tray/drag active, or user pinned it open — stay
    schedHoverTimer=setTimeout(()=>{ if(!schedPinned&&!schedLocked){ schedHover=false; renderSchedule(); } },160); };
  rail.addEventListener('mouseenter',onEnter); rail.addEventListener('mouseleave',onLeave);
  // keep the rail up for the whole drag, wherever the card came from
  document.addEventListener('dragstart',e=>{ try{ if([...e.dataTransfer.types].includes('text/subject')) pinSchedule(true); }catch(_){} });
  document.addEventListener('dragend',()=>{ if(!cardTrayOpen && !document.querySelector('.modal-overlay')) pinSchedule(false); });
  const fly=document.getElementById('sched-flyout');

}

/* ============================================================

   "today is Term 3, Week 2" on its own.
   Defaults to 4 terms x 10 weeks (the AU norm), but every date is editable, so
   a 9-week term, a 3-term year or a northern-hemisphere calendar all work.
   ============================================================ */
function defaultTerms(){
  return [1,2,3,4].map(n=>({n, start:'', end:''}));
}
/* Given a start date, the end of a `weeks`-long term = Friday of the last week. */
function suggestEnd(start, weeks){
  const s=ymdToDate(start); if(!s) return '';
  const m=mondayOf(s);
  const end=new Date(m.getTime() + ((weeks||10)-1)*7*MS_DAY + 4*MS_DAY);  // +4 = Friday
  return dateToYmd(end);
}

/* ---- WEEK PLANNER: collapsed subjects ----
   Lunch, recess, the morning routine: fixed, resource-free, and they eat the
   vertical space a teacher needs for the lessons that actually change. Collapsing
   is keyed by LABEL, not by session, so folding "Lunch" folds it on all five days
   at once. Pure so the fold logic is testable without a DOM.
   An empty label can never be folded — otherwise a blank new session would vanish
   with no way to click it back. */
function weekCollapseKey(label){ return String(label==null?'':label).trim().toLowerCase(); }
function weekIsCollapsed(label, list){
  const k=weekCollapseKey(label);
  return !!k && Array.isArray(list) && list.indexOf(k)>=0;
}
function weekToggleCollapse(label, list){
  const k=weekCollapseKey(label);
  const cur=Array.isArray(list)?list.filter(x=>typeof x==='string'):[];
  if(!k) return cur;                                  // never fold an untitled session
  const out=cur.filter(x=>x!==k);
  if(out.length===cur.length) out.push(k);            // wasn't folded -> fold it
  return out;
}
function weekCollapsedList(){
  const v=SETTINGS.weekCollapsed;
  return Array.isArray(v)?v.filter(x=>typeof x==='string'):[];
}

function openScheduleEditor(onSaved){

       base  — the usual timetable (SCHEDULE.days). Changing it changes every week.
       plan  — per-week overrides (WEEKPLAN). Changing a day here changes that week only.
     `editKey` decides which one an edit lands in: null = the usual timetable. */
  const base=JSON.parse(JSON.stringify(SCHEDULE.days||{}));
  const plan=JSON.parse(JSON.stringify(WEEKPLAN||{}));
  const nowTW=termWeekFor(new Date());
  let editTerm = nowTW?nowTW.term:null;

  const baseOf=d=>(base[d]||(base[d]=[]));
  function isOverridden(d, key){ const o=key&&plan[key]; return !!(o && Array.isArray(o[d])); }
  /* Read a day as the teacher sees it: their override if one exists, else the usual. */
  function readDay(d){
    if(editKey && isOverridden(d, editKey)) return plan[editKey][d];

     the first edit to a day forks it off the usual timetable — from then on that
     day belongs to that week alone. Editing the usual timetable writes straight

  function writeDay(d){
    if(!editKey) return baseOf(d);
    if(!plan[editKey]) plan[editKey]={};
    if(!Array.isArray(plan[editKey][d])) plan[editKey][d]=JSON.parse(JSON.stringify(baseOf(d)));
    return plan[editKey][d];
  }

    if(!editKey || !plan[editKey]) return;
    delete plan[editKey][d];
    if(!Object.keys(plan[editKey]).length) delete plan[editKey];
