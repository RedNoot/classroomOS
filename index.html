    const src=JSON.stringify(readDay(editDay)||[]);
    list.forEach(d=>{ const tgt=writeDay(d); tgt.length=0; JSON.parse(src).forEach(x=>tgt.push(x)); });
    redraw(); flash(msg);
  };
  overlay.querySelector('[data-copy-wd]').onclick=()=>copyTo([1,2,3,4,5],'Copied to weekdays');
  overlay.querySelector('[data-copy-all]').onclick=()=>copyTo([0,1,2,3,4,5,6],'Copied to every day');
  function flash(t){ const s=overlay.querySelector('[data-save]'); const o=s.textContent; s.textContent=t; setTimeout(()=>s.textContent=o,1200); }
  // ---------- subject tray + day templates ----------
  const tray=overlay.querySelector('[data-tray]'), tplPick=overlay.querySelector('[data-tpl-pick]');
  const cardsBtn=overlay.querySelector('[data-cards]');
  /* The tray is a palette you deploy, not permanent chrome — same gesture as the
     rail's 🎴 button. Hidden by default; opens over the content; folds itself in
     Week view (every cell is already a drop target there) and the instant a drag
     starts (you don't need the palette while carrying a card to a slot). */
  let trayOpen=false;
  function renderTray(){
    tray.innerHTML='';
    if(!SUBJECTS.length){ tray.innerHTML='<span class="hint">No subject cards yet — add some in ⚙️ Set up → Subjects.</span>'; return; }
    SUBJECTS.forEach(s=>tray.appendChild(makeSubjChip(s)));
    const clr=document.createElement('div'); clr.className='subj-chip subj-clear'; clr.draggable=true;
    clr.innerHTML='<span class="subj-emoji">🚫</span><span class="subj-name">Clear</span>';
    clr.title='Drag onto a session to empty it';
    clr.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/subject','__clear'); e.dataTransfer.effectAllowed='copy'; });
    tray.appendChild(clr);
  }
  function showTray(on){
    // Week view: cells are drop targets, so the palette is never shown there.
    const canShow = on && weekView.style.display==='none';
    trayOpen = canShow;
    tray.hidden = !canShow;
    if(canShow) renderTray();
    cardsBtn.classList.toggle('on', canShow);
  }
  cardsBtn.onclick=()=>showTray(!trayOpen);
  // fold the palette the moment a card is picked up
  overlay.addEventListener('dragstart',e=>{
    try{ if([...e.dataTransfer.types].includes('text/subject')) showTray(false); }catch(_){}
  });
  function renderTplPick(){
    tplPick.innerHTML='<option value="">Apply template…</option>'
      + SCHED_TPL.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')
      + (SCHED_TPL.length?'<option value="__manage">— Manage templates…</option>':'');
  }
  overlay.querySelector('[data-subjects]').onclick=()=>openSubjectsEditor(()=>{ if(trayOpen)renderTray(); renderRows(); if(weekView.style.display!=='none')renderWeek(); });
  overlay.querySelector('[data-tpl-save]').onclick=()=>{
    const list=readDay(editDay)||[];
    if(!list.length){ flash('Nothing to save'); return; }
    const nm=prompt('Name this template:', DOW[editDay]+' plan');
    if(nm===null) return;
    const name=(nm||'').trim()||'Untitled';
    const ex=SCHED_TPL.find(t=>t.name.toLowerCase()===name.toLowerCase());
    const slots=tplFromDay(list);
    if(ex){ if(!confirm(`Replace the existing "${ex.name}" template?`)) return; ex.slots=slots; }
    else SCHED_TPL.push({id:'t'+Date.now().toString(36), name, slots});
    Store.set('sched_tpl', SCHED_TPL); renderTplPick(); flash('Template saved');
  };
  tplPick.onchange=()=>{
    const v=tplPick.value; tplPick.value='';
    if(!v) return;
    if(v==='__manage'){ manageTpl(); return; }
    const t=SCHED_TPL.find(x=>x.id===v); if(!t) return;
    if(!readDay(editDay).length){ alert('Add some time slots to this day first — a template only fills in which subject goes where.'); return; }
    const where = editKey ? `${DOW[editDay]} of Term ${editTerm} Week ${editWeek}` : `${DOW[editDay]} in your usual timetable`;
    const n=readDay(editDay).length;
    if(!confirm(`Fill ${where} (${n} session${n>1?'s':''}) using "${t.name}"?\n\nTimes stay as they are — only the subjects change.`)) return;
    const hasDetail=readDay(editDay).some(s=>(s.detail||'').trim());
    const wipe=hasDetail ? confirm('Also clear the existing lesson details?\n\nOK = fresh start for a new week.\nCancel = keep what you have written.') : false;
    applyTplToDay(writeDay(editDay), t.slots, wipe);   // fork first — templates are an edit
    redraw(); flash('Applied "'+t.name+'"');
  };
  function manageTpl(){
    const ov=document.createElement('div'); ov.className='modal-overlay';
    ov.innerHTML=`<div class="modal" style="width:min(460px,94vw)">
      <div class="modal-head">📋 Day templates<button class="x" data-close style="margin-left:auto">✕</button></div>
      <div class="modal-body"><div data-tl></div></div>
      <div class="modal-foot"><button class="btn primary" data-close style="margin-left:auto">Done</button></div></div>`;
    document.body.appendChild(ov);
    const tl=ov.querySelector('[data-tl]');
    function draw(){
      tl.innerHTML='';
      if(!SCHED_TPL.length){ tl.innerHTML='<div class="hint">No templates saved yet.</div>'; return; }
      SCHED_TPL.forEach((t,i)=>{
        const filled=t.slots.filter(Boolean).length;
        const r=document.createElement('div'); r.className='row'; r.style.marginBottom='6px';
        r.innerHTML=`<b style="flex:1">${esc(t.name)}</b><span class="hint">${filled}/${t.slots.length} filled</span>
          <button class="btn sm ghost" data-rn>✎</button><button class="btn sm danger ghost" data-rm>🗑</button>`;
        r.querySelector('[data-rn]').onclick=()=>{ const n=prompt('Rename template:', t.name); if(n&&n.trim()){ t.name=n.trim(); Store.set('sched_tpl',SCHED_TPL); draw(); renderTplPick(); } };
        r.querySelector('[data-rm]').onclick=()=>{ SCHED_TPL.splice(i,1); Store.set('sched_tpl',SCHED_TPL); draw(); renderTplPick(); };
        tl.appendChild(r);
      });
    }
    draw();
    ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>ov.remove());
    ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  }
  renderTplPick();   // tray renders lazily when 🎴 Cards is opened
  const close=()=>overlay.remove();
  overlay.querySelector('[data-cancel]').onclick=close;
  overlay.addEventListener('mousedown',e=>{ if(e.target===overlay)close(); });
  const tidy=list=>(list||[]).filter(s=>s.start)
    .map(s=>({...s, links:(s.links||[]).filter(l=>l && l.url && l.url.trim())}))
    .sort((a,b)=>a.start.localeCompare(b.start));
  overlay.querySelector('[data-save]').onclick=()=>{
    Object.keys(base).forEach(d=>{ base[d]=tidy(base[d]); });
    // Prune. An override that ended up identical to the usual timetable is not a
    // plan — it's noise. Dropping it keeps storage small and stops a week showing
    // a "planned" dot for a change that was made and then undone.
    Object.keys(plan).forEach(k=>{
      const wk=plan[k];
      if(!wk || typeof wk!=='object'){ delete plan[k]; return; }
      Object.keys(wk).forEach(d=>{
        wk[d]=tidy(wk[d]);
        if(JSON.stringify(wk[d])===JSON.stringify(base[d]||[])) delete wk[d];
      });
      if(!Object.keys(wk).length) delete plan[k];
    });
    SCHEDULE.days=base; WEEKPLAN=plan;
    Store.set('schedule',SCHEDULE); Store.set('weekplan',WEEKPLAN);
    close(); renderSchedule(); if(onSaved)onSaved();
  };
  redraw();
}

/* ============================================================
   SLIDES — PDF / image deck shown as a full-screen backdrop,
   with OS chrome (schedule, notifications, tools) over the top.
   Decks are held in memory for the session.
   ============================================================ */
let SLIDES=[], slideIdx=0, stageOn=false, SLIDE_EMBED='', slidesFull=false;
function setSlidesFull(on){
  slidesFull=on;
  document.body.classList.toggle('slides-full', on);
  const b=document.getElementById('slide-full');
  if(b) b.textContent = on ? '🡼 Exit full' : '⛶ Fullscreen';
  if(on){
    const el=document.documentElement, rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(rq){ try{ rq.call(el); }catch(e){} }
  } else if(document.fullscreenElement && document.exitFullscreen){
    try{ document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && slidesFull) setSlidesFull(false); });
function normalizeEmbed(u){
  u=(u||'').trim();
  if(/\/embed/.test(u)) return u;                       // already an embed URL
  const g=u.match(/docs\.google\.com\/presentation\/d\/([A-Za-z0-9_-]+)/);
  if(g && u.includes('/edit')) return `https://docs.google.com/presentation/d/${g[1]}/embed?start=false&loop=false`;
  return u;                                              // OneDrive / Office / other embed src as-is
}
function applySlideOverlay(){
  const present = stageOn && (SLIDES.length || SLIDE_EMBED);
  const o = SETTINGS.slideOverlay || {rail:true, notif:true};
  document.body.classList.toggle('hide-rail',  present && o.rail===false);
  document.body.classList.toggle('hide-notif', present && o.notif===false);
}
function renderStage(){
  const stage=document.getElementById('slide-stage');
  const img=document.getElementById('slide-img'), frame=document.getElementById('slide-frame');
  const prev=document.getElementById('slide-prev'), next=document.getElementById('slide-next'), cnt=document.getElementById('slide-count');
  const controls=document.getElementById('slide-controls');
  const embedOn = stageOn && !!SLIDE_EMBED;
  const imgOn   = stageOn && !SLIDE_EMBED && SLIDES.length>0;
  const on = embedOn || imgOn;
  stage.classList.toggle('nhide',!on);
  controls.classList.toggle('nhide',!on);
  document.body.classList.toggle('presenting', on);
  if(!on && slidesFull) setSlidesFull(false);
  img.style.display   = imgOn?'':'none';
  frame.style.display = embedOn?'':'none';
  if(embedOn){ if(frame.src!==SLIDE_EMBED) frame.src=SLIDE_EMBED; }
  else if(frame.src){ frame.src='about:blank'; }
  if(imgOn){ img.src=SLIDES[slideIdx]||''; cnt.textContent=(slideIdx+1)+' / '+SLIDES.length; }
  // OS prev/next arrows + counter only make sense for the static image deck
  prev.classList.toggle('nhide',!imgOn); next.classList.toggle('nhide',!imgOn); cnt.classList.toggle('nhide',!imgOn);
  applySlideOverlay();
}
function updateController(){
  const c=document.querySelector('[data-slide-counter]'); if(c)c.textContent=(slideIdx+1)+' / '+SLIDES.length;
  const thumbs=document.querySelectorAll('.thumb'); thumbs.forEach((t,i)=>t.classList.toggle('on',i===slideIdx));
  const act=document.querySelector('.thumb.on'); if(act)act.scrollIntoView({inline:'center',block:'nearest'});
}
function gotoSlide(i){ if(!SLIDES.length)return; slideIdx=Math.max(0,Math.min(SLIDES.length-1,i)); renderStage(); updateController(); }
function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function renderPdfToSlides(file, prog){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    if(prog) prog.textContent=`Rendering slide ${p} of ${pdf.numPages}…`;
    const page=await pdf.getPage(p);
    const base=page.getViewport({scale:1});
    const scale=Math.min(2, 1500/base.width);
    const vp=page.getViewport({scale});
    const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    out.push(canvas.toDataURL('image/jpeg',0.85));
  }
  SLIDES=out;
  if(prog) prog.textContent=`${SLIDES.length} slides ready.`;
}
function initSlides(){
  function exitStage(){ if(slidesFull) setSlidesFull(false); stageOn=false; renderStage(); refreshOpen(['slides']); }
  document.getElementById('slide-prev').onclick=()=>gotoSlide(slideIdx-1);
  document.getElementById('slide-next').onclick=()=>gotoSlide(slideIdx+1);
  document.getElementById('slide-img').onclick=()=>gotoSlide(slideIdx+1);
  document.getElementById('slide-full').onclick=()=>setSlidesFull(!slidesFull);
  document.getElementById('slide-exit').onclick=exitStage;
  document.addEventListener('keydown',e=>{
    if(!stageOn) return;
    if(e.key==='Escape'){ if(slidesFull){ setSlidesFull(false); return; } exitStage(); return; }
    if(!SLIDES.length || SLIDE_EMBED) return;   // embed decks navigate via their own player
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||e.target.isContentEditable) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ gotoSlide(slideIdx+1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ gotoSlide(slideIdx-1); e.preventDefault(); }
  });
}

function buildSlides(body){
  function render(){ if(SLIDE_EMBED) embedControls(); else if(SLIDES.length) imageControls(); else chooser(); }

  function chooser(){
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:14px">
        <div class="slide-drop" style="text-align:left">
          <div class="row"><span style="font-size:26px">🎞️</span><b>Embed a live deck — keeps animations</b></div>
          <div class="hint" style="margin:6px 0 10px">In Google Slides: <b>File → Share → Publish to web → Embed</b>, copy the link. In PowerPoint/OneDrive: <b>Embed</b>, copy the iframe src. Paste it here:</div>
          <div class="row"><input class="field" data-embed placeholder="Paste slides embed/share link…" style="flex:1"><button class="btn primary sm" data-embed-go>Use</button></div>
        </div>
        <div class="slide-drop" style="text-align:left;opacity:.9">
          <div class="row"><span style="font-size:22px">🖼️</span><b>Or upload PDF / images</b> <span class="tag" style="background:var(--surface-2);border:1px solid var(--line)">no animations</span></div>
          <div class="hint" style="margin:6px 0 10px">Static fallback for decks without animations.</div>
          <input type="file" accept="application/pdf,image/*" multiple data-file>
        </div>

      </div>`;
    body.querySelector('[data-embed-go]').onclick=()=>setEmbed(body.querySelector('[data-embed]').value);

  function embedControls(){
    const o=SETTINGS.slideOverlay||{rail:true,notif:true};
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:10px">
        <div class="row"><button class="btn ${stageOn?'primary':''}" data-toggle>${stageOn?'● On screen':'▶ Show on screen'}</button>
          <span class="tag" style="background:var(--good);color:#fff;margin-left:auto">Live · animations on</span></div>
        <div class="hint" style="word-break:break-all">${esc(SLIDE_EMBED)}</div>
        <div class="hint">Advance the deck using its own on-slide controls (click it / its arrows) — animations play through the real presenter engine.</div>
        <div>
          <div class="muted" style="font-weight:800;margin-bottom:6px">Show over slides</div>
          <div class="tool-toggle" style="margin-bottom:6px"><span style="font-size:16px">🗓️</span><span>Schedule rail</span><button class="switch ${o.rail!==false?'on':''}" data-ov="rail"></button></div>
          <div class="tool-toggle"><span style="font-size:16px">🔔</span><span>Notifications</span><button class="switch ${o.notif!==false?'on':''}" data-ov="notif"></button></div>
        </div>
        <div class="row" style="margin-top:auto"><button class="btn sm" data-change>Change link</button><button class="btn sm danger ghost" data-clear>Clear</button></div>
      </div>`;
    body.querySelector('[data-toggle]').onclick=()=>{ stageOn=!stageOn; renderStage(); render(); };
    body.querySelector('[data-change]').onclick=()=>{ SLIDE_EMBED=''; Store.set('slide_embed',''); stageOn=false; renderStage(); render(); };
    body.querySelector('[data-clear]').onclick=()=>{ SLIDE_EMBED=''; Store.set('slide_embed',''); stageOn=false; renderStage(); render(); };
    wireOverlay();
  }

  function imageControls(){
    const o=SETTINGS.slideOverlay||{rail:true,notif:true};
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:10px">
        <div class="row"><button class="btn ${stageOn?'primary':''}" data-toggle>${stageOn?'● On screen':'▶ Show on screen'}</button>
          <span class="pill" data-slide-counter style="margin-left:auto">${slideIdx+1} / ${SLIDES.length}</span></div>
        <div class="row" style="justify-content:center"><button class="btn sm" data-prev>‹ Prev</button><button class="btn sm" data-next>Next ›</button></div>
        <div class="thumb-strip" data-thumbs></div>
        <div>
          <div class="muted" style="font-weight:800;margin-bottom:6px">Show over slides</div>
          <div class="tool-toggle" style="margin-bottom:6px"><span style="font-size:16px">🗓️</span><span>Schedule rail</span><button class="switch ${o.rail!==false?'on':''}" data-ov="rail"></button></div>
          <div class="tool-toggle"><span style="font-size:16px">🔔</span><span>Notifications</span><button class="switch ${o.notif!==false?'on':''}" data-ov="notif"></button></div>
        </div>
        <div class="row"><input type="file" accept="application/pdf,image/*" multiple data-file style="flex:1"><button class="btn sm danger ghost" data-clear>Clear</button></div>
        <div class="hint" data-prog>Tip: arrow keys ← → flick through · Esc hides. Open any tool to layer it over the deck.</div>
      </div>`;
    const ts=body.querySelector('[data-thumbs]');
    SLIDES.forEach((src,i)=>{ const t=document.createElement('div'); t.className='thumb'+(i===slideIdx?' on':''); t.innerHTML=`<img src="${src}">`; t.onclick=()=>gotoSlide(i); ts.appendChild(t); });
    body.querySelector('[data-toggle]').onclick=()=>{ stageOn=!stageOn; renderStage(); render(); };
    body.querySelector('[data-prev]').onclick=()=>gotoSlide(slideIdx-1);
    body.querySelector('[data-next]').onclick=()=>gotoSlide(slideIdx+1);
    body.querySelector('[data-clear]').onclick=()=>{ SLIDES=[]; slideIdx=0; stageOn=false; renderStage(); render(); };
    wireOverlay(); wireUpload();
  }

  function wireOverlay(){
    body.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.ov; const ov=SETTINGS.slideOverlay||(SETTINGS.slideOverlay={rail:true,notif:true});
      ov[k] = !(ov[k]!==false); b.classList.toggle('on', ov[k]); saveSettings(); applySlideOverlay();
    });
  }
  function wireUpload(){
    const fi=body.querySelector('[data-file]'); if(!fi)return;
    fi.onchange=async e=>{ const files=[...e.target.files]; if(files.length) await loadFiles(files); render(); };
  }
  function setEmbed(v){
    const url=normalizeEmbed(v); if(!url){ return; }
    SLIDE_EMBED=url; SLIDES=[]; Store.set('slide_embed',url); stageOn=true; renderStage(); render();
  }
  async function loadFiles(files){
    const prog=body.querySelector('[data-prog]');
    const pdf=files.find(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
    if(pdf){
      if(typeof pdfjsLib==='undefined'){ if(prog)prog.innerHTML='📵 <b>PDF engine didn\'t load.</b> It needs an internet connection, and is often blocked when the file is opened straight from your computer. Upload page images instead, or host the app at a web address (see Settings → Your data).'; return; }
      try{ await renderPdfToSlides(pdf, prog); SLIDE_EMBED=''; slideIdx=0; stageOn=true; renderStage(); }
      catch(e){ if(prog)prog.textContent='Could not read that PDF.'; }
      return;
    }
    const imgs=files.filter(f=>/^image\//.test(f.type));
    if(imgs.length){ const arr=[]; for(const f of imgs){ arr.push(await fileToDataURL(f)); } SLIDES=arr; SLIDE_EMBED=''; slideIdx=0; stageOn=true; renderStage(); }
  }
  render();
}

/* ============================================================
   APP: TIMER  (countdown + stopwatch)
   ============================================================ */
function buildTimer(body){
  body.innerHTML=`
    <div class="center-col">
      <div class="seg" data-mode>
        <button data-m="count" class="on">Countdown</button>
        <button data-m="watch">Stopwatch</button>
      </div>
      <div class="big-num" data-disp>05:00</div>
      <div class="row" style="justify-content:center" data-presets>
        <button class="btn sm" data-add="60">+1m</button>
        <button class="btn sm" data-add="300">+5m</button>
        <button class="btn sm" data-add="600">+10m</button>
        <button class="btn sm" data-set="0">Clear</button>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-go>Start</button>
        <button class="btn" data-reset>Reset</button>
      </div>
      <div class="row" style="justify-content:center" data-sndrow>${soundPickerHTML(toolSound('timer'),'When time\u2019s up')}</div>
    </div>`;
  wireSoundPicker(body.querySelector('[data-sndrow]'), v=>setToolSound('timer',v));
  let mode='count', total=300, remain=300, running=false, t0, raf, base=0;
  const disp=body.querySelector('[data-disp]');
  const goBtn=body.querySelector('[data-go]');
  const presets=body.querySelector('[data-presets]');
  const fmt=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60),ss=s%60;return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`};
  function show(){ disp.textContent = mode==='count'?fmt(remain):fmt(base); }
  function tick(){
    if(!running)return;
    const el=(performance.now()-t0)/1000;
    if(mode==='count'){
      remain=total-el;
      if(remain<=0){remain=0;running=false;goBtn.textContent='Start';toast({emoji:'⏱️',title:'Time is up!',sound:toolSound('timer'),dismiss:false});show();return;}
    }else{ base=el; }
    show(); raf=requestAnimationFrame(tick);
  }
  goBtn.onclick=()=>{
    running=!running;
    if(running){ goBtn.textContent='Pause'; t0=performance.now()-(mode==='count'?(total-remain):base)*1000; tick(); }
    else { goBtn.textContent='Start'; cancelAnimationFrame(raf); }
  };
  body.querySelector('[data-reset]').onclick=()=>{running=false;goBtn.textContent='Start';cancelAnimationFrame(raf);
    if(mode==='count'){remain=total;}else{base=0;} show();};
  presets.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{total+=+b.dataset.add;remain=total;running=false;goBtn.textContent='Start';cancelAnimationFrame(raf);show();});
  presets.querySelector('[data-set]').onclick=()=>{total=0;remain=0;show();};
  body.querySelectorAll('[data-mode] button').forEach(b=>b.onclick=()=>{
    body.querySelectorAll('[data-mode] button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    mode=b.dataset.m;running=false;goBtn.textContent='Start';cancelAnimationFrame(raf);
    presets.style.display=mode==='count'?'flex':'none';
    if(mode==='watch')base=0; else {remain=total;}
    show();
  });
  show();
}

/* ============================================================
   APP: NOISE METER (live microphone)
   ============================================================ */
function buildNoise(body){
  body.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%;gap:12px">
      <div class="center-col" style="height:auto;gap:8px">
        <div style="font-size:52px" data-emoji>🎤</div>
        <div style="width:100%;position:relative;padding-top:4px">
          <div class="noise-bar"><div class="noise-fill" data-fill></div></div>
          <div data-marker title="Noise limit" style="position:absolute;top:0;width:3px;height:34px;background:var(--bad);border-radius:2px;transform:translateX(-1px)"></div>
        </div>
        <div class="muted" data-lbl>Tap “Start” to begin listening</div>
      </div>

      <div class="row" style="justify-content:center">
        <button class="btn primary" data-start>🎤 Start</button>
        <button class="btn" data-stop style="display:none">⏹ Stop</button>
      </div>

      <div class="row" style="justify-content:center;gap:8px">
        <span class="muted">Limit</span>
        <input type="range" min="5" max="100" value="55" class="field" data-thresh style="padding:0;max-width:170px">
        <span class="pill" data-tval>55</span>
      </div>

      <div class="center-col" style="height:auto;gap:2px">
        <div class="muted">Times over the limit</div>
        <div class="big-num" data-count style="font-size:60px">0</div>
        <button class="btn sm" data-reset>Reset counter</button>
      </div>

      <div class="hint" data-hint>The bar shows live volume. When the class crosses the red line it dings and adds one to the counter.</div>
    </div>`;

  const fill=body.querySelector('[data-fill]'), emo=body.querySelector('[data-emoji]'), lbl=body.querySelector('[data-lbl]');
  const marker=body.querySelector('[data-marker]'), thresh=body.querySelector('[data-thresh]'), tval=body.querySelector('[data-tval]');
  const startBtn=body.querySelector('[data-start]'), stopBtn=body.querySelector('[data-stop]');
  const countEl=body.querySelector('[data-count]'), hint=body.querySelector('[data-hint]');

  const levels=[
    {max:20,c:'var(--good)',e:'🤫',t:'Silent'},
    {max:45,c:'var(--good)',e:'🙂',t:'Quiet working'},
    {max:70,c:'var(--warn)',e:'😐',t:'Partner talk'},
    {max:90,c:'var(--warn)',e:'😮',t:'Getting loud'},
    {max:101,c:'var(--bad)',e:'🙉',t:'Too loud!'},
  ];
  function placeMarker(){ marker.style.left = thresh.value + '%'; tval.textContent = thresh.value; }
  function render(level){
    fill.style.width=level+'%';
    const L=levels.find(l=>level<l.max)||levels[levels.length-1];
    fill.style.background=L.c; emo.textContent=L.e; lbl.textContent=L.t;
  }
  Store.get('noise',{threshold:55}).then(d=>{ thresh.value=d.threshold; placeMarker(); });
  thresh.oninput=()=>{ placeMarker(); Store.set('noise',{threshold:+thresh.value}); };
  placeMarker();

  let ac, stream, analyser, raf, running=false, smoothed=0, over=false, lastDing=0, count=0;
  countEl.textContent=count;
  body.querySelector('[data-reset]').onclick=()=>{ count=0; countEl.textContent=0; };

  function cleanup(){
    running=false; cancelAnimationFrame(raf);
    try{ if(stream) stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    try{ if(ac) ac.close(); }catch(e){}
    startBtn.style.display='inline-block'; stopBtn.style.display='none';
    emo.textContent='🎤'; lbl.textContent='Stopped'; fill.style.width='0%';
  }
  stopBtn.onclick=cleanup;

  startBtn.onclick=async()=>{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      hint.textContent='This view can’t access a microphone. Open the screen in its own browser tab and try again.'; return;
    }
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(err){
      hint.textContent = err.name==='NotAllowedError'
        ? 'Microphone permission was blocked. Allow mic access (or open this in its own browser tab), then tap Start again.'
        : 'Couldn’t start the microphone ('+err.name+'). Some embedded previews block mic access — opening in a normal browser tab usually fixes it.';
      return;
    }
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);
    analyser=ac.createAnalyser(); analyser.fftSize=512;
    src.connect(analyser);
    const buf=new Uint8Array(analyser.fftSize);
    running=true; startBtn.style.display='none'; stopBtn.style.display='inline-block';
    hint.textContent='Listening… adjust the limit so normal working volume sits just under the red line.';

    const tick=()=>{
      if(!running) return;
      if(!document.contains(body)){ cleanup(); return; } // window closed
      analyser.getByteTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
      const rms=Math.sqrt(sum/buf.length);
      const level=Math.min(100, rms*400);
      smoothed = smoothed*0.82 + level*0.18;
      render(smoothed);
      const t=+thresh.value;
      if(smoothed>t){
        if(!over && performance.now()-lastDing>1200){
          over=true; lastDing=performance.now(); count++; countEl.textContent=count; tone('ding');
        }
      } else if(smoothed < t-7){ over=false; }  // hysteresis so it re-arms cleanly
      raf=requestAnimationFrame(tick);
    };
    tick();
  };
}

/* ============================================================
   WHEEL helper (used by spinner + jobs)
   ============================================================ */
function drawWheel(canvas, items){
  const ctx=canvas.getContext('2d'); const N=items.length||1;
  const S=canvas.width=canvas.height=420; const r=S/2;
  const cols=['#3a8dde','#27ae60','#f1a23b','#e2574c','#8e6cef','#16b5b5','#e85aa0','#6aa84f'];
  ctx.clearRect(0,0,S,S);
  if(!items.length){ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(r,r,r-4,0,7);ctx.fill();return;}
  const ang=2*Math.PI/N;
  items.forEach((it,i)=>{
    ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r-4,i*ang-Math.PI/2,(i+1)*ang-Math.PI/2);ctx.closePath();
    ctx.fillStyle=cols[i%cols.length];ctx.fill();
    ctx.save();ctx.translate(r,r);ctx.rotate(i*ang+ang/2-Math.PI/2);
    ctx.fillStyle='#fff';ctx.font='bold 18px Nunito,sans-serif';ctx.textAlign='right';
    ctx.fillText(String(it).slice(0,14), r-18, 6);ctx.restore();
  });
}
function spinWheel(canvas, items, cb){
  if(!items.length)return;
  const N=items.length, pick=Math.floor(Math.random()*N);
  const ang=360/N; const target=360*6 + (360 - (pick*ang + ang/2));
  canvas.style.transition='transform 4s cubic-bezier(.17,.67,.2,1)';
  canvas.style.transform=`rotate(${target}deg)`;
  setTimeout(()=>{ canvas.style.transition='none'; const final=target%360;
    canvas.style.transform=`rotate(${final}deg)`; cb(items[pick]); }, 4100);
}

/* ============================================================
   APP: GROUPS / PARTNERS
   ============================================================ */
/* Pure group solver — no DOM, so it's testable. Shuffles students into groups
   while honouring the seating relationships: KEEP-TOGETHER pairs land in the same
   group, KEEP-APART pairs avoid sharing one. Random-restart with the same scoring
   idea as the seating auto-seater: an apart-violation costs 10, a split pair costs
   1, so it will break a "friends" pairing before it forces two keep-apart kids
   together. Returns {groups, apartViol, splitViol}. */
function groupStudents(opts){
  const {students, mode, n, kept, apart, restarts=400} = opts;
  const K = kept.map(p=>[p[0].toLowerCase(), p[1].toLowerCase()]);
  // apart is now PAIRWISE — specific [a,b] tuples that must not share a group
  // (mirrors the seating keep-apart pairs), not a flat "any two flagged" list.
  const A = (apart||[]).map(p=>[p[0].toLowerCase(), p[1].toLowerCase()]);
  const apartSet = new Set(A.map(p=>[...p].sort().join('\u0000')));
  const areApart = (x,y) => apartSet.has([x.toLowerCase(),y.toLowerCase()].sort().join('\u0000'));
  const total = students.length;
  const groupCount = mode==='size'
    ? Math.max(1, Math.ceil(total/Math.max(1,n)))
    : Math.max(1, Math.min(n, total||1));
  const score = groups => {
    const where = {}; groups.forEach((g,gi)=>g.forEach(s=>where[s.toLowerCase()]=gi));
    let apartViol=0, splitViol=0;
    // count specific keep-apart pairs that ended up in the same group
    for(const [a,b] of A){ if(where[a]!=null && where[b]!=null && where[a]===where[b]) apartViol++; }
    for(const [a,b] of K){ if(where[a]!=null && where[b]!=null && where[a]!==where[b]) splitViol++; }
    return {apartViol, splitViol, total:apartViol*10+splitViol};
  };
  const partnersOf = s => K.filter(p=>p[0]===s.toLowerCase()||p[1]===s.toLowerCase())
                           .map(p=>p[0]===s.toLowerCase()?p[1]:p[0]);
  let best=null, bestScore={total:Infinity,apartViol:0,splitViol:0};
  for(let attempt=0; attempt<restarts && bestScore.total>0; attempt++){
    const order=students.slice().sort(()=>Math.random()-.5);
    const groups=Array.from({length:groupCount},()=>[]);
    const cap = mode==='size' ? Math.max(1,n) : Math.ceil(total/groupCount);
    const placed=new Set();
    const put=(s,gi)=>{ groups[gi].push(s); placed.add(s.toLowerCase()); };
    const scoreGroupFor=(s,gi)=>{
      const g=groups[gi], gl=g.map(x=>x.toLowerCase());
      let sc=0;
      if(g.some(x=>areApart(s,x))) sc+=100;                                       // a keep-apart partner here
      if(gl.some(x=>K.some(([p,q])=>(p===s.toLowerCase()&&q===x)||(q===s.toLowerCase()&&p===x)))) sc-=50; // a partner here
      sc += g.length>=cap ? g.length*2 : 0;                                       // gentle balance
      return sc + Math.random();
    };
    const placeBest=s=>{
      if(placed.has(s.toLowerCase())) return;
      let bestGi=0, bestSc=Infinity;
      groups.forEach((g,gi)=>{ const sc=scoreGroupFor(s,gi); if(sc<bestSc){ bestSc=sc; bestGi=gi; } });
      put(s,bestGi);
      // pull not-yet-placed partners in — but NOT if it would put a keep-apart
      // partner of theirs in the group (keep-apart outranks keep-together)
      for(const m of partnersOf(s)){
        if(placed.has(m)) continue;
        const mm=students.find(x=>x.toLowerCase()===m); if(!mm) continue;
        if(groups[bestGi].some(x=>areApart(mm,x))) continue;   // would clash — leave for its own turn
        put(mm,bestGi);
      }
    };
    order.forEach(placeBest);
    const sc=score(groups);
    if(sc.total<bestScore.total){ bestScore=sc; best=groups.map(g=>g.slice()); }
  }
  return {groups:best||[], apartViol:bestScore.apartViol, splitViol:bestScore.splitViol};
}

function buildGroups(body){
  const anyConstraints=()=>seatPairs().length||seatApartPairs().length;
  body.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%;gap:10px">
      <div class="row">
        <span class="muted">Make</span>
        <div class="seg" data-by><button data-b="size" class="on">By group size</button><button data-b="num">By # of groups</button></div>

        <button class="btn primary" data-go style="margin-left:auto">Shuffle</button></div>
      <label class="row gp-respect" data-respectrow style="gap:6px"><input type="checkbox" data-respect checked>
        <span class="muted">Respect seating links (🔗 together, 🚩 apart)</span></label>
      <div data-warn class="gp-warn" style="display:none"></div>
      <div data-out class="list" style="flex:1;overflow:auto"></div>
      <div class="hint" data-src>Uses your class list.</div>
    </div>`;
  let by='size';
  const out=body.querySelector('[data-out]'), unit=body.querySelector('[data-unit]');
  const warn=body.querySelector('[data-warn]'), respectRow=body.querySelector('[data-respectrow]');
  const respectEl=body.querySelector('[data-respect]');
  // only show the "respect links" control when there ARE links to respect
  respectRow.style.display = anyConstraints()?'flex':'none';
  body.querySelectorAll('[data-by] button').forEach(b=>b.onclick=()=>{
    body.querySelectorAll('[data-by] button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    by=b.dataset.b; unit.textContent=by==='size'?'per group':'groups';});
  body.querySelector('[data-src]').textContent = STUDENTS.length?`Uses your class list (${STUDENTS.length} students).`:'No class list yet — add students in the Name Picker.';
  body.querySelector('[data-go]').onclick=()=>{
    if(!STUDENTS.length){out.innerHTML='<div class="empty">Add students first 🙂</div>';return;}
    const n=Math.max(1,+body.querySelector('[data-n]').value);
    const respect=respectEl.checked && anyConstraints();
    let groups, apartViol=0, splitViol=0;
    if(respect){
      const r=groupStudents({students:STUDENTS, mode:by, n, kept:seatPairs(), apart:seatApartPairs()});
      groups=r.groups; apartViol=r.apartViol; splitViol=r.splitViol;
    } else {
      const sh=[...STUDENTS].sort(()=>Math.random()-.5);
      if(by==='size'){groups=[];for(let i=0;i<sh.length;i+=n)groups.push(sh.slice(i,i+n));}
      else{groups=Array.from({length:Math.max(1,Math.min(n,sh.length))},()=>[]);sh.forEach((s,i)=>groups[i%groups.length].push(s));}
    }
    // warning line, mirroring the seating chart's "couldn't satisfy" surfacing
    const msgs=[];
    if(apartViol) msgs.push(`⚠ ${apartViol} keep-apart pair${apartViol>1?'s':''} had to share a group`);
    if(splitViol) msgs.push(`💛 ${splitViol} preferred pair${splitViol>1?'s':''} couldn't be grouped together`);
    if(msgs.length){ warn.style.display=''; warn.innerHTML=msgs.join(' &nbsp;·&nbsp; '); }
    else warn.style.display='none';
    out.innerHTML='';
    groups.forEach((g,i)=>{
      const d=document.createElement('div');d.className='list-item';
      d.style.flexDirection='column';d.style.alignItems='flex-start';
      // colour each name: green if it shares its group with a linked partner,
      // red if it shares with a keep-apart clash (so the teacher can see at a glance)
      const gl=g.map(x=>x.toLowerCase());
      const names=g.map(s=>{
        const kept = respect && partnersList(s).some(m=>gl.includes(m.toLowerCase()));
        const clash= respect && g.some(o=>o!==s && isApart(s,o));
        const cls = clash?'gp-clash':(kept?'gp-kept':'');
        return `<span class="${cls}">${esc(s)}</span>`;
      }).join(' · ');
      d.innerHTML=`<span class="tag" style="background:var(--accent);color:var(--accent-ink)">Group ${i+1}</span><div class="gp-names">${names}</div>`;
      out.appendChild(d);
    });
  };
}

function buildQueue(body){
  body.innerHTML=`

/* ============================================================
   APP: POMODORO / FOCUS
   ============================================================ */
function buildPomodoro(body){
  body.innerHTML=`
    <div class="center-col">
      <div class="pill" data-phase>Focus</div>
      <div class="big-num" data-disp>25:00</div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-go>Start</button>
        <button class="btn" data-skip>Skip</button>
        <button class="btn sm" data-reset>Reset</button>
      </div>
      <div class="row" style="justify-content:center">
        <span class="muted">Focus</span><input type="number" class="field" data-f value="25" style="width:64px">
        <span class="muted">Break</span><input type="number" class="field" data-b value="5" style="width:64px">
      </div>
      <div class="row" style="justify-content:center" data-sndrow>${soundPickerHTML(toolSound('pomodoro'),'Phase change')}</div>
      <div class="muted" data-done>Sessions completed: 0</div>
    </div>`;
  wireSoundPicker(body.querySelector('[data-sndrow]'), v=>setToolSound('pomodoro',v));
  let phase='focus', running=false, remain=25*60, raf, t0, sessions=0;
  const disp=body.querySelector('[data-disp]'),ph=body.querySelector('[data-phase]'),go=body.querySelector('[data-go]');
  const fmt=s=>{s=Math.max(0,Math.round(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
  const dur=()=> (phase==='focus'?+body.querySelector('[data-f]').value:+body.querySelector('[data-b]').value)*60;
  function setPhase(p){phase=p;ph.textContent=p==='focus'?'🍅 Focus':'☕ Break';remain=dur();disp.textContent=fmt(remain);}
  function tick(){if(!running)return;remain=dur()-(performance.now()-t0)/1000;
    if(remain<=0){running=false;go.textContent='Start';
      if(phase==='focus'){sessions++;body.querySelector('[data-done]').textContent='Sessions completed: '+sessions;}
      toast({emoji:phase==='focus'?'☕':'🍅',title:phase==='focus'?'Break time!':'Back to focus!',sound:toolSound('pomodoro'),dismiss:false});
      setPhase(phase==='focus'?'break':'focus');return;}
    disp.textContent=fmt(remain);raf=requestAnimationFrame(tick);}
  go.onclick=()=>{running=!running;if(running){go.textContent='Pause';t0=performance.now()-(dur()-remain)*1000;tick();}else{go.textContent='Start';cancelAnimationFrame(raf);}};
  body.querySelector('[data-skip]').onclick=()=>{running=false;go.textContent='Start';cancelAnimationFrame(raf);setPhase(phase==='focus'?'break':'focus');};
  body.querySelector('[data-reset]').onclick=()=>{running=false;go.textContent='Start';cancelAnimationFrame(raf);setPhase('focus');sessions=0;body.querySelector('[data-done]').textContent='Sessions completed: 0';};
  setPhase('focus');
}

  function upd(){
    Store.set('countdown',{label:lab.value,date:dt.value});
    if(!dt.value){days.textContent='—';sub.textContent='pick a date';return;}
    const today=new Date();today.setHours(0,0,0,0);

    days.textContent=Math.abs(diff);

  }
  lab.oninput=upd; dt.oninput=upd;
}

/* ============================================================
   APP: REMINDERS  (with weekday scheduling)
   ============================================================ */
const DOW_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_DISPLAY=[1,2,3,4,5,6,0]; // Mon-first display order, values are getDay() indices
function recurLabel(days){
  if(!days||!days.length) return 'Once';
  if(days.length===7) return 'Daily';
  if(days.length===5 && [1,2,3,4,5].every(d=>days.includes(d))) return 'Weekdays';
  return DOW_DISPLAY.filter(d=>days.includes(d)).map(d=>DOW_SHORT[d]).join(', ');
}
function nextFire(r, now){
  const [h,m]=r.time.split(':').map(Number);
  const days=(r.days&&r.days.length)?r.days:null;
  for(let i=0;i<8;i++){
    const dt=new Date(now); dt.setDate(now.getDate()+i); dt.setHours(h,m,0,0);
    if(dt<=now) continue;
    if(!days || days.includes(dt.getDay())) return dt;
  }
  const dt=new Date(now); dt.setHours(h,m,0,0); return dt;
}
function nextLabel(r){
  const now=new Date(), dt=nextFire(r,now);
  const t=dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const tom=new Date(now); tom.setDate(now.getDate()+1);
  if(dt.toDateString()===now.toDateString()) return 'Today '+t;
  if(dt.toDateString()===tom.toDateString()) return 'Tom '+t;
  return DOW_SHORT[dt.getDay()]+' '+t;
}
function buildReminders(body){
  const soundOpts=Object.entries(SOUND_PRESETS).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join('');
  body.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%;gap:10px">
      <div class="row" data-newbar>
        <button class="btn primary sm" data-new>➕ New reminder</button>

          <input type="time" class="field" data-time style="width:auto">
          <select class="field" data-sound style="width:auto">${soundOpts}</select>
          <button class="btn sm ghost" data-preview title="Hear this sound">🔊</button>
          <label class="row" style="gap:5px;margin-left:auto"><input type="checkbox" data-dismiss> <span class="muted">Auto-dismiss</span></label>
        </div>
        <div>
          <div class="row" style="margin-bottom:5px">
            <span class="muted">Repeat on:</span>
            <button class="btn sm ghost" data-preset="once">Once</button>
            <button class="btn sm ghost" data-preset="daily">Daily</button>
            <button class="btn sm ghost" data-preset="week">Weekdays</button>
          </div>
          <div class="dow-row" data-dow></div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn primary sm" data-add style="flex:1">Add reminder</button>
          <button class="btn sm ghost" data-cancel>Cancel</button>
        </div>
      </div>
      <div class="rm-vol">
        <span title="Volume for all reminder sounds">🔉</span>
        <input type="range" min="0" max="100" data-vol style="flex:1">
        <span class="muted" data-volnum style="width:38px;text-align:right"></span>
        <button class="btn sm ghost" data-voltest title="Test volume">▶</button>
      </div>
      <div class="list" data-list style="flex:1;overflow:auto"></div>
      <div class="hint">Reminders fire while this tab is open. Leave all days off for a one-time reminder today.</div>
    </div>`;

  const list=body.querySelector('[data-list]'), dowWrap=body.querySelector('[data-dow]');
  const labelEl=body.querySelector('[data-label]'), timeEl=body.querySelector('[data-time]');
  const soundEl=body.querySelector('[data-sound]'), dismissEl=body.querySelector('[data-dismiss]');
  const addBtn=body.querySelector('[data-add]'), cancelBtn=body.querySelector('[data-cancel]');
  let selDays=new Set(), editId=null;
  // build day chips (Mon-first)
  DOW_DISPLAY.forEach(d=>{
    const b=document.createElement('button');b.className='dow';b.textContent=DOW_SHORT[d][0];
    b.title=DOW_SHORT[d];
    b.onclick=()=>{ if(selDays.has(d))selDays.delete(d); else selDays.add(d); b.classList.toggle('on'); };
    dowWrap.appendChild(b);
  });
  function setDays(arr){ selDays=new Set(arr);
    [...dowWrap.children].forEach((b,i)=>b.classList.toggle('on',selDays.has(DOW_DISPLAY[i]))); }
  body.querySelector('[data-preset="once"]').onclick=()=>setDays([]);
  body.querySelector('[data-preset="daily"]').onclick=()=>setDays([0,1,2,3,4,5,6]);
  body.querySelector('[data-preset="week"]').onclick=()=>setDays([1,2,3,4,5]);
  body.querySelector('[data-preview]').onclick=()=>tone(soundEl.value);

  // volume slider — global, drives every reminder + preview
  const volEl=body.querySelector('[data-vol]'), volNum=body.querySelector('[data-volnum]');
  function syncVol(){ const v=Math.round(soundVol()*100); volEl.value=v; volNum.textContent=v+'%'; }
  volEl.oninput=()=>{ SETTINGS.soundVolume=(+volEl.value)/100; volNum.textContent=volEl.value+'%'; saveSettings(); };
  volEl.onchange=()=>tone(soundEl.value);                 // hear the level when you let go
  body.querySelector('[data-voltest]').onclick=()=>tone(soundEl.value);
  syncVol();

  // The form is a drawer, not the default view — the list of existing reminders is.
  // It opens only for an explicit "new" or an edit, and closes again on save/cancel.
  const formWrap=body.querySelector('[data-form]'), newBar=body.querySelector('[data-newbar]');
  function openForm(){ formWrap.style.display='flex'; newBar.style.display='none'; labelEl.focus(); }
  function closeForm(){ formWrap.style.display='none'; newBar.style.display=''; }
  function clearForm(){
    editId=null; labelEl.value=''; timeEl.value=''; dismissEl.checked=false; setDays([]);
    addBtn.textContent='Add reminder';
  }
  body.querySelector('[data-new]').onclick=()=>{ clearForm(); openForm(); render(); };

  // enter "edit" mode: load a reminder back into the form
  function beginEdit(r){
    editId=r.id;
    labelEl.value=r.label; timeEl.value=r.time; soundEl.value=r.sound||'ding';

    addBtn.textContent='Save changes';
    openForm(); render();
  }
  function endEdit(){ clearForm(); closeForm(); render(); }
  cancelBtn.onclick=endEdit;

  function render(){
    if(!REMINDERS.length){ list.innerHTML='<div class="empty">No reminders set yet.<br>Tap ➕ New reminder to make one.</div>'; return; }
    const now=new Date();
    const sorted=[...REMINDERS].sort((a,b)=>nextFire(a,now)-nextFire(b,now));
    list.innerHTML='<div class="muted" style="margin:2px 0 6px;font-weight:800">Upcoming</div>';
    sorted.forEach(r=>{
      const repeating=r.days&&r.days.length>0;
      const d=document.createElement('div');d.className='list-item'+(r.id===editId?' editing':'');
      d.innerHTML=`<span class="tag" style="background:var(--accent);color:var(--accent-ink)">${nextLabel(r)}</span>
        <span style="flex:1">${repeating?'🔁 ':'📌 '}${esc(r.label)} <span class="muted" style="font-size:11px">· ${esc((SOUND_PRESETS[r.sound]||SOUND_PRESETS.ding).label)}</span></span>
        <span class="tag" style="background:var(--surface-2);border:1px solid var(--line)">${recurLabel(r.days)}</span>
        <button class="btn sm ghost" data-edit title="Edit">✎</button>
        <button class="btn sm ghost" data-test title="Test now">▶</button><button class="x" title="Delete">✕</button>`;
      d.querySelector('[data-edit]').onclick=()=>beginEdit(r);
      d.querySelector('.x').onclick=()=>{REMINDERS=REMINDERS.filter(x=>x.id!==r.id);Store.set('reminders',REMINDERS);if(editId===r.id)endEdit();render();};
      d.querySelector('[data-test]').onclick=()=>fireReminder(r);
      list.appendChild(d);
    });
  }
  addBtn.onclick=()=>{
    const label=labelEl.value.trim();
    const time=timeEl.value;
    if(!label||!time)return;
    const fields={label,time,sound:soundEl.value,dismiss:dismissEl.checked,days:[...selDays].sort()};
    if(editId!=null){
      const r=REMINDERS.find(x=>x.id===editId);
      if(r){ Object.assign(r,fields); r._fired=''; }   // clear fired flag so an edited time can fire again today
      endEdit();
    } else {
      REMINDERS.push({id:Date.now(),...fields,_fired:''});
      clearForm(); closeForm();
    }
    Store.set('reminders',REMINDERS);
    render();
  };
  render();
}
function fireReminder(r){
  toast({emoji:'🔔',title:r.label,msg:'Reminder · '+r.time,sound:r.sound,dismiss:r.dismiss,ms:8000,reminder:true});
}

/* reminder clock loop */
/* Pure decision: given a reminder and 'now', should it fire, be dropped, or wait?
   Returns 'fire' | 'drop' | 'mark' | 'skip'. Separated so the catch-up window and
   day/once logic can be tested without clocks or audio.
     fire = ring it now      drop = stale one-off, remove it
     mark = repeating, already-passed today beyond the window — mark done, keep
     skip = not due / not today / already fired */
function reminderDecision(r, nowMins, dow, today, windowMins=60){
  if(!r || !r.time) return 'skip';
  const [hh,mm]=String(r.time).split(':').map(Number);
  if(!Number.isFinite(hh)||!Number.isFinite(mm)) return 'skip';
  const rMins=hh*60+mm;
  const days=r.days||[];
  const isOnce=days.length===0;
  if(!(isOnce || days.includes(dow))) return 'skip';   // not scheduled today
  if(rMins>nowMins) return 'skip';                     // still in the future
  if(nowMins-rMins > windowMins) return isOnce?'drop':'mark';   // too stale to ring
  if(r._fired===today+' '+r.time) return 'skip';       // already fired today
  return 'fire';
}
/* Fires due reminders. Robust against background-tab throttling: browsers slow or
   pause setInterval when the tab isn't focused, so a reminder's exact minute can
   be skipped entirely. Instead of only firing when time===now, we fire any
   reminder whose time has ALREADY PASSED today and hasn't fired yet today. The
   per-day `_fired` stamp still prevents double-firing. Also called on focus
   (visibilitychange) so a missed reminder rings the moment you return. */
function reminderLoop(){
  const now=new Date();
  const dow=now.getDay();
  const nowMins=now.getHours()*60+now.getMinutes();
  const today=now.toDateString();
  let changed=false;
  REMINDERS.forEach(r=>{
    const decision=reminderDecision(r, nowMins, dow, today);
    if(decision==='skip') return;
    if(decision==='drop'){ REMINDERS=REMINDERS.filter(x=>x.id!==r.id); changed=true; return; }
    if(decision==='mark'){ r._fired = today+' '+r.time; return; }
    // decision==='fire'
    r._fired=today+' '+r.time; fireReminder(r);
    if((r.days||[]).length===0){ REMINDERS=REMINDERS.filter(x=>x.id!==r.id); }
    changed=true;
  });
  if(changed){ Store.set('reminders',REMINDERS); refreshOpen(['reminders']); }
}

/* ============================================================
   TASK GRID — STUDENT VIEW (single front-of-room iPad)
   A full-screen, stripped-down board: tap a name to advance, ↺ to step back —
   the SAME interaction as the teacher's board. Teacher notes show but can't be
   edited here. Polls GridSyncAPI so the teacher's changes appear; pushes taps
   back so the laptop reflects them. Unhosted, it still works as a local mirror
   (same device) so the layout can be tried before hosting. ================= */
function openGridStudentView(boardId){
  document.body.classList.add('grid-student-mode');
  let host=document.getElementById('grid-student');
  if(!host){ host=document.createElement('div'); host.id='grid-student'; document.body.appendChild(host); }
  let board=null, saving=false, pullTimer=null;

  async function loadBoard(){
    if(GridSyncAPI.live()){
      const row=await GridSyncAPI.pull(boardId);
      if(row){ board={id:row.id,name:row.name,stages:row.stages||[],status:row.status||{},notes:row.notes||{}}; return; }
    }
    const g=await Store.get('grid', null);
    if(g && g.boards){ board = g.boards.find(b=>b.id===boardId) || g.boards[0]; }
  }
  async function persist(){
    if(GridSyncAPI.live()){ saving=true; await GridSyncAPI.push(board); saving=false; }
    else {
      const g=await Store.get('grid', null);
      if(g && g.boards){ const i=g.boards.findIndex(b=>b.id===board.id); if(i>=0){ g.boards[i]=board; await Store.set('grid', g); } }
    }
  }
  const noteKey=(name,idx)=>name+'\u0000'+idx;

  function render(){
    if(!board){ host.innerHTML='<div class="gs-empty">Loading board…</div>'; return; }
    const last=board.stages.length-1;
    const cards=(STUDENTS.length?studentList():Object.keys(board.status)).map(name=>{
      const idx=Math.min(board.status[name]||0,last), stage=board.stages[idx]||{emoji:'',label:''}, done=idx>=last;
      const note=(board.notes||{})[noteKey(name,idx)]||'';
      return `<div class="gs-card${done?' done':''}${note?' has-note':''}" data-name="${esc(name)}">
        <button class="gs-back" title="Step back" data-back>↺</button>
        <div class="gs-emoji">${stage.emoji||''}</div>
        <div class="gs-name">${esc(name)}</div>
        <div class="gs-stage">${esc(stage.label||'')}${done?' ✓':''}</div>
        ${note?`<div class="gs-note">✎ ${esc(note)}</div>`:''}
      </div>`;
    }).join('');
    host.innerHTML=`
      <div class="gs-head">
        <div class="gs-title">${esc(board.name||'Task board')}</div>
        <div class="gs-track">${board.stages.map(s=>`${s.emoji} ${esc(s.label)}`).join(' <span class="gs-arrow">→</span> ')}</div>
        <button class="gs-full" title="Fullscreen" data-full>⛶</button>
        <button class="gs-exit" title="Exit student view" data-exit>✕</button>
      </div>
      <div class="gs-grid">${cards||'<div class="gs-empty">No students on this board yet.</div>'}</div>
      <div class="gs-foot">Tap your name to move forward · ↺ to step back${GridSyncAPI.live()?'':' · <b>◐ Lite mode</b> (same device only)'}</div>`;

    host.querySelectorAll('.gs-card').forEach(card=>{
      const name=card.dataset.name;
      card.onclick=e=>{ if(e.target.closest('[data-back]'))return;
        const cur=board.status[name]||0; if(cur<last){ board.status[name]=cur+1; tone(board.status[name]>=last?'chime':'blip'); render(); persist(); } };
      card.querySelector('[data-back]').onclick=e=>{ e.stopPropagation();
        const cur=board.status[name]||0; if(cur>0){ board.status[name]=cur-1; render(); persist(); } };
    });
    host.querySelector('[data-full]').onclick=()=>{ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); };
    host.querySelector('[data-exit]').onclick=()=>closeGridStudentView();
  }

  async function refresh(){ await loadBoard(); render(); }
  refresh();
  if(GridSyncAPI.live()) pullTimer=setInterval(async()=>{ if(!saving){ const row=await GridSyncAPI.pull(boardId);
    if(row){ board={id:row.id,name:row.name,stages:row.stages||[],status:row.status||{},notes:row.notes||{}}; render(); } } }, 4000);
  host._cleanup=()=>{ if(pullTimer) clearInterval(pullTimer); };
}
function closeGridStudentView(){
  const host=document.getElementById('grid-student');
  if(host){ if(host._cleanup)host._cleanup(); host.remove(); }
  document.body.classList.remove('grid-student-mode');
  try{ if(typeof URL!=='undefined' && history.replaceState){ const u=new URL(location.href); u.searchParams.delete('grid'); u.searchParams.delete('board'); history.replaceState(null,'',u.toString()); } }catch(e){}
}

/* ============================================================
   APP: TASK GRID — multiple boards, each with ordered stages
   GRID = { active:id, boards:[{id,name,stages:[{emoji,label}],status:{}}] }
   ============================================================ */
function activeBoard(){ return GRID.boards.find(b=>b.id===GRID.active) || GRID.boards[0]; }
function buildTaskGrid(body){
  body.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%;gap:10px">
      <div class="row">
        <select class="field" data-board style="flex:1"></select>
        <button class="btn sm" data-new title="New task board">＋</button>
        <button class="btn sm" data-rename title="Rename">✎</button>
        <button class="btn sm danger" data-del title="Delete board">🗑</button>
      </div>
      <div data-name-panel style="display:none">
        <div class="row"><input class="field" data-name-input placeholder="Board name (e.g. Writing, Maths)">
          <button class="btn primary sm" data-name-ok>OK</button>
          <button class="btn sm ghost" data-name-cancel>Cancel</button></div>
      </div>
      <div class="row" style="justify-content:space-between">
        <div class="stage-track" data-track style="flex:1"></div>
        <button class="btn sm" data-ipad title="Show a QR so a front-of-room iPad can open this board">📲 iPad${backendLive()?'':' <span class="lite-dot" title="Lite mode — same-device only until hosted">◐</span>'}</button>
        <button class="btn sm" data-edit>Edit steps</button>
      </div>
      <div data-editor style="display:none">
        <div class="hint" style="margin-bottom:6px">One step per line, in order. Start each line with an emoji, then the label. e.g. <b>📝 Planning</b></div>
        <textarea class="field" data-stages placeholder="📝 Planning&#10;✏️ Beginning&#10;📖 Middle&#10;🏁 End&#10;⭐ Publish" style="min-height:120px"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn primary sm" data-save-stages>Save steps</button>
          <button class="btn sm danger ghost" data-reset-all>Reset students on this board</button></div>
      </div>
      <div class="grid-wrap" data-grid style="flex:1;overflow:auto;align-content:start"></div>
      <div class="hint">Tap a student to advance · ↺ (top-left of card) to step back. Each board remembers its own progress, saved across days.</div>
    </div>`;

  const sel=body.querySelector('[data-board]');
  const track=body.querySelector('[data-track]'), gridEl=body.querySelector('[data-grid]');
  const ed=body.querySelector('[data-editor]'), ta=body.querySelector('[data-stages]');
  const namePanel=body.querySelector('[data-name-panel]'), nameInput=body.querySelector('[data-name-input]');
  let nameMode='new';

  function save(){ Store.set('grid', GRID); if(GridSyncAPI.live()) GridSyncAPI.push(activeBoard()); }
  function renderBoards(){
    sel.innerHTML=GRID.boards.map(b=>`<option value="${b.id}"${b.id===GRID.active?' selected':''}>${esc(b.name)}</option>`).join('');
  }
  function renderTrack(){
    const bd=activeBoard(); track.innerHTML='';
    if(!bd.stages.length){track.innerHTML='<span class="muted">No steps yet — tap "Edit steps".</span>';return;}
    bd.stages.forEach((s,i)=>{
      const chip=document.createElement('span');chip.className='stage-chip';chip.innerHTML=`${s.emoji} ${esc(s.label)}`;track.appendChild(chip);
      if(i<bd.stages.length-1){const a=document.createElement('span');a.className='stage-arrow';a.textContent='→';track.appendChild(a);}
    });
  }
  /* Per-student sticky notes, keyed to the student AND their current step, so a
     "fix punctuation" note belongs to the piece they're on now and doesn't follow
     them to the next step. Stored on the board: bd.notes = { "name\u0000stageIdx": "text" }.
     Ticking a note off clears it (one click). Absent notes = no change on upgrade. */
  const noteKey=(name,idx)=>name+'\u0000'+idx;
  function getNote(name,idx){ const n=activeBoard().notes; return (n&&n[noteKey(name,idx)])||''; }
  function setNote(name,idx,txt){
    const bd=activeBoard(); if(!bd.notes) bd.notes={};
    const k=noteKey(name,idx), t=(txt||'').trim();
    if(t) bd.notes[k]=t; else delete bd.notes[k];
    save();
  }
  function renderGrid(){
    const bd=activeBoard(); gridEl.innerHTML='';
    if(!STUDENTS.length){gridEl.innerHTML='<div class="empty" style="grid-column:1/-1">Add a class list in Settings ⚙️ to use the grid.</div>';return;}
    if(!bd.stages.length){gridEl.innerHTML='<div class="empty" style="grid-column:1/-1">Set up this board\u2019s steps first 🙂</div>';return;}
    const last=bd.stages.length-1;
    studentList().forEach(name=>{
      const idx=Math.min(bd.status[name]||0,last), stage=bd.stages[idx], done=idx>=last;
      const note=getNote(name,idx);
      const card=document.createElement('div');card.className='grid-card'+(done?' done':'')+(note?' has-note':'');
      card.innerHTML=`<button class="gc-back" title="Step back">↺</button>
        <button class="gc-addnote" title="Add a note">✎</button>
        <div class="gc-emoji">${stage.emoji}</div><div class="gc-name">${esc(name)}</div>
        <div class="gc-stage">${esc(stage.label)}${done?' ✓':''}</div>
        ${note?`<button class="gc-note" title="Tick off — done">${esc(note)} <span class="gc-note-tick">✓</span></button>`:''}`;
      // advancing a step: click the card body (not the mini-buttons or the note)
      card.onclick=e=>{ if(e.target.closest('.gc-back')||e.target.closest('.gc-addnote')||e.target.closest('.gc-note')||e.target.closest('.gc-note-edit'))return;
        const cur=bd.status[name]||0; if(cur<last){bd.status[name]=cur+1;save();renderGrid();tone(bd.status[name]>=last?'chime':'blip');} };
      card.querySelector('.gc-back').onclick=()=>{ const cur=bd.status[name]||0; if(cur>0){bd.status[name]=cur-1;save();renderGrid();} };
      // tick off = clear the note, one click
      const nb=card.querySelector('.gc-note');
      if(nb) nb.onclick=e=>{ e.stopPropagation(); setNote(name,idx,''); tone('blip'); renderGrid(); };
      card.querySelector('.gc-addnote').onclick=e=>{ e.stopPropagation(); openNoteInput(card,name,idx); };
      gridEl.appendChild(card);
    });
  }
  // inline note entry — no modal. ✎ swaps in a tiny field; Enter saves, Esc/blur cancels.
  function openNoteInput(card,name,idx){
    if(card.querySelector('.gc-note-edit')) return;
    const box=document.createElement('div'); box.className='gc-note-edit';
    box.innerHTML=`<input type="text" maxlength="80" placeholder="Quick note…" value="${esc(getNote(name,idx))}">`;
    card.appendChild(box);
    const inp=box.querySelector('input'); inp.focus(); inp.select();
    const commit=save=>{ if(save) setNote(name,idx,inp.value); renderGrid(); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();commit(true);} else if(e.key==='Escape'){e.preventDefault();commit(false);} };
    inp.onblur=()=>commit(true);
    inp.onclick=e=>e.stopPropagation();
  }
  function loadStageEditor(){ ta.value=activeBoard().stages.map(s=>`${s.emoji} ${s.label}`).join('\n'); }
  function renderAll(){ renderBoards(); renderTrack(); renderGrid(); loadStageEditor(); }

  sel.onchange=()=>{ GRID.active=sel.value; save(); renderTrack(); renderGrid(); loadStageEditor(); ed.style.display='none'; };

  // new / rename via inline panel (no browser prompts)
  function openName(mode){ nameMode=mode; namePanel.style.display='block';
    nameInput.value=mode==='rename'?activeBoard().name:''; nameInput.focus(); }
  body.querySelector('[data-new]').onclick=()=>openName('new');
  body.querySelector('[data-rename]').onclick=()=>openName('rename');
  body.querySelector('[data-name-cancel]').onclick=()=>namePanel.style.display='none';
  body.querySelector('[data-name-ok]').onclick=()=>{
    const v=nameInput.value.trim(); if(!v){namePanel.style.display='none';return;}
    if(nameMode==='new'){ const id='b'+Date.now();
      GRID.boards.push({id,name:v,stages:[],status:{}}); GRID.active=id; }
    else { activeBoard().name=v; }
    save(); namePanel.style.display='none'; renderAll();
  };
  nameInput && (nameInput.onkeydown=e=>{ if(e.key==='Enter')body.querySelector('[data-name-ok]').click(); });

  // delete with two-tap confirm (no browser prompts)
  const delBtn=body.querySelector('[data-del]'); let armed=false, armTimer;
  delBtn.onclick=()=>{
    if(GRID.boards.length<=1){ delBtn.textContent='⌧'; setTimeout(()=>delBtn.textContent='🗑',900); return; }
    if(!armed){ armed=true; delBtn.textContent='Sure?'; delBtn.classList.add('primary');
      armTimer=setTimeout(()=>{armed=false;delBtn.textContent='🗑';delBtn.classList.remove('primary');},2500); return; }
    clearTimeout(armTimer); armed=false; delBtn.textContent='🗑'; delBtn.classList.remove('primary');
    GRID.boards=GRID.boards.filter(b=>b.id!==GRID.active); GRID.active=GRID.boards[0].id; save(); renderAll(); ed.style.display='none';
  };

  body.querySelector('[data-edit]').onclick=()=>ed.style.display=ed.style.display==='none'?'block':'none';
  body.querySelector('[data-save-stages]').onclick=()=>{
    activeBoard().stages = ta.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const m=l.match(/^(\p{Emoji}\uFE0F?(?:\u200D\p{Emoji})*)\s*(.*)$/u);
      return (m && m[2]) ? {emoji:m[1],label:m[2]} : {emoji:'•',label:l};
    });
    save(); renderTrack(); renderGrid(); ed.style.display='none';
  };
  body.querySelector('[data-reset-all]').onclick=()=>{ activeBoard().status={}; save(); renderGrid(); };

  // 📲 iPad: show a QR + link so a single front-of-room iPad opens the student view
  body.querySelector('[data-ipad]').onclick=()=>openGridQR(activeBoard());

  // teacher-side sync: pull the shared board on a timer so a student's taps on the
  // iPad appear here. Only active when hosted+configured; otherwise a no-op.
  let gridPull=null;
  function startGridPull(){
    if(gridPull) clearInterval(gridPull);
    if(!GridSyncAPI.live()) return;
    gridPull=setInterval(async()=>{
      const bd=activeBoard(); if(!bd) return;
      const row=await GridSyncAPI.pull(bd.id);
      if(row && row.status){
        // merge remote status/notes in; teacher keeps authoring notes locally too
        bd.status=row.status; if(row.notes) bd.notes=row.notes;
        Store.set('grid',GRID); renderGrid();
      }
    }, 4000);
  }
  startGridPull();
  // stop polling when this grid window is closed/removed
  if(typeof MutationObserver!=='undefined'){
    const _gridObs=new MutationObserver(()=>{ if(!document.body.contains(body)){ if(gridPull)clearInterval(gridPull); _gridObs.disconnect(); } });
    _gridObs.observe(document.body,{childList:true,subtree:true});
  }

  renderAll();
}

/* QR + link modal so a single iPad can open this board's student view. Reuses the
   same QR helper Forms uses; explains the offline case rather than failing silent. */
function openGridQR(board){
  const url=GridSyncAPI.studentUrl(board.id);
  const live=GridSyncAPI.live();
  const ov=document.createElement('div'); ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal" style="width:min(440px,95vw);text-align:center">
    <div class="modal-head">📲 Open on the classroom iPad ${liteBadge()}<button class="x" data-close style="margin-left:auto">✕</button></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:10px">Scan with the front-of-room iPad. Students tap their own name to move through <b>${esc(board.name)}</b> at their own pace.</div>
      <div class="grid-qr" data-qr></div>
      <div class="grid-qr-url" data-url>${esc(url)}</div>
      ${live
        ? '<div class="wc-tip" style="margin-top:10px">✅ Connected — the iPad and this board stay in step.</div>'
        : '<div class="lite-note" style="margin-top:10px">◐ <b>Lite mode</b> — this QR only works on the <b>same device</b> right now. Publish the app and add your backend in <b>Settings ⚙️</b> to sync a real iPad.</div>'}
      <button class="btn sm" data-copy style="margin-top:10px">Copy link</button>
    </div></div>`;
  document.body.appendChild(ov);
  const qbox=ov.querySelector('[data-qr]');
  if(typeof QRCode!=='undefined'){ try{ new QRCode(qbox,{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ qbox.innerHTML='<img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url)+'">'; } }
  else { qbox.innerHTML='<img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url)+'">'; }
  ov.querySelector('[data-copy]').onclick=()=>{ try{ navigator.clipboard.writeText(url); flash('Link copied'); }catch(e){} };
  ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>ov.remove());
  ov.addEventListener('mousedown',e=>{ if(e.target===ov)ov.remove(); });
}


/* ============================================================
   FORMS & QR  — build questionnaires, show a QR, live results
   Works in local "preview" mode until a backend is configured.
   ============================================================ */
const FormsAPI = {
  cfg(){ return { url:(SETTINGS.sbUrl||'').replace(/\/+$/,''), key:(SETTINGS.sbKey||'').trim(), page:(SETTINGS.formPage||'').trim() }; },
  live(){ const c=this.cfg(); return !!(c.url && c.key); },
  async _sb(path, opts={}){
    const c=this.cfg();
    const r=await fetch(c.url+'/rest/v1/'+path,{...opts,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}});
    if(!r.ok) throw new Error('Supabase '+r.status);
    const t=await r.text(); return t?JSON.parse(t):[];
  },
  async createForm(f){
    if(this.live()){ const [row]=await this._sb('forms',{method:'POST',body:JSON.stringify(f)}); return row; }
    const forms=await Store.get('fl_forms',[]); f.id=f.id||('f'+Date.now()); f.created_at=new Date().toISOString();
    forms.push(f); await Store.set('fl_forms',forms); return f;
  },
  async updateForm(f){
    if(this.live()){ const {id,created_at,...rest}=f; await this._sb('forms?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(rest)}); return f; }
    let forms=await Store.get('fl_forms',[]); forms=forms.map(x=>x.id===f.id?f:x); await Store.set('fl_forms',forms); return f;
  },
  async listForms(){
    if(this.live()) return await this._sb('forms?select=*&order=created_at.desc');
    return (await Store.get('fl_forms',[])).slice().reverse();
  },
  async deleteForm(id){
    if(this.live()){ await this._sb('responses?form_id=eq.'+encodeURIComponent(id),{method:'DELETE'}); await this._sb('forms?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); return; }
    let forms=(await Store.get('fl_forms',[])).filter(x=>x.id!==id); await Store.set('fl_forms',forms);
    let resp=(await Store.get('fl_resp',[])).filter(x=>x.form_id!==id); await Store.set('fl_resp',resp);
  },
  async listResponses(formId){
    if(this.live()) return await this._sb('responses?select=*&form_id=eq.'+encodeURIComponent(formId)+'&order=id.asc');
    return (await Store.get('fl_resp',[])).filter(x=>x.form_id===formId);
  },
  async addResponse(r){
    if(this.live()){ await this._sb('responses',{method:'POST',body:JSON.stringify(r)}); return; }
    const resp=await Store.get('fl_resp',[]); r.id=Date.now()+Math.floor(Math.random()*1000); r.created_at=new Date().toISOString();
    resp.push(r); await Store.set('fl_resp',resp);
  }
};

/* ============================================================
   GRID SYNC — shares ONE task board between the teacher laptop and a single
   front-of-room iPad (student view). Same live()/local split as FormsAPI:
   • Unhosted / not configured  -> no-op. The board just uses local Store, exactly
     as before. Nothing to sync through, and nothing breaks.
   • Hosted + Supabase configured -> the active board's {status,notes,stages,name}
     lives in one row; both screens pull on a timer and push on change. Because
     it's ONE board on two screens (not many devices), there's no per-student
     conflict problem — last write wins, which for "a kid taps their name" and
     "a teacher adds a note" essentially never actually collide.
   This is groundwork: the wiring is complete and gated, so hosting is the only
   remaining step to make it live. ============================================ */
const GridSyncAPI = {
  cfg(){ return { url:(SETTINGS.sbUrl||'').replace(/\/+$/,''), key:(SETTINGS.sbKey||'').trim(), page:(SETTINGS.gridPage||SETTINGS.formPage||'').trim() }; },
  live(){ const c=this.cfg(); return !!(c.url && c.key); },
  async _sb(path, opts={}){
    const c=this.cfg();
    const r=await fetch(c.url+'/rest/v1/'+path,{...opts,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',Prefer:'return=representation,resolution=merge-duplicates',...(opts.headers||{})}});
    if(!r.ok) throw new Error('Supabase '+r.status);
    const t=await r.text(); return t?JSON.parse(t):[];
  },
  // the shareable student-view URL for a board (used for the QR)
  studentUrl(boardId){
    const c=this.cfg();
    let base = c.page || ((location.origin||'')+(location.pathname||'')) || (location.href||'');
    base = String(base||'').split('#')[0];
    const sep = base.indexOf('?')>=0 ? '&' : '?';
    let qs = 'grid=student';
    if(boardId) qs += '&board='+encodeURIComponent(boardId);
    return base + sep + qs;
  },
  // push the given board up (whole board as one row, keyed by id)
  async push(board){
    if(!this.live() || !board) return false;
    const row={ id:board.id, name:board.name, stages:board.stages, status:board.status||{}, notes:board.notes||{}, updated_at:new Date().toISOString() };
    try{ await this._sb('grid_boards', {method:'POST', body:JSON.stringify(row)}); return true; }
    catch(e){ return false; }
  },
  // pull one board's latest state (returns row or null)
  async pull(boardId){
    if(!this.live() || !boardId) return null;
    try{ const rows=await this._sb('grid_boards?select=*&id=eq.'+encodeURIComponent(boardId)); return rows[0]||null; }
    catch(e){ return null; }
  },
};

/* ---------- environment / capability checks ----------
   Opening the file straight from disk (file://) silently breaks several browser
   APIs. Rather than let teachers hit confusing dead ends one by one, detect it
   once and tell them plainly what's affected and how to fix it. */
const IS_FILE = (location.protocol==='file:');
function capabilities(){
  return {
    file: IS_FILE,
    qr:   (typeof QRCode!=='undefined'),
    pdf:  (typeof pdfjsLib!=='undefined'),
    mic:  !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    storage: storageKind(),
  };
}
function capsSummary(){
  const c=capabilities(), issues=[];
  if(!c.qr)  issues.push('QR codes');
  if(!c.pdf) issues.push('PDF slides');
  if(!c.mic) issues.push('the noise meter');
  return {caps:c, issues};
}
/* file:// limitations go to the 🔔 notification list rather than a banner —
   it stays available all session without covering the room's screen. */
async function checkEnvironment(){
  if(!IS_FILE) return;
  const {issues}=capsSummary();
  const list = issues.length ? issues.join(', ') : 'the noise meter, QR codes';
  pushNote({
    emoji:'📂',
    title:'Running from a file on this computer',
    msg:'Everything saves normally, but browsers block a few things at file:// addresses — '+list+' may not work. Hosting the file at a web address unlocks them. (Settings → Your data)'
  });
}

function renderQR(box, text){
  box.innerHTML='';
  // 1. local library (bundled via CDN) — works offline once cached
  if(typeof QRCode!=='undefined'){
    try{ new QRCode(box,{text,width:220,height:220,correctLevel:QRCode.CorrectLevel.M}); return; }catch(e){}
  }
  // 2. remote image service — needs the network
  const img=document.createElement('img'); img.width=220; img.height=220; img.alt='QR code';
  img.style.background='#fff'; img.style.borderRadius='10px';
  img.onerror=()=>{ img.remove(); qrFallback(box, text); };
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(text);
  box.appendChild(img);
}
/* 3. nothing loaded — say so plainly and give them something they can still use */
function qrFallback(box, text){
  const d=document.createElement('div'); d.className='qr-fallback';
  d.innerHTML=`<div class="qr-fb-icon">📵</div>
    <div class="qr-fb-title">QR code couldn't load</div>
    <div class="qr-fb-msg">The QR generator needs an internet connection, and it's often blocked when the file is opened straight from your computer (a <code>file://</code> address).</div>
    <div class="qr-fb-msg" style="margin-top:6px"><b>Share this link instead:</b></div>
    <div class="qr-fb-link" data-lnk>${esc(text)}</div>
    <button class="btn sm primary" data-copy>📋 Copy link</button>`;
  d.querySelector('[data-copy]').onclick=async e=>{
    const b=e.currentTarget;
    try{ await navigator.clipboard.writeText(text); }
    catch(_){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e2){} ta.remove(); }
    b.textContent='✓ Copied'; setTimeout(()=>b.textContent='📋 Copy link',1400);
  };
  box.appendChild(d);
}

}

    if(view==='results') return renderResults();
    if(view==='poll') return renderPoll();
  }

        const c=document.createElement('div'); c.className='q-card';
        c.innerHTML=`<div class="row"><b>Q${i+1}</b>
            <select class="field" data-type style="flex:1">${Object.entries(Q_TYPES).map(([k,v])=>`<option value="${k}"${k===q.type?' selected':''}>${v}</option>`).join('')}</select>
            <button class="btn sm danger ghost" data-rm>✕</button></div>
          <input class="field" data-label placeholder="Question text" value="${esc(q.label)}" style="margin-top:6px">
          <div data-extra style="margin-top:6px"></div>`;
        const extra=c.querySelector('[data-extra]');

          if(q.type==='choice'||q.type==='checkbox'){
            extra.innerHTML=`<textarea class="field" data-opts placeholder="One option per line">${esc((q.options||[]).join('\n'))}</textarea>`;
            extra.querySelector('[data-opts]').oninput=e=>q.options=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean);
          } else if(q.type==='scale'){
            extra.innerHTML=`<div class="row"><span class="muted">Top of scale:</span><input type="number" class="field" data-max value="${q.max||5}" min="2" max="10" style="width:80px"></div>`;
            extra.querySelector('[data-max]').oninput=e=>q.max=Math.max(2,Math.min(10,+e.target.value||5));
          } else extra.innerHTML='';
        }
        c.querySelector('[data-type]').onchange=e=>{ q.type=e.target.value; if((q.type==='choice'||q.type==='checkbox')&&!(q.options&&q.options.length))q.options=['Option 1','Option 2']; renderExtra(); };
        c.querySelector('[data-label]').oninput=e=>q.label=e.target.value;
        c.querySelector('[data-rm]').onclick=()=>{ draft.fields.splice(i,1); renderQs(); };
        wrap.appendChild(c); renderExtra();
      });
    }
    async function saveForm(asTemp){
      if(!draft.title.trim()){ alert('Give your form a title.'); return; }
      if(!draft.fields.length){ alert('Add at least one question.'); return; }
      if(draft.fields.some(f=>!f.label.trim())){ alert('Every question needs text.'); return; }
      if(draft.meta.identity==='code'){ if(!STUDENTS.length){ alert('Add a class list first (Settings) to use code mode.'); return; } if(!draft.roster||!draft.roster.length) draft.roster=genRoster(STUDENTS); }
      else draft.roster=[];
      draft.temp = !!asTemp;
      let saved;
      try{ saved = draft.id ? await FormsAPI.updateForm(draft) : await FormsAPI.createForm(draft); }
      catch(e){ alert('Could not save: '+e.message); return; }
      if(asTemp){ current = (saved&&saved.id)?saved:draft; revealed=false; view='present'; render(); }
      else back();
    }
  }
