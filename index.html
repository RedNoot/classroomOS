<!doctype html>
<html lang="en">
<!-- Classroom OS — a teacher's all-in-one classroom screen -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom OS</title>
<!-- PWA: installable, works offline. Harmless when opened as a plain file. -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#3a8dde">
<meta name="description" content="A calm control panel for your classroom projector. Everything stays on your own computer.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg1:#bfe3f0; --bg2:#dff1e6;
    --surface:#ffffff; --surface-2:#f4f7fb; --ink:#243042; --ink-soft:#5b6b80;
    --line:#e3e9f2; --accent:#3a8dde; --accent-ink:#ffffff;
    --good:#27ae60; --warn:#f1a23b; --bad:#e2574c;
    --shadow:0 10px 40px rgba(28,48,80,.18);
    --radius:18px; --dock-h:74px; --font:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    /* ===== z-index scale — one legible hierarchy, so nothing floats ad-hoc =====
       Windows live in --z-win-min..max (the focus counter is CLAMPED to this band,
       so a much-clicked window can never climb over the chrome). Everything above
       is fixed furniture and overlays, in deliberate order. */
    --z-win-min:100; --z-win-max:899;
    --z-chrome:1000;      /* rail, dock, topbar, corner buttons — the persistent frame */
    --z-popout:1100;      /* rail flyout + card tray: just above their own rail */
    --z-toast:2000;       /* passing toasts */
    --z-nudge:2200;       /* backup/setup nudges, tour, update bar */
    --z-modal:3000;       /* modal dialogs sit above all chrome */
    --z-modal-top:3100;   /* things that must beat a modal: drag ghost, resize */
    --z-demobar:3500;     /* demo banner stays visible over everything */
  }
  [data-theme="dusk"]{
    --bg1:#1f2a3a; --bg2:#28344a;
    --surface:#2c3a52; --surface-2:#243049; --ink:#eaf1fb; --ink-soft:#a9b9d0;
    --line:#3a4a66; --accent:#5aa2ea; --accent-ink:#0e1726;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  [data-theme="meadow"]{
    --bg1:#cfe9c4; --bg2:#eaf6dd;
    --surface:#ffffff; --surface-2:#f1f8ec; --ink:#243a26; --ink-soft:#577a5b;
    --line:#dceacf; --accent:#5aa845; --accent-ink:#ffffff;
  }
  [data-theme="sunset"]{
    --bg1:#f7d6b0; --bg2:#fbe9d6;
    --surface:#fffaf5; --surface-2:#fdefe2; --ink:#43271a; --ink-soft:#8a6650;
    --line:#f1ddca; --accent:#e8743b; --accent-ink:#ffffff;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  .nhide{display:none!important}
  /* notifications */
  #notif-btn{position:fixed;top:14px;right:16px;z-index:var(--z-chrome);width:44px;height:44px;border-radius:14px;
    border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center}
  #notif-btn:hover{border-color:var(--accent)}
  /* undo / redo */
  #undo-btn,#redo-btn{position:fixed;top:14px;z-index:var(--z-chrome);width:38px;height:44px;border-radius:14px;
    border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);color:var(--ink);
    font-size:19px;font-weight:900;display:grid;place-items:center;transition:.12s}
  #undo-btn{right:106px} #redo-btn{right:66px}
  #appfull-btn{position:fixed;top:14px;right:146px;z-index:var(--z-chrome);width:38px;height:44px;border-radius:14px;
    border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);color:var(--ink);
    font-size:18px;font-weight:900;display:grid;place-items:center;transition:.12s}
  #appfull-btn:hover{border-color:var(--accent);color:var(--accent)}
  #appfull-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  body.presenting #appfull-btn{display:none!important}
  /* in app-fullscreen the exit button must beat every window/modal layer, or
     there's no visible way back out */
  body.app-fullscreen #appfull-btn{z-index:calc(var(--z-modal-top) + 10)!important;display:grid!important}
  #undo-btn:hover:not(:disabled),#redo-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  #undo-btn:disabled,#redo-btn:disabled{opacity:.32;cursor:default}
  body.presenting #undo-btn,body.presenting #redo-btn{display:none!important}
  #undo-toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:var(--z-toast);pointer-events:none;
    background:var(--ink);color:var(--surface);font-weight:800;font-size:13px;padding:9px 18px;border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transition:opacity .18s,transform .18s}
  #undo-toast.show{opacity:.96;transform:translate(-50%,0)}
  /* first-run nudge */
  #setup-nudge{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:var(--z-nudge);display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;
    font-weight:700;font-size:13.5px;color:var(--ink);max-width:min(560px,94vw)}
  #setup-nudge .nudge-x{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;
    width:24px;height:24px;border-radius:7px;flex:0 0 auto}
  #setup-nudge .nudge-x:hover{background:var(--line);color:var(--ink)}
  /* ===== First-run welcome — softer, warmer than the standard dialogs ===== */
  .welcome-overlay{background:rgba(16,24,40,.62);backdrop-filter:blur(3px)}
  .welcome-modal{border:none;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden}
  .welcome-modal .modal-body{padding:0 24px 18px}
  .welcome-modal .modal-foot{padding:14px 24px;background:var(--surface-2);border-top:1px solid var(--line)}
  .wc-hero{display:flex;align-items:center;gap:14px;margin:0 -24px 16px;padding:22px 24px;
    background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 24%,var(--surface)), color-mix(in srgb,var(--accent) 8%,var(--surface)));
    border-bottom:1px solid var(--line)}
  .wc-hero-emoji{font-size:40px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.15))}
  .wc-hero-title{font-size:21px;font-weight:900;color:var(--ink);line-height:1.2}
  .wc-hero-sub{font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-top:3px;line-height:1.35}
  .wc-privacy{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;
    font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:14px}
  .wc-step-label{font-size:11px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
  .wc-q{font-size:17px;font-weight:900;color:var(--ink);margin-bottom:4px}
  .wc-tip{background:color-mix(in srgb,var(--accent) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
    border-radius:11px;padding:9px 12px;font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.45}
  .wc-warn{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));
    border-left:4px solid var(--bad);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--ink);line-height:1.5}
  #backup-nudge{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:var(--z-nudge);display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--bad);border-left:4px solid var(--bad);border-radius:14px;box-shadow:var(--shadow);
    padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink);max-width:min(600px,94vw)}
  #backup-nudge .nudge-x{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;
    width:24px;height:24px;border-radius:7px;flex:0 0 auto}
  #backup-nudge .nudge-x:hover{background:var(--line);color:var(--ink)}
  /* QR unavailable fallback */
  .qr-fallback{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;padding:18px 16px;
    border:1px dashed var(--line);border-radius:14px;background:var(--surface-2);max-width:280px}
  .qr-fb-icon{font-size:30px}
  .qr-fb-title{font-weight:900;font-size:14px;color:var(--ink)}
  .qr-fb-msg{font-size:12px;color:var(--ink-soft);line-height:1.45}
  .qr-fb-link{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;
    word-break:break-all;color:var(--ink);max-width:100%;font-weight:600}
  /* guided tour prompts */
  #tour-pop{position:fixed;right:20px;bottom:96px;z-index:var(--z-nudge);width:min(330px,92vw);background:var(--surface);
    border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:16px;box-shadow:0 16px 44px rgba(0,0,0,.28);
    padding:13px 15px;animation:pop .18s ease}
  #tour-pop .tour-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #tour-pop .tour-emoji{font-size:19px}
  #tour-pop .tour-title{font-weight:900;font-size:14px;color:var(--ink);flex:1}
  #tour-pop .tour-count{font-size:11px;font-weight:900;color:var(--ink-soft);background:var(--surface-2);
    border-radius:999px;padding:2px 8px}
  #tour-pop .tour-x{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:12px;
    width:22px;height:22px;border-radius:6px}
  #tour-pop .tour-x:hover{background:var(--line);color:var(--ink)}
  #tour-pop .tour-msg{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px}
  #tour-pop .tour-msg b{color:var(--ink)}
  #tour-pop .tour-foot{display:flex;align-items:center;gap:6px}
  /* ===== Demo mode bar — always visible, never in the way ===== */
  #demo-bar{position:fixed;top:0;left:0;right:0;z-index:var(--z-demobar);display:flex;align-items:center;justify-content:center;gap:12px;
    height:38px;padding:0 14px;box-sizing:border-box;
    background:linear-gradient(90deg,#6d4aff,#b44aff);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
  #demo-bar .demo-dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3);
    animation:demopulse 1.8s ease-in-out infinite;flex:0 0 auto}
  @keyframes demopulse{0%,100%{opacity:.55}50%{opacity:1}}
  #demo-bar .demo-txt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #demo-bar .btn{background:rgba(255,255,255,.95);color:#5b2bd6;border:none;font-weight:900;flex:0 0 auto}
  #demo-bar .btn:hover{background:#fff}
  /* make room for it: everything anchored to the top shifts down */
  body.has-demo-bar #topbar{top:52px}
  body.has-demo-bar #notif-btn,body.has-demo-bar #undo-btn,body.has-demo-bar #redo-btn{top:52px}
  body.has-demo-bar #sched-rail{top:50px;max-height:calc(100vh - 62px)}
  body.has-demo-bar #slide-controls{top:52px}
  body.slides-full #demo-bar{display:none}
  /* ===== Window layouts (split screen) ===== */
  .win.maxed{border-radius:12px}
  /* a window in native fullscreen fills the whole screen; its absolute position
     is meaningless inside the fullscreened element, so override it hard. The
     :fullscreen backstop covers browsers that reparent the element. */
  .win.winfull, .win.winfull:fullscreen, .win.winfull:-webkit-full-screen{
    position:fixed!important; inset:0!important; left:0!important; top:0!important;
    width:100vw!important; height:100vh!important; max-width:none!important; max-height:none!important;
    border-radius:0!important; z-index:var(--z-modal-top)!important; box-shadow:none!important; resize:none!important;
  }
  .win.winfull .win-body{height:calc(100vh - 44px)}
  .win.winfull .win-resize{display:none}          /* can't resize a fullscreen window */
  .win.winfull .win-btn.dup,.win.winfull .win-btn.min{display:none}  /* neither makes sense fullscreen */
  /* the fullscreen (exit) button and close must ALWAYS stay visible and clickable
     in fullscreen — they're the only way back out */
  .win.winfull .win-btn.full,.win.winfull .win-btn.close{display:grid!important;position:relative;z-index:2}
  .win.winfull .win-head{position:relative;z-index:2}
  #layout-menu{position:fixed;z-index:calc(var(--z-chrome) + 5);display:none;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:10px 11px;min-width:190px}
  #layout-menu .lay-title{font-weight:900;font-size:11px;color:var(--ink-soft);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:7px}
  #layout-menu .lay-grid{display:flex;flex-direction:column;gap:4px}
  .lay-opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid transparent;background:transparent;
    color:var(--ink);border-radius:9px;padding:7px 9px;font-weight:800;font-size:13px;cursor:pointer}
  .lay-opt:hover{background:var(--surface-2);border-color:var(--line)}
  .lay-ico{font-size:16px;color:var(--accent);width:20px;text-align:center}
  /* ===== Tool guides (? panel) ===== */
  .win-btn.help{font-weight:900;font-size:13px}
  .win-btn.help:hover{background:var(--accent);color:var(--accent-ink)}
  .gd-what{font-size:15px;font-weight:800;color:var(--ink);line-height:1.4;margin-bottom:14px}
  .gd-h{font-weight:900;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
  .gd-list{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:7px}
  .gd-list li{font-size:13.5px;color:var(--ink);line-height:1.5}
  .gd-list b{color:var(--ink)}
  .gd-tip{background:color-mix(in srgb,var(--accent) 11%,var(--surface));
    border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line));border-radius:11px;
    padding:10px 13px;font-size:13px;line-height:1.5;color:var(--ink)}
  /* ===== First-open coach mark (sits inside the tool window) ===== */
  .coach{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;background:var(--surface);
    border:1px solid var(--accent);border-left:4px solid var(--accent);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);padding:11px 13px;animation:pop .18s ease}
  .coach-msg{font-size:12.5px;line-height:1.5;color:var(--ink);margin-bottom:9px}
  .coach-msg b{color:var(--accent)}
  .coach-foot{display:flex;align-items:center;gap:6px}
  /* a tool that fails shows this instead of a blank window */
  .tool-crash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    height:100%;padding:20px;gap:4px}
  .tool-crash .tc-emoji{font-size:34px}
  .tool-crash .tc-title{font-weight:900;font-size:15px;color:var(--ink)}
  .tool-crash .tc-msg{font-size:12.5px;color:var(--ink-soft);line-height:1.5;max-width:280px}
  /* feedback dialog */
  .fb-kinds{display:flex;flex-direction:column;gap:6px}
  .fb-kind{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
    font-weight:800;font-size:13.5px;color:var(--ink)}
  .fb-kind:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
  .fb-kind.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
  .fb-kind .fb-emoji{font-size:17px}
  /* opt-in rows */
  .opt-row{display:flex;align-items:flex-start;gap:9px;cursor:pointer;line-height:1.45}
  .opt-row input{margin-top:2px;flex:0 0 auto;width:15px;height:15px;cursor:pointer}
  .wc-optin{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  /* "a new version is ready" bar */
  #update-bar{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:var(--z-nudge);display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--good);border-left:4px solid var(--good);border-radius:14px;
    box-shadow:var(--shadow);padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink);max-width:min(620px,94vw)}
  #update-bar .nudge-x{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;
    width:24px;height:24px;border-radius:7px;flex:0 0 auto}
  #update-bar .nudge-x:hover{background:var(--line);color:var(--ink)}
  /* ===== Subject cards ("velcro" library) ===== */
  .subj-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;cursor:grab;user-select:none;
    background:color-mix(in srgb, var(--sc) 15%, var(--surface));border:1.5px solid var(--sc);color:var(--ink);
    font-weight:800;font-size:13px;white-space:nowrap;transition:.12s}
  .subj-chip:hover{transform:translateY(-1px);box-shadow:0 3px 10px color-mix(in srgb,var(--sc) 40%,transparent)}
  .subj-chip.dragging{opacity:.45}
  .subj-chip .subj-emoji{font-size:15px}
  .subj-chip .subj-links{font-size:10px;font-weight:900;color:var(--sc)}
  .subj-chip.subj-clear{--sc:#9aa5b1;border-style:dashed;color:var(--ink-soft)}
  .sched-tools{padding:5px 9px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .subj-tray{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px;max-height:104px;overflow:auto;
    padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
  .subj-tray[hidden]{display:none}
  .nav-cards.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .subj-list{display:flex;flex-direction:column;gap:7px}
  .subj-row{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  .subj-row.editing{display:block;background:var(--surface-2)}
  .subj-edit .row{gap:6px}
  .snd-pick{display:inline-flex;align-items:center;gap:6px;font-size:12px}
  /* task grid — iPad student view */
  body.grid-student-mode>*{display:none!important}
  body.grid-student-mode>#grid-student{display:flex!important}
  #grid-student{position:fixed;inset:0;z-index:var(--z-modal-top);background:var(--bg1);
    flex-direction:column;padding:14px;gap:12px;overflow:auto}
  #grid-student .gs-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #grid-student .gs-title{font-size:26px;font-weight:900;color:var(--ink)}
  #grid-student .gs-track{flex:1;color:var(--ink-soft);font-weight:700;font-size:14px}
  #grid-student .gs-arrow{opacity:.5}
  #grid-student .gs-full,#grid-student .gs-exit{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);font-size:20px;cursor:pointer}
  #grid-student .gs-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
  #grid-student .gs-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:16px 12px;text-align:center;cursor:pointer;transition:transform .1s;user-select:none;box-shadow:var(--shadow)}
  #grid-student .gs-card:active{transform:scale(.96)}
  #grid-student .gs-card.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
  #grid-student .gs-card.has-note{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  #grid-student .gs-emoji{font-size:38px;line-height:1}
  #grid-student .gs-name{font-weight:900;font-size:18px;margin-top:4px;color:var(--ink)}
  #grid-student .gs-stage{font-size:13px;color:var(--ink-soft);font-weight:700;margin-top:2px}
  #grid-student .gs-note{margin-top:8px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--warn) 14%,var(--surface));
    border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:9px;padding:4px 6px;color:var(--ink)}
  #grid-student .gs-back{position:absolute;top:6px;left:8px;border:none;background:transparent;font-size:18px;color:var(--ink-soft);cursor:pointer;opacity:.5}
  #grid-student .gs-back:hover{opacity:1}
  #grid-student .gs-foot{text-align:center;color:var(--ink-soft);font-weight:700;font-size:13px;padding-bottom:6px}
  #grid-student .gs-empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px}
  .grid-qr{display:flex;justify-content:center;padding:8px}
  .grid-qr img,.grid-qr canvas{border-radius:12px}
  .grid-qr-url{font-size:11px;color:var(--ink-soft);word-break:break-all;margin-top:8px;font-family:monospace}
  .snd-pick select{max-width:130px}
  .settle-snd{margin-top:10px;display:flex;justify-content:center}
  .subj-in-emoji{width:52px;text-align:center;font-size:15px}
  /* emoji picker */
  .emoji-pick-btn{width:44px;height:38px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
    font-size:20px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:.12s}
  .emoji-pick-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
  .emoji-pick-btn.empty{opacity:.5}
  .emoji-pop{position:fixed;z-index:var(--z-modal-top);background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:10px;max-height:280px;display:flex;flex-direction:column}
  .emoji-pop-scroll{overflow-y:auto;flex:1}
  .emoji-pop-group{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin:6px 2px 4px}
  .emoji-pop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:2px;margin-bottom:4px}
  .emoji-pop-item{border:none;background:transparent;border-radius:8px;font-size:22px;height:36px;cursor:pointer;transition:.1s}
  .emoji-pop-item:hover{background:var(--surface-2);transform:scale(1.15)}
  .emoji-pop-foot{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
  .emoji-pop-type{flex:1;text-align:center}
  .subj-links-ed{display:flex;flex-direction:column;gap:5px;margin-top:7px}
  /* drop feedback */
  .subj-over{outline:2px dashed var(--accent)!important;outline-offset:2px;background:color-mix(in srgb,var(--accent) 9%,transparent)!important}
  .sched-slot{border-radius:10px;padding:2px}
  /* rail pop-out card tray */
  #sched-cardtray{position:fixed;z-index:var(--z-popout);display:none;flex-direction:column;gap:7px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;max-width:250px}
  #sched-cardtray .ct-head{display:flex;align-items:center;font-weight:900;font-size:13px}
  #sched-cardtray .ct-x{margin-left:auto;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;
    width:22px;height:22px;border-radius:6px}
  #sched-cardtray .ct-x:hover{background:var(--line);color:var(--ink)}
  #sched-cardtray .ct-list{display:flex;flex-wrap:wrap;gap:6px;max-height:270px;overflow:auto}
  #sched-cardtray .ct-edit{align-self:flex-start}
  /* keyboard shortcut cheat-sheet */
  kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:6px;background:var(--surface-2);color:var(--ink);
    font-family:inherit;font-weight:900;font-size:12px;line-height:1}
  .ks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
  .ks-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
  #notif-badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:900;
    min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
  #notif-panel{position:fixed;top:60px;right:14px;width:290px;max-height:64vh;overflow:auto;z-index:var(--z-chrome);
    background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px}
  #notif-panel h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:5px;font-weight:800}
  .notif-pushrow{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:7px}
  .notif-pushlbl{display:block;font-size:10.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px}
  .notif-pushrow .seg.sm{width:100%}
  .notif-pushrow .seg.sm button{flex:1}
  .notif-pushhint{font-size:10px;color:var(--ink-soft);margin-top:5px;line-height:1.3}
  .notif-pushhint.ok{color:#1f9d63}
  .notif-pushhint.warn{color:var(--warn)}
  .note{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:8px}
  /* Lite-mode signalling — one look everywhere a backend is needed */
  .lite-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:999px;
    background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));
    vertical-align:middle;white-space:nowrap}
  .lite-badge.on{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:#1f9d63;border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
  .lite-dot{color:var(--warn);font-weight:900}
  .lite-note{font-size:11.5px;line-height:1.4;padding:6px 9px;border-radius:8px;
    background:color-mix(in srgb,var(--warn) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--ink)}
  .note:hover{background:var(--surface-2)}
  .note .n-emoji{font-size:16px}
  .note .n-title{font-weight:800;font-size:12.5px}
  .note .n-meta{font-size:11px;color:var(--ink-soft)}
  /* weather */
  #wx-chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;
    padding:5px 12px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;cursor:pointer}
  #wx-chip:hover{border-color:var(--accent)}
  #wx-panel{position:fixed;top:66px;left:50%;transform:translateX(-50%);width:290px;z-index:var(--z-chrome);
    background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  #wx-panel .wx-stat{flex:1}
  #wx-panel .wx-stat b{font-size:15px}
  body{
    font-family:var(--font); color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed; overflow:hidden; user-select:none;
    transition:background .4s ease;
  }
  button{font-family:inherit;cursor:pointer}
  /* dyslexia-friendly reading mode */
  html[data-dys="1"]{--font:'OpenDyslexic','Comic Sans MS','Comic Neue','Verdana',Tahoma,system-ui,sans-serif}
  html[data-dys="1"] body{letter-spacing:.4px;word-spacing:2px;line-height:1.55}
  html[data-dys="1"] .cork-text{font-family:var(--font)}
  input,textarea{font-family:inherit}

  /* ===== Desktop ===== */
  #desktop{position:fixed;inset:0;bottom:0;overflow:hidden}

  /* Top clock / banner */
  #topbar{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;z-index:5;
    background:var(--surface);border:1px solid var(--line);
    padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);
    font-weight:800;letter-spacing:.3px;
  }
  #topbar .date{color:var(--ink-soft);font-weight:700;font-size:14px}
  #topbar .clock{font-size:18px;font-variant-numeric:tabular-nums}
  /* narrow screens: the centred topbar and the right-anchored corner buttons ran
     into each other. Shrink BOTH so they coexist. */
  @media (max-width:720px){
    #topbar{padding:6px 11px;gap:7px}
    #topbar .date{font-size:12px}
    #topbar .clock{font-size:15px}
    #wx-chip{padding:4px 8px;font-size:12px}
    #notif-btn,#undo-btn,#redo-btn,#appfull-btn{width:34px;height:38px;font-size:15px;top:12px}
    #notif-btn{right:10px} #undo-btn{right:84px} #redo-btn{right:50px} #appfull-btn{right:118px}
  }
  @media (max-width:520px){
    /* very tight: date collapses, weather hides, buttons pack in */
    #topbar .date{display:none}
    #wx-chip{display:none}
  }

  /* ===== Windows ===== */
  .win{
    position:absolute;min-width:240px;min-height:160px;z-index:var(--z-win-min);
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .win-head{
    display:flex;align-items:center;gap:8px;padding:9px 10px;
    background:var(--surface-2);border-bottom:1px solid var(--line);cursor:move;
    touch-action:none;
  }
  .win-emoji{font-size:18px;line-height:1}
  .win-title{font-weight:800;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .win-btn{
    width:26px;height:26px;border:none;border-radius:8px;background:transparent;
    color:var(--ink-soft);font-size:16px;display:grid;place-items:center;
  }
  .win-btn:hover{background:var(--line);color:var(--ink)}
  .win-btn.close:hover{background:var(--bad);color:#fff}
  .win-btn.dup{font-size:14px}
  .win-btn.dup:hover{background:var(--accent);color:var(--accent-ink)}
  .win-body{flex:1;overflow:auto;padding:14px;position:relative}
  /* fit-to-window: content is wrapped and scaled down (like zooming out) so a
     tool's whole layout stays visible in a small window, down to a floor. The
     wrapper is measured at scale 1, then transform-scaled to fit. */
  .win-scale{transform-origin:top left;width:100%}
  .win-body.scaling{overflow:hidden}          /* while it fits, no scrollbars */
  .win-body.scaling.floored{overflow:auto}    /* hit the min scale — allow scroll */
  .win-resize{
    position:absolute;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;
    background:
      linear-gradient(135deg,transparent 50%,var(--ink-soft) 50% 60%,transparent 60%,transparent 72%,var(--ink-soft) 72% 82%,transparent 82%);
    opacity:.5;border-radius:0 0 6px 0;
  }

  /* ===== Dock ===== */
  /* hover-to-open zone sits ONLY under the centred "Tools" handle — not the whole
     bottom edge, which used to pop the dock from anywhere along the bottom. */
  #dock-zone{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:160px;height:30px;z-index:calc(var(--z-chrome) - 1)}
  #dock-handle{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:var(--z-chrome);
    background:var(--surface);border:1px solid var(--line);border-bottom:none;
    border-radius:14px 14px 0 0;box-shadow:0 -4px 18px rgba(28,48,80,.12);
    padding:5px 22px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:opacity .2s, transform .2s;
  }
  #dock-handle:hover{transform:translateX(-50%) translateY(-2px)}
  #dock-handle .grip{width:34px;height:4px;border-radius:999px;background:var(--ink-soft);opacity:.45}
  #dock-handle small{font-size:9px;font-weight:900;color:var(--ink-soft);letter-spacing:.4px;text-transform:uppercase}
  #dock-handle.hidden{opacity:0;pointer-events:none}

  /* minimised window tray (always visible, bottom-left) */
  #min-tray{position:fixed;left:12px;bottom:12px;z-index:var(--z-chrome);display:none;flex-direction:column;gap:6px;align-items:flex-start;max-height:80vh;overflow:auto}
  /* when the schedule rail occupies the bottom-left, send the minimised tray to
     the bottom-right so the two never overlap */
  body.rail-left #min-tray{left:auto;right:12px;align-items:flex-end}
  .min-chip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px 6px 10px;box-shadow:var(--shadow);font-weight:800;font-size:13px;cursor:pointer;animation:pop .18s ease}
  .min-chip:hover{border-color:var(--accent);transform:translateY(-2px)}
  .min-chip .mc-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
  .min-chip .mc-emoji{font-size:15px}
  .min-chip .mc-restore{opacity:.5;font-size:12px;margin-left:1px}
  .min-collapse{align-self:flex-start;width:28px;height:22px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
    box-shadow:var(--shadow);color:var(--ink-soft);font-size:13px;cursor:pointer;display:grid;place-items:center;margin-bottom:1px}
  .min-collapse:hover{color:var(--ink);border-color:var(--accent)}
  .min-launch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
    border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;color:var(--ink);cursor:pointer}
  .min-launch:hover{border-color:var(--accent)}
  .min-launch .ml-count{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:1px 7px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,174,96,.5)}70%{box-shadow:0 0 0 6px rgba(39,174,96,0)}100%{box-shadow:0 0 0 0 rgba(39,174,96,0)}}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:var(--z-modal);display:grid;place-items:center;padding:12px;animation:pop .15s ease}
  /* No min-height floor — small dialogs stay small instead of a 420px empty box.
     Radius, padding and header all tightened for a snug, OS-like fit. */
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(640px,94vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
  /* double-click the header to fill the screen */
  .modal.maxed{position:fixed!important;inset:12px!important;width:auto!important;height:auto!important;
    max-height:none!important;min-height:0!important;margin:0!important;transform:none!important;border-radius:12px}
  .modal-head{cursor:default;user-select:none}
  .modal-head[data-dbl]{cursor:pointer}
  .modal-head{padding:5px 10px;border-bottom:1px solid var(--accent);display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;
    background:color-mix(in srgb, var(--accent) 13%, var(--surface))}
  .modal-body{padding:8px 10px;overflow:auto}
  .modal-foot{padding:6px 10px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
  .modal-resize{position:absolute;right:3px;bottom:3px;width:18px;height:18px;cursor:nwse-resize;z-index:5;touch-action:none;
    background:linear-gradient(135deg,transparent 50%,var(--ink-soft) 50% 60%,transparent 60%,transparent 72%,var(--ink-soft) 72% 82%,transparent 82%);
    opacity:.45;border-radius:0 0 14px 0}
  .modal-resize:hover{opacity:.85}
  /* settings window shares the same accent-tinted chrome so it reads as "settings", not a tool */
  .win.win-settings .win-head{background:color-mix(in srgb, var(--accent) 13%, var(--surface));border-bottom:2px solid var(--accent)}
  .win.win-settings{box-shadow:0 0 0 1px var(--accent), var(--shadow)}
  .stu-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .stu-row .field{flex:1}
  .stu-row .x{border:none;background:transparent;color:var(--ink-soft);font-size:18px;cursor:pointer;width:30px;height:30px;border-radius:8px}
  .stu-row .x:hover{background:var(--bad);color:#fff}

  /* schedule rail */
  #sched-rail{position:fixed;top:12px;z-index:var(--z-chrome);display:none;flex-direction:column;gap:4px;align-items:stretch;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:6px 5px;max-height:calc(100vh - 24px);overflow:hidden;
    transition:opacity .2s}
  #sched-rail.left{left:0;border-radius:0 16px 16px 0;border-left:none}
  #sched-rail.right{right:0;border-radius:16px 0 0 16px;border-right:none}
  #sched-rail .sched-head{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 0 4px;flex:0 0 auto;
    border-bottom:1px solid var(--line)}
  /* toggle + action icons share one frozen row at the very top */
  #sched-rail .sched-headrow{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap}
  #sched-rail .sched-hbtn{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);font-size:13px;display:none;place-items:center;cursor:pointer;padding:0;flex:0 0 auto;line-height:1}
  #sched-rail .sched-hbtn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
  /* icons appear whenever the rail has width — hidden in the thin collapsed bar */
  #sched-rail.mini .sched-hbtn,#sched-rail.open .sched-hbtn{display:grid}
  #sched-rail.hidden:not(.open) .sched-hbtn{display:none}
  /* while a subject drag / tray / subjects modal is active, lift the rail above the
     modal backdrop so cards can actually be dropped onto today's sessions */
  #sched-rail.pinned{z-index:var(--z-modal-top)}
  #sched-cardtray{z-index:var(--z-modal-top)}
  /* only the sessions scroll */
  #sched-rail .sched-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0;padding-top:1px}
  #sched-rail .sched-toggle{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);border-radius:9px;width:40px;height:26px;font-size:14px;cursor:pointer;transition:.15s}
  #sched-rail .sched-toggle:hover{border-color:var(--accent);color:var(--ink)}
  #sched-rail.hidden:not(.open) .sched-toggle{font-size:18px;height:30px}
  #sched-rail .sched-today{display:none;font-weight:900;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
  #sched-rail.open .sched-today{display:block}
  #sched-rail.hidden:not(.open){padding:5px 4px}
  #sched-rail.hidden:not(.open) .sched-item,
  #sched-rail.hidden:not(.open) .sched-today{display:none}
  #sched-rail:not(.open) .sched-cog{display:none}
  #sched-rail:not(.open) .sched-pin{display:none}
  #sched-rail .sched-pin.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  #sched-rail .sched-pin.on:hover{background:var(--accent);border-color:var(--accent)}
  .sched-item{display:flex;align-items:center;gap:7px;border-radius:10px;padding:2px}
  #sched-rail.right .sched-item{flex-direction:row-reverse}
  .sched-emoji{font-size:18px;width:36px;height:36px;min-width:36px;display:grid;place-items:center;border-radius:10px;
    background:var(--surface-2);border:1px solid var(--line);opacity:.45;transform:scale(.86);transition:.3s}
  .sched-item.now .sched-emoji{opacity:1;transform:scale(1.14);background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.16)}
  .sched-item.done .sched-emoji{opacity:.3}
  .sched-text{display:none;flex-direction:column;line-height:1.15;opacity:.55;transition:.3s}
  #sched-rail.right .sched-text{text-align:right}
  #sched-rail.open .sched-text{display:flex}
  .sched-item.now .sched-text{opacity:1}
  .sched-label{font-weight:800;font-size:14px;white-space:nowrap}
  .sched-detail{font-size:11.5px;color:var(--ink-soft);font-weight:600;max-width:200px;white-space:normal;line-height:1.2;margin-top:1px}
  .sched-item.sched-empty{opacity:.75;cursor:pointer}
  .sched-item.sched-empty:hover{opacity:1}
  #sched-rail.right .sched-detail{text-align:right}
  .sched-time{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  /* schedule editor */
  .sched-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .sched-detail-in{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;background:var(--surface);color:var(--ink);margin:-2px 0 8px 54px;box-sizing:border-box}
  .sched-row input[type=time]{width:auto}
  .sched-row .emoji-in{width:48px;text-align:center;font-size:18px;padding:8px 4px}
  .sched-row .x{border:none;background:transparent;color:var(--ink-soft);font-size:17px;cursor:pointer;width:30px;height:30px;border-radius:8px}
  .sched-row .x:hover{background:var(--bad);color:#fff}
  .day-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .day-tab{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);border-radius:9px;padding:6px 10px;font-weight:800;font-size:12px;cursor:pointer}
  .day-tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  /* ---- schedule nav bar: Term ▾  Week ▾  S M T W T F S  ---- */
  .nav-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nav-term{max-width:150px;font-weight:800}
  .nav-week{max-width:132px;font-weight:800}
  .nav-days{display:flex;gap:3px;margin-left:2px}
  .nav-day{position:relative;width:25px;height:25px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-soft);border-radius:8px;font-weight:900;font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0}
  .nav-day:hover{border-color:var(--accent);color:var(--accent)}
  .nav-day.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .nav-day.today{box-shadow:inset 0 0 0 2px var(--good)}
  .nav-day.diff::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--warn)}
  .nav-day.on.diff::after{background:var(--accent-ink)}
  .nav-when{flex:1;min-width:120px;font-size:11.5px;color:var(--ink-soft);font-weight:700}
  .nav-when .nav-diff{color:var(--warn);font-weight:900}
  .linkbtn{border:none;background:transparent;color:var(--accent);font:inherit;font-size:11px;font-weight:800;cursor:pointer;padding:0 2px;text-decoration:underline}
  .wk-banner{display:flex;align-items:center;gap:7px;padding:4px 8px;margin-bottom:5px;border-radius:10px;font-size:12px;font-weight:700;
    background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--ink)}
  /* ---- set up pane ---- */
  .setup-sec{padding:12px 0;border-bottom:1px solid var(--line)}
  .setup-sec:last-child{border-bottom:none}
  .setup-h{font-weight:900;font-size:13px;margin-bottom:4px}
  /* term date setup */
  .term-row{display:grid;grid-template-columns:56px 1fr 1fr 62px 28px;gap:6px;align-items:center;margin-bottom:6px}
  .term-row .tr-n{font-weight:900;font-size:13px;color:var(--ink)}
  .term-row .tr-wk{font-size:11px;color:var(--ink-soft);font-weight:700;text-align:right}
  .term-row input{width:100%}
  .term-row.bad input[type=date]{border-color:var(--bad)}
  /* schedule resource flyout */
  .sched-item.has-links .sched-emoji{position:relative}
  .sched-item.has-links .sched-emoji::after{content:'';position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
  #sched-flyout{position:fixed;z-index:var(--z-popout);display:none;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);border-radius:14px;padding:10px;min-width:160px;max-width:250px}
  #sched-flyout .fly-title{font-weight:900;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
  #sched-flyout .fly-lesson{font-weight:900;font-size:14px;color:var(--ink);line-height:1.25;padding-bottom:2px;border-bottom:1px solid var(--line);margin-bottom:2px}
  #sched-flyout .fly-lesson span{display:block;font-weight:600;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .fly-btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    border-radius:10px;padding:9px 11px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fly-btn:hover{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .links-area{margin:-2px 0 8px 8px;padding:8px;border-left:2px solid var(--line)}
  .link-row{display:flex;gap:6px;margin-bottom:6px}
  /* schedule collapse pill (clean edge tab) */
  #sched-handle{position:fixed;top:50%;transform:translate(0,-50%);z-index:calc(var(--z-chrome) - 1);cursor:pointer;display:none;
    flex-direction:column;align-items:center;gap:7px;padding:14px 9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:background .15s}
  #sched-handle.left{left:0;border-left:none;border-radius:0 16px 16px 0}
  #sched-handle.right{right:0;border-right:none;border-radius:16px 0 0 16px}
  #sched-handle:hover{background:var(--surface-2)}
  #sched-handle .ico{font-size:20px}
  #sched-handle .lbl{writing-mode:vertical-rl;text-orientation:mixed;font-weight:900;font-size:10px;color:var(--ink-soft);letter-spacing:1.5px}
  #sched-handle .chev{font-size:13px;color:var(--accent);font-weight:900}
  .sched-min{border:none;background:transparent;color:var(--ink-soft);font-size:15px;cursor:pointer;border-radius:7px;width:24px;height:24px}
  .sched-min:hover{background:var(--line);color:var(--ink)}
  .sched-cog{cursor:pointer}
  .sched-cog .sched-emoji{opacity:.8}
  .sched-cog:hover .sched-emoji{opacity:1;border-color:var(--accent)}
  /* weekly planner grid */
  .modal.wide{width:min(960px,97vw)}
  /* The planner is the one dialog that genuinely needs width: seven days side by
     side in a 640px box is unreadable. Everything inside is deliberately dense so
     a full week clears a laptop screen without scrolling. */
  .modal.planner{width:min(1280px,98vw)}
  .week-hint{font-size:10px;color:var(--ink-soft);margin-bottom:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .week-grid{display:flex;gap:4px;align-items:flex-start}
  .week-col{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
  .week-col-head{font-weight:900;font-size:11px;text-align:center;padding:3px 2px;background:var(--surface);border-bottom:1px solid var(--line);cursor:pointer;line-height:1.25}
  .week-col-head:hover{color:var(--accent)}
  .week-col-head.today{background:var(--accent);color:var(--accent-ink)}
  .dt-date{display:block;font-size:9px;font-weight:700;opacity:.75;line-height:1.1}
  .dt-star{font-size:9px;opacity:.8}
  .week-body{padding:3px;display:flex;flex-direction:column;gap:3px;min-height:22px}
  /* compact editable session card: two short rows, detail+links behind icon buttons */
  .wc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 3px}
  .wc-r1{display:flex;align-items:center;gap:2px;margin-bottom:2px}
  .wc-time{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:5px;padding:1px 2px;font-size:10px;font-weight:700;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
  .wc-emoji{flex:0 0 auto;width:21px;text-align:center;border:1px solid var(--line);border-radius:5px;padding:1px;font-size:12px;background:var(--surface);color:var(--ink)}
  .wc-fold,.wc-x{flex:0 0 auto;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:11px;width:16px;height:16px;border-radius:4px;line-height:1;padding:0}
  .wc-fold:hover{background:var(--surface-2);color:var(--accent)}
  .wc-x:hover{background:var(--bad);color:#fff}
  .wc-r2{display:flex;align-items:center;gap:2px}
  .wc-name{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:5px;padding:2px 4px;font-size:11px;font-weight:700;background:var(--surface);color:var(--ink)}
  .wc-ic{position:relative;flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);border-radius:5px;width:19px;height:19px;font-size:10px;cursor:pointer;display:grid;place-items:center;padding:0}
  .wc-ic:hover{border-color:var(--accent);color:var(--ink)}
  .wc-ic.has{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent);color:var(--accent)}
  .wc-ic.open{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .wc-badge{position:absolute;top:-4px;right:-4px;min-width:12px;height:12px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:8px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 2px;line-height:1;box-shadow:0 0 0 1.5px var(--surface)}
  .wc-badge.show{display:flex}
  .wc-exp{margin-top:3px;border-top:1px dashed var(--line);padding-top:3px}
  .wc-detin{width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 5px;font-size:11px;background:var(--surface);color:var(--ink);resize:vertical;min-height:38px;font-family:inherit;line-height:1.3}
  .wc-reslist{display:flex;flex-direction:column;gap:2px}
  .res-chip{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 3px}
  .res-open{flex:1;cursor:pointer;color:var(--accent);font-weight:800;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:none;text-align:left;padding:1px 2px}
  .res-open:hover{text-decoration:underline}
  .res-mini{border:none;background:transparent;cursor:pointer;color:var(--ink-soft);font-size:10px;padding:0 1px}
  .res-mini:hover{color:var(--ink)}
  .res-add{border:1px dashed var(--line);background:transparent;color:var(--ink-soft);border-radius:6px;padding:2px;font-size:10px;cursor:pointer;font-weight:800}
  .res-add:hover{border-color:var(--accent);color:var(--accent)}
  .res-edit-box{display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:4px}
  .res-edit-box input{padding:3px 5px;font-size:10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
  .wc-addsession{border:1px dashed var(--line);background:transparent;color:var(--ink-soft);border-radius:6px;padding:2px;font-size:10px;font-weight:800;cursor:pointer}
  .wc-addsession:hover{border-color:var(--accent);color:var(--accent)}
  /* COLLAPSED session — lunch, recess, the morning routine. Things that never change
     and carry no resources shouldn't cost a full card. One thin line, click to restore. */
  .wc-min{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px dashed var(--line);
    border-radius:5px;padding:1px 4px;cursor:pointer;font-size:10px;color:var(--ink-soft);line-height:1.6}
  .wc-min:hover{border-color:var(--accent);color:var(--ink)}
  .wcm-time{flex:0 0 auto;font-weight:800;font-variant-numeric:tabular-nums;opacity:.85}
  .wcm-name{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .wk-foldchip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);border-radius:6px;
    padding:1px 6px;font-size:10px;font-weight:800;cursor:pointer}
  .wk-foldchip:hover{border-color:var(--accent);color:var(--accent)}
  .wk-orient{flex:0 0 auto}
  .wk-orient button{font-size:10px;padding:3px 7px}
  /* week view — days as rows, sessions side by side */
  .week-rows{display:flex;flex-direction:column;gap:4px}
  .week-drow{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);overflow:hidden}
  .week-drow-head{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:11px;
    background:var(--surface);border-right:1px solid var(--line);cursor:pointer;padding:2px;text-align:center;line-height:1.2}
  .week-drow-head:hover{color:var(--accent)}
  .week-drow-head.today{background:var(--accent);color:var(--accent-ink)}
  .week-drow-body{flex:1 1 0;min-width:0;display:flex;gap:3px;align-items:stretch;overflow-x:auto;padding:3px}
  .week-drow-body .wc{flex:0 0 132px;align-self:flex-start}
  .week-drow-body .wc-min{flex:0 0 auto;max-width:120px;align-self:flex-start}
  .wc-addh{flex:0 0 30px;align-self:stretch;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:13px}

  /* dice */
  .dice-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:84px;flex:1}
  .die{background:#fff;border:1px solid #d8e0ec;border-radius:13px;box-shadow:0 3px 10px rgba(28,48,80,.18);width:62px;height:62px;display:grid;place-items:center}
  .die.d6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:2px}
  .die.d6 .pip{width:12px;height:12px;border-radius:50%;place-self:center}
  .die.d6 .pip.on{background:#243042}
  .die.dn{font-size:28px;font-weight:900;color:#243042}
  /* scoreboard — big tappable panels */
  .sb-wrap{display:flex;gap:8px;flex:1;min-height:220px}
  .sb-panel{flex:1;border:none;border-radius:16px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .08s;user-select:none}
  .sb-panel:active{transform:scale(.985)}
  .sb-panel.pulse{animation:sbpulse .25s ease}
  @keyframes sbpulse{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  .sb-name{background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:900;font-size:18px;text-align:center;
    border-radius:10px;padding:6px 10px;width:82%;max-width:220px}
  .sb-name::placeholder{color:rgba(255,255,255,.7)}
  .sb-name:focus{outline:none;background:rgba(255,255,255,.32)}
  .sb-score{font-size:clamp(54px,15vw,120px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 3px 12px rgba(0,0,0,.22)}
  .sb-ctrls{position:absolute;bottom:10px;display:flex;gap:8px}
  .sb-minus,.sb-remove{border:none;background:rgba(0,0,0,.22);color:#fff;width:38px;height:38px;border-radius:50%;font-size:19px;font-weight:900;cursor:pointer;line-height:1}
  .sb-minus:hover,.sb-remove:hover{background:rgba(0,0,0,.38)}
  .sb-crown{position:absolute;top:8px;font-size:24px;display:none}
  .sb-panel.leading .sb-crown{display:block}
  .sb-panel.leading{box-shadow:0 0 0 4px rgba(255,255,255,.65) inset,0 6px 22px rgba(0,0,0,.25)}

  /* slides stage (full-screen backdrop behind OS chrome) */
  #slide-stage{position:fixed;inset:0;z-index:2;background:#0e1726;display:flex;align-items:center;justify-content:center;
    padding:64px 76px 34px;box-sizing:border-box}
  #slide-stage img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;cursor:pointer}
  #slide-stage iframe{width:100%;height:100%;border:none;background:#0e1726;border-radius:10px}
  body.slides-full #slide-stage{padding:0}
  body.slides-full #slide-stage iframe{border-radius:0}
  .slide-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:3;width:50px;height:80px;border:none;border-radius:14px;
    background:rgba(0,0,0,.32);color:#fff;font-size:32px;cursor:pointer;opacity:.45;transition:.15s}
  .slide-nav:hover{opacity:1;background:rgba(0,0,0,.6)}
  #slide-prev{left:14px}#slide-next{right:14px}
  #slide-count{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.45);color:#fff;
    padding:5px 14px;border-radius:999px;font-weight:800;font-size:14px}
  #slide-controls{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:var(--z-chrome);display:flex;gap:8px}
  #slide-controls button{border:none;border-radius:999px;background:rgba(0,0,0,.58);color:#fff;font-weight:800;font-size:13px;
    padding:9px 16px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:.15s}
  #slide-full:hover{background:rgba(0,0,0,.85)}
  #slide-exit:hover{background:rgba(226,87,76,.92)}
  /* overlay visibility toggles while presenting */
  body.hide-rail #sched-rail{display:none!important}
  body.hide-notif #notif-btn{display:none!important}
  /* while a deck is on screen, free up the top-centre zone for slide controls */
  body.presenting #topbar{display:none!important}
  /* fullscreen present: nothing but the deck */
  body.slides-full #dock,body.slides-full #dock-handle,body.slides-full #min-tray,
  body.slides-full #topbar,body.slides-full #notif-btn,body.slides-full #notif-panel,
  body.slides-full #undo-btn,body.slides-full #redo-btn,
  body.slides-full #sched-rail,body.slides-full .win{display:none!important}
  /* slides controller */
  .thumb-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .thumb{flex:0 0 auto;width:108px;border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#000;line-height:0}
  .thumb.on{border-color:var(--accent)}
  .thumb img{width:100%;display:block}
  .slide-drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--ink-soft)}

  /* forms & QR */
  .form-li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--surface-2)}
  .form-li .meta{font-size:11px;color:var(--ink-soft)}
  .q-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--surface-2)}
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .qr-box .qr{background:#fff;padding:14px;border-radius:16px;border:1px solid var(--line);line-height:0}
  .qr-box .qr img,.qr-box .qr canvas{display:block}
  .result-q{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .bar-row{margin-bottom:7px}
  .bar-track{height:15px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:6px}
  .roster-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-weight:700;font-size:12px;background:var(--surface-2)}
  .roster-pill.done{background:var(--good);color:#fff;border-color:var(--good)}
  .roster-pill .code{font-variant-numeric:tabular-nums;opacity:.7;font-size:11px}
  .ans-feed{max-height:160px;overflow:auto;display:flex;flex-direction:column;gap:5px}
  .ans-item{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px}
  /* quick poll */
  .poll-dot{width:15px;height:15px;border-radius:50%;flex:0 0 auto}
  .poll-opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--pc);
    background:var(--surface);color:var(--ink);border-radius:14px;padding:15px 16px;font-size:18px;font-weight:800;cursor:pointer;
    overflow:hidden;min-height:56px;transition:transform .09s ease,box-shadow .2s}
  .poll-opt .poll-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb, var(--pc) 20%, transparent);transition:width .3s;z-index:0}
  .poll-opt .poll-lab{position:relative;z-index:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poll-opt .poll-num{position:relative;z-index:1;font-variant-numeric:tabular-nums;color:var(--pc);font-size:16px}
  .poll-opt .poll-minus{position:relative;z-index:1;border:none;background:transparent;color:var(--ink-soft);font-size:22px;font-weight:900;
    width:30px;height:30px;border-radius:8px;cursor:pointer;line-height:1;flex:0 0 auto}
  .poll-opt .poll-minus:hover{background:var(--line);color:var(--ink)}
  .poll-opt.lead{box-shadow:0 4px 18px color-mix(in srgb, var(--pc) 35%, transparent)}
  .poll-opt.pulse{transform:scale(1.02)}
  #dock{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(140%);
    display:flex;gap:6px;align-items:center;padding:8px 10px 10px;max-width:94vw;
    background:var(--surface);border:1px solid var(--line);
    border-radius:20px;box-shadow:var(--shadow);z-index:var(--z-chrome);
    transition:transform .28s cubic-bezier(.2,.9,.3,1.2);
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scroll-behavior:smooth;overscroll-behavior-x:contain;
  }
  #dock.show{transform:translateX(-50%) translateY(0)}
  #dock::-webkit-scrollbar{height:6px}
  #dock::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
  #dock::-webkit-scrollbar-track{background:transparent}
  .dock-app{
    border:none;background:transparent;border-radius:14px;
    width:54px;height:54px;display:grid;place-items:center;gap:0;
    font-size:26px;position:relative;flex:0 0 auto;transition:transform .12s;
  }
  .dock-app small{position:absolute;bottom:2px;font-size:8.5px;font-weight:800;color:var(--ink-soft);
    white-space:nowrap;letter-spacing:.2px}
  .dock-app:hover{transform:translateY(-6px) scale(1.08);background:var(--surface-2)}
  .dock-app.dragging{opacity:.35;transform:scale(.92)}
  .dock-app[draggable=true]{cursor:grab}
  .dock-app.active::after{content:"";position:absolute;bottom:-4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .dock-sep{width:1px;height:38px;background:var(--line);margin:0 2px;flex:0 0 auto}
  /* dock group submenu */
  #dock-submenu{position:fixed;z-index:calc(var(--z-chrome) + 2);display:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:8px}
  #dock-submenu .submenu-grid{display:flex;gap:5px;flex-wrap:wrap;max-width:300px;justify-content:center}
  #dock-submenu .submenu-app{border:none;background:transparent;border-radius:13px;width:62px;height:58px;display:grid;place-items:center;font-size:24px;position:relative}
  #dock-submenu .submenu-app small{position:absolute;bottom:3px;font-size:8.5px;font-weight:800;color:var(--ink-soft);white-space:nowrap}
  #dock-submenu .submenu-app:hover{background:var(--surface-2)}
  .dock-app.group::after{content:'▾';position:absolute;top:3px;right:6px;font-size:9px;color:var(--ink-soft)}

  /* ===== Shared controls ===== */
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    padding:9px 14px;border-radius:11px;font-weight:800;font-size:14px;transition:.12s;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
  .btn.danger{color:var(--bad)}
  .field{
    width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    padding:10px 12px;border-radius:11px;font-size:14px;font-weight:600;
  }
  textarea.field{resize:vertical;min-height:80px;line-height:1.5}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px}
  .muted{color:var(--ink-soft);font-size:13px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-weight:800;color:var(--ink-soft);font-size:13px}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;text-align:center}
  .big-num{font-size:clamp(46px,16vw,140px);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-2px}
  .hint{font-size:12px;color:var(--ink-soft)}

  /* Toasts — momentary, so kept thin and light */
  #toasts{position:fixed;top:58px;right:12px;display:flex;flex-direction:column;gap:5px;z-index:var(--z-toast);max-width:310px}
  .toast{
    background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:9px;box-shadow:var(--shadow);padding:5px 9px;display:flex;gap:7px;align-items:flex-start;
    animation:slidein .3s ease;
  }
  @keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
  .toast .t-emoji{font-size:16px;line-height:1.15}
  .toast .t-title{font-weight:800;font-size:12.5px}
  .toast .t-msg{font-size:11.5px;color:var(--ink-soft);margin-top:0}
  .toast .t-close{margin-left:auto;border:none;background:transparent;color:var(--ink-soft);font-size:15px;line-height:1;padding:0 2px}

  /* lists */
  .list{display:flex;flex-direction:column;gap:6px}
  .list-item{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:7px 10px;font-weight:700}
  .list-item.editing{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .gp-names{margin-top:2px;line-height:1.7}
  .gp-names .gp-kept{color:#1f7d4f;font-weight:800;background:color-mix(in srgb,#2aa66a 14%,transparent);border-radius:6px;padding:1px 6px}
  .gp-names .gp-clash{color:#c0271e;font-weight:800;background:color-mix(in srgb,#e2362c 14%,transparent);border-radius:6px;padding:1px 6px}
  .gp-warn{padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700;
    background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--ink)}
  .rm-vol{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px}
  .rm-vol input[type=range]{accent-color:var(--accent)}
  .list-item .x{margin-left:auto;border:none;background:transparent;color:var(--ink-soft);font-size:16px}
  .tag{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px}

  /* spinner / wheel */
  .wheel-wrap{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto}
  .wheel-pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:26px;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
  canvas.wheel{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.2,1)}

  /* noise meter */
  .noise-bar{height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
  .noise-fill{height:100%;width:0%;transition:width .15s, background .3s;border-radius:999px}

  .empty{display:grid;place-items:center;height:100%;color:var(--ink-soft);text-align:center;gap:8px;padding:20px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}

  /* settings tiles */
  .theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .theme-tile{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:800;display:flex;flex-direction:column;gap:8px}
  .theme-tile.on{border-color:var(--accent)}
  .swatches{display:flex;gap:5px}
  .swatch{width:22px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.1)}
  .tool-toggle{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px}

  /* task grid */
  .grid-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  .grid-card{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center;cursor:pointer;transition:.12s;position:relative}
  .grid-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .grid-card .gc-emoji{font-size:30px;line-height:1.1}
  .grid-card .gc-name{font-weight:800;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid-card .gc-stage{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:1px}
  .grid-card .gc-back{position:absolute;top:4px;left:5px;border:none;background:transparent;color:var(--ink-soft);font-size:13px;opacity:0;transition:.12s}
  .grid-card:hover .gc-back{opacity:.8}
  .grid-card .gc-addnote{position:absolute;top:4px;right:5px;border:none;background:transparent;color:var(--ink-soft);font-size:12px;opacity:0;transition:.12s;cursor:pointer}
  .grid-card:hover .gc-addnote{opacity:.7}
  .grid-card .gc-addnote:hover{opacity:1;color:var(--accent)}
  /* touch devices have no hover: reveal the card controls permanently, otherwise
     ↺ and ✎ are invisible and unusable on a tablet */
  @media (hover:none){
    .grid-card .gc-back,.grid-card .gc-addnote{opacity:.55}
  }
  .grid-card .gc-note{display:block;width:100%;margin-top:7px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));
    background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);border-radius:9px;padding:4px 6px;
    font-size:10.5px;font-weight:700;line-height:1.25;cursor:pointer;text-align:left;transition:.12s;position:relative}
  .grid-card .gc-note:hover{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
  .grid-card .gc-note .gc-note-tick{float:right;font-weight:900;color:var(--good);opacity:.5}
  .grid-card .gc-note:hover .gc-note-tick{opacity:1}
  .grid-card.has-note{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .grid-card.done.has-note{border-color:var(--accent)}
  .grid-card .gc-note-edit{margin-top:7px}
  .grid-card .gc-note-edit input{width:100%;font-size:11px;padding:4px 6px;border:1px solid var(--accent);border-radius:9px;
    background:var(--surface);color:var(--ink);font-weight:600;box-sizing:border-box}
  .grid-card.done{background:var(--accent);border-color:var(--accent)}
  .grid-card.done .gc-name,.grid-card.done .gc-stage{color:var(--accent-ink)}
  .stage-track{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .stage-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}
  .stage-arrow{color:var(--ink-soft);align-self:center}

  /* weekday picker */
  .dow-row{display:flex;gap:4px;flex-wrap:wrap}
  .dow{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink-soft);font-weight:900;font-size:12px;display:grid;place-items:center;padding:0}
  .dow.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .switch{margin-left:auto;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:.2s;border:none;flex:0 0 auto}
  .switch.on{background:var(--accent)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on::after{transform:translateX(18px)}
  /* ===== Settle (breather + countdown) ===== */
  .settle-wrap{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;gap:12px;text-align:center;padding:14px}
  .settle-title{font-size:20px;font-weight:900}
  .settle-sub{color:var(--ink-soft);font-size:13px;max-width:280px;line-height:1.35}
  .settle-bignum{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .settle-bignum span{font-size:18px;color:var(--ink-soft);margin-left:2px}
  .settle-presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .settle-controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .settle-in{width:84px;text-align:center}
  .settle-start{font-size:16px;padding:10px 30px}
  .settle-orb-area{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:160px}
  .settle-orb{width:min(72%,300px);aspect-ratio:1;border-radius:50%;transform:scale(.6);
    background:radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--accent) 38%, #ffffff) 0%, var(--accent) 72%);
    box-shadow:0 0 70px color-mix(in srgb,var(--accent) 40%, transparent), inset 0 -10px 30px rgba(0,0,0,.12)}
  .settle-orb.run{animation:breathe 8s ease-in-out infinite}
  .settle-orb.paused{animation-play-state:paused}
  @keyframes breathe{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
  .settle-num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;
    font-size:clamp(42px,13vw,104px);font-weight:900;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.3);font-variant-numeric:tabular-nums;line-height:1}
  .settle-cap{font-weight:800;color:var(--ink-soft);font-size:15px;min-height:20px;letter-spacing:.5px}
  /* ===== Corkboard ===== */
  .cork-wrap{display:flex;flex-direction:column;height:100%}
  .cork-toolbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
  .cork-board{position:relative;flex:1;overflow:hidden;
    background:#caa472;
    background-image:radial-gradient(circle at 50% 50%, rgba(0,0,0,.10) 1px, transparent 1.6px);
    background-size:13px 13px;box-shadow:inset 0 0 60px rgba(0,0,0,.22)}
  .cork-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);
    font-weight:800;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.3);pointer-events:none}
  .cork-note{position:absolute;width:170px;min-height:150px;display:flex;flex-direction:column;
    background:var(--paper);border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.28);transition:box-shadow .15s}
  .cork-note.dragging{box-shadow:0 16px 30px rgba(0,0,0,.4);cursor:grabbing;z-index:5}
  .cork-grip{height:24px;display:flex;align-items:center;justify-content:center;position:relative;cursor:grab;touch-action:none}
  .cork-grip:active{cursor:grabbing}
  .cork-pin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ff7b7b, #c62828 70%);
    box-shadow:0 2px 3px rgba(0,0,0,.4), inset 0 -1px 2px rgba(0,0,0,.3);cursor:pointer}
  .cork-del{position:absolute;right:4px;top:2px;border:none;background:transparent;color:rgba(0,0,0,.35);font-size:13px;
    width:20px;height:20px;border-radius:6px;cursor:pointer;line-height:1}
  .cork-del:hover{background:rgba(0,0,0,.12);color:rgba(0,0,0,.7)}
  .cork-text{flex:1;border:none;background:transparent;resize:none;padding:4px 12px 12px;font-family:'Comic Sans MS','Marker Felt','Segoe Print',cursive;
    font-size:15px;font-weight:700;color:#3a2f1a;line-height:1.3;outline:none}
  .cork-text::placeholder{color:rgba(58,47,26,.4)}
  /* ===== Seating chart ===== */
  .seat-wrap{display:flex;flex-direction:column;height:100%}
  .seat-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
  .seat-floor{position:relative;flex:1;overflow:hidden;background:var(--surface-2);touch-action:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:32px 32px;background-position:-1px -1px}
  .seat-lasso{position:absolute;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
    border-radius:4px;pointer-events:none;z-index:5}
  .pref-list{display:flex;flex-direction:column;gap:5px;max-height:52vh;overflow:auto}
  .pref-row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
  .pref-row .pref-name{font-weight:800;font-size:13px}
  .pref-row .pref-flag{font-size:11px}
  .pref-row select{min-width:92px}
  .seat.sel{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  .seat-selbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;
    padding:6px 14px;font-size:12px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .seat-selbar button{border:none;background:transparent;color:var(--accent);font-weight:800;cursor:pointer;font-size:12px;padding:2px 4px}
  .seat-selbar button:hover{text-decoration:underline}
  .seat-front{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--accent) 16%, var(--surface));color:var(--ink-soft);font-weight:900;font-size:11px;letter-spacing:1px;border-bottom:1px solid var(--line)}
  .seat-hint{position:absolute;inset:26px 0 0 0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-weight:700;font-size:14px;pointer-events:none;padding:0 20px;text-align:center}
  .seat{position:absolute;width:108px;height:60px;display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 8px;
    border:2px dashed var(--line);border-radius:12px;background:var(--surface);cursor:grab;touch-action:none;
    box-shadow:0 2px 6px rgba(0,0,0,.08);transition:box-shadow .15s,border-color .15s,transform .08s}
  .seat.filled{border-style:solid;border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--surface))}
  .seat.dragging{box-shadow:0 12px 24px rgba(0,0,0,.28);cursor:grabbing;z-index:5}
  .seat.over{border-color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 40%, transparent);transform:scale(1.04)}
  .seat-name{font-weight:800;font-size:14px;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px;padding-left:8px}
  .seat-empty{color:var(--ink-soft);font-weight:600;font-size:12px}
  .seat-x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-soft);font-size:11px;line-height:1;cursor:pointer;display:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .seat:hover .seat-x{display:block}
  /* no hover on a tablet — keep the desk's remove button reachable */
  @media (hover:none){ .seat-x{display:block!important;opacity:.6} }
  .seat-x:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
  /* a filled desk shows a grip: drag the grip to move the DESK, drag the name to move the STUDENT */
  .seat-grip{position:absolute;left:5px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:12px;
    opacity:.35;cursor:grab;line-height:1;user-select:none}
  .seat-grip:hover{opacity:.9}
  .seat.filled .seat-name{cursor:grab}
  .seat.filled:hover{box-shadow:0 4px 14px rgba(0,0,0,.16)}
  .seat-chip.lifting{opacity:.35;border-style:dashed}
  /* the desk you're hovering over — unmistakable drop target */
  .seat.over{border-color:var(--good)!important;border-style:solid!important;
    background:color-mix(in srgb,var(--good) 22%,var(--surface))!important;
    box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 45%,transparent),0 6px 18px rgba(0,0,0,.2)!important;
    transform:scale(1.07);z-index:6}
  /* the name list lights up as a drop zone while a seated student is being dragged */
  .seat-pool.drop-live{outline:2px dashed var(--line);outline-offset:-4px}
  .seat-pool.drop-hot{outline-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
  .seat-pool.drop-hot .seat-poollab::after{content:' — drop here to unseat';color:var(--bad);font-weight:900}
  .seat-poolhelp{color:var(--ink-soft);font-weight:600}
  /* kid-friendly view toggle */
  .seat-toolbar [data-kid].on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .seat-toolbar [data-kid].has-clash{box-shadow:0 0 0 2px var(--bad) inset}
  .seat-pool{border-top:1px solid var(--line);background:var(--surface);padding:8px 10px;max-height:140px;overflow:auto}
  .seat-poollab{font-weight:800;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
  .seat-poolhint{color:var(--ink-soft);font-size:13px;padding:6px 2px}
  .seat-chips{display:flex;flex-wrap:wrap;gap:6px}
  .seat-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:5px 12px 5px 8px;
    font-weight:800;font-size:13px;cursor:grab;touch-action:none;user-select:none}
  .seat-chip:hover{border-color:var(--accent)}
  .chip-name{pointer-events:none}
  .chip-flag,.seat-flag{border:none;background:transparent;cursor:pointer;padding:0;line-height:1;filter:grayscale(1);opacity:.32;transition:.12s;font-size:13px}
  .chip-flag:hover,.seat-flag:hover{opacity:.75;filter:grayscale(.2)}
  .chip-flag.on,.seat-flag.on{filter:none;opacity:1}
