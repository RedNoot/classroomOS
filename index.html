  function renderResults(){
    const hidden = current.meta?.results==='hidden';
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:10px">
        <div class="row"><button class="btn sm ghost" data-back>← Back</button><b style="flex:1">${esc(current.title)} — results</b>
          <button class="btn sm" data-present>QR →</button></div>
        <div class="pill" data-count>0 responses</div>
        ${hidden?'<button class="btn primary sm" data-reveal style="align-self:flex-start">👁 Reveal results</button>':''}
        <div data-out style="flex:1;overflow:auto"></div>
        ${FormsAPI.live()?'':'<button class="btn sm" data-sim>＋ Simulate a response (preview)</button>'}
      </div>`;
    body.querySelector('[data-back]').onclick=back;
    body.querySelector('[data-present]').onclick=()=>{ view='present'; render(); };
    const rv=body.querySelector('[data-reveal]'); if(rv) rv.onclick=()=>{ revealed=true; rv.remove(); paint(); };
    const sim=body.querySelector('[data-sim]'); if(sim) sim.onclick=async()=>{ await simulate(current); refresh(); };
    function paint(){
      const out=body.querySelector('[data-out]'); if(!out)return;
      const hid = current.meta?.results==='hidden';
      if(hid && !revealed){ out.innerHTML='<div class="empty">Results are hidden.<br>Tap “Reveal results” when you’re ready.</div>'; return; }
      out.innerHTML='';
      if(current.meta?.identity==='code' && current.roster?.length){
        const answered=new Set(responses.map(r=>r.name));
        const done=current.roster.filter(s=>answered.has(s.name)).length;
        const g=document.createElement('div'); g.className='result-q';
        g.innerHTML=`<b>Completed: ${done} / ${current.roster.length}</b><div class="roster-grid" style="margin-top:8px">`+
          current.roster.map(s=>`<span class="roster-pill ${answered.has(s.name)?'done':''}">${esc(s.name)} <span class="code">${s.code}</span></span>`).join('')+`</div>`;
        out.appendChild(g);
      }
      current.fields.forEach(q=>{
        const card=document.createElement('div'); card.className='result-q';
        card.innerHTML=`<b>${esc(q.label)}</b>`;
        const vals=responses.map(r=>r.answers?.[q.id]).filter(v=>v!==undefined&&v!=='');
        if(q.type==='short'||q.type==='long'){
          const feed=document.createElement('div'); feed.className='ans-feed'; feed.style.marginTop='8px';
          feed.innerHTML = vals.length?vals.slice().reverse().map(v=>`<div class="ans-item">${esc(v)}</div>`).join(''):'<div class="muted">No answers yet</div>';
          card.appendChild(feed);
        } else {
          let opts;
          if(q.type==='yesno') opts=['Yes','No'];
          else if(q.type==='scale') opts=Array.from({length:q.max||5},(_,i)=>String(i+1));
          else opts=q.options||[];
          const counts=opts.map(o=>({label:o,count:0}));
          vals.forEach(v=>{ (Array.isArray(v)?v:[v]).forEach(x=>{ const c=counts.find(c=>c.label===String(x)); if(c)c.count++; }); });
          const chart=document.createElement('div'); chart.style.marginTop='8px'; barChart(chart,counts); card.appendChild(chart);
        }
        out.appendChild(card);
      });
    }
    const refresh=async()=>{ try{ responses=await FormsAPI.listResponses(current.id);
      const c=body.querySelector('[data-count]'); if(c)c.textContent=responses.length+(responses.length===1?' response':' responses'); paint(); }catch(e){} };
    refresh(); pollTimer=setInterval(()=>{ if(!document.contains(body)){stopPoll();return;} refresh(); },2000);
  }

  function renderPoll(){

    if(qpoll.live) renderPollLive(); else renderPollEdit();
  }
  function renderPollEdit(){
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:10px">
        <div class="row"><button class="btn sm ghost" data-back>← Back</button><b style="flex:1">⚡ Quick poll</b></div>
        <div class="hint">Instant in-room tally — no devices needed. Ask a question, then tap an option to count each vote or show of hands. Big live bars update on screen.</div>
        <input class="field" data-q placeholder="Poll question (e.g. Which story next?)" value="${esc(qpoll.q)}" style="font-weight:800;font-size:15px">
        <div data-opts style="display:flex;flex-direction:column;gap:6px"></div>

      </div>`;
    body.querySelector('[data-back]').onclick=back;
    body.querySelector('[data-q]').oninput=e=>qpoll.q=e.target.value;
    const opts=body.querySelector('[data-opts]');
    function renderOpts(){
      opts.innerHTML='';
      qpoll.opts.forEach((o,i)=>{
        const r=document.createElement('div'); r.className='row';
        r.innerHTML=`<span class="poll-dot" style="background:${POLL_COLORS[i%POLL_COLORS.length]}"></span>
          <input class="field" data-o placeholder="Option ${i+1}" value="${esc(o.label)}" style="flex:1">
          <button class="x" title="Remove" ${qpoll.opts.length<=2?'style="visibility:hidden"':''}>✕</button>`;
        r.querySelector('[data-o]').oninput=e=>o.label=e.target.value;
        r.querySelector('.x').onclick=()=>{ if(qpoll.opts.length>2){ qpoll.opts.splice(i,1); renderOpts(); } };
        opts.appendChild(r);
      });

    renderOpts();
    body.querySelector('[data-addopt]').onclick=()=>{ if(qpoll.opts.length<10){ qpoll.opts.push({label:'',count:0}); renderOpts(); } };
    body.querySelector('[data-start]').onclick=()=>{
      const kept=qpoll.opts.filter(o=>o.label.trim());
      if(kept.length<2){ alert('Add at least two options.'); return; }
      qpoll.opts=kept; if(!qpoll.q.trim()) qpoll.q='Quick poll';
      qpoll.live=true; renderPoll();
    };
  }
  function renderPollLive(){
    const total=qpoll.opts.reduce((s,o)=>s+o.count,0);
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:12px">
        <div class="row"><button class="btn sm ghost" data-edit>✎ Edit</button>
          <b style="flex:1;font-size:17px;text-align:center">${esc(qpoll.q)}</b>
          <button class="btn sm ghost" data-done>✓ Done</button></div>
        <div data-bars style="flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center"></div>
        <div class="row" style="justify-content:center"><span class="pill" data-total>${total} vote${total===1?'':'s'}</span>
          <button class="btn sm" data-reset>↺ Reset counts</button></div>
        <div class="row" style="justify-content:center;gap:6px;border-top:1px solid var(--line);padding-top:8px">
          <span class="hint" style="margin-right:2px">Save results:</span>
          <button class="btn sm" data-x-csv>⬇ CSV</button>
          <button class="btn sm" data-x-copy>📋 Copy</button>
          <button class="btn sm" data-x-pin>📌 Pin to board</button>
        </div>
      </div>`;
    body.querySelector('[data-edit]').onclick=()=>{ qpoll.live=false; renderPoll(); };
    body.querySelector('[data-done]').onclick=back;
    body.querySelector('[data-reset]').onclick=()=>{ qpoll.opts.forEach(o=>o.count=0); paintCounts(); };
    // ----- export helpers -----
    const stamp=()=>{ const d=new Date(); const p=n=>String(n).padStart(2,'0');
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); };
    const results=()=>{ const tot=qpoll.opts.reduce((s,o)=>s+o.count,0);
      return qpoll.opts.map(o=>({label:o.label, count:o.count, pct: tot?Math.round(o.count/tot*100):0, tot})); };
    const asText=()=>{ const r=results(), tot=r.length?r[0].tot:0;
      return `${qpoll.q}\n${stamp()} · ${tot} vote${tot===1?'':'s'}\n\n`
        + r.map(o=>`${o.label}: ${o.count} (${o.pct}%)`).join('\n'); };
    const csvCell=v=>`"${String(v).replace(/"/g,'""')}"`;
    const asCSV=()=>{ const r=results(), tot=r.length?r[0].tot:0;
      return [['Question','Recorded','Option','Votes','Percent','Total'].join(',')]
        .concat(r.map(o=>[qpoll.q, stamp(), o.label, o.count, o.pct+'%', tot].map(csvCell).join(','))).join('\n'); };
    const slug=(qpoll.q||'poll').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'poll';
    const flash=(btn,msg)=>{ const old=btn.textContent; btn.textContent=msg; btn.disabled=true;
      setTimeout(()=>{ btn.textContent=old; btn.disabled=false; },1400); };
    body.querySelector('[data-x-csv]').onclick=e=>{
      downloadText(`poll-${slug}.csv`, asCSV(), 'text/csv'); flash(e.currentTarget,'✓ Saved'); };
    body.querySelector('[data-x-copy]').onclick=async e=>{
      const btn=e.currentTarget, txt=asText();
      try{ await navigator.clipboard.writeText(txt); flash(btn,'✓ Copied'); }
      catch(err){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); flash(btn,'✓ Copied'); }catch(e2){ flash(btn,'✕ Failed'); }
        ta.remove(); } };
    body.querySelector('[data-x-pin]').onclick=e=>{
      const n=CORK.length;
      CORK.push({id:Date.now()+Math.floor(Math.random()*99), text:asText(),
        color:CORK_COLORS[n%CORK_COLORS.length], x:26+(n%6)*36, y:26+(n%6)*28, rot:(Math.random()*8-4)});
      Store.set('cork',CORK); refreshOpen(['cork']); flash(e.currentTarget,'✓ Pinned'); };
    const bars=body.querySelector('[data-bars]');
    function paintCounts(){
      const tot=qpoll.opts.reduce((s,o)=>s+o.count,0);
      const max=Math.max(1,...qpoll.opts.map(o=>o.count));
      [...bars.children].forEach((b,i)=>{
        const o=qpoll.opts[i], share=tot?Math.round(o.count/tot*100):0;
        b.querySelector('.poll-fill').style.width=Math.round(o.count/max*100)+'%';
        b.querySelector('.poll-num').textContent=o.count+(tot?' · '+share+'%':'');
        b.classList.toggle('lead', o.count>0 && o.count===max);
      });
      const t=body.querySelector('[data-total]'); if(t)t.textContent=tot+(tot===1?' vote':' votes');
    }
    function pulse(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
    qpoll.opts.forEach((o,i)=>{
      const col=POLL_COLORS[i%POLL_COLORS.length];
      const b=document.createElement('button'); b.className='poll-opt'; b.style.setProperty('--pc',col);
      b.innerHTML=`<span class="poll-fill"></span><span class="poll-lab">${esc(o.label)}</span>
        <span class="poll-num">0</span><button class="poll-minus" title="Subtract one">−</button>`;
      b.onclick=e=>{ if(e.target.closest('.poll-minus'))return; o.count++; tone('blip'); paintCounts(); pulse(b); };
      b.querySelector('.poll-minus').onclick=e=>{ e.stopPropagation(); if(o.count>0){ o.count--; paintCounts(); } };
      bars.appendChild(b);
    });
    paintCounts();
  }

  async function simulate(form){
    const names=['Tester','Sam','Riley','Jo','Alex','Max'];
    let name=null;
    if(form.meta.identity==='named') name=names[Math.floor(Math.random()*names.length)];
    if(form.meta.identity==='code' && form.roster?.length) name=form.roster[Math.floor(Math.random()*form.roster.length)].name;
    const answers={};
    form.fields.forEach(q=>{
      if(q.type==='short') answers[q.id]=['Great!','Not sure','I liked it','More please'][Math.floor(Math.random()*4)];
      else if(q.type==='long') answers[q.id]='This is a sample longer answer for preview.';
      else if(q.type==='yesno') answers[q.id]=Math.random()<.5?'Yes':'No';
      else if(q.type==='scale') answers[q.id]=String(1+Math.floor(Math.random()*(q.max||5)));
      else if(q.type==='choice') answers[q.id]=(q.options||['—'])[Math.floor(Math.random()*(q.options?.length||1))];
      else if(q.type==='checkbox'){ answers[q.id]=(q.options||[]).filter(()=>Math.random()<.5); if(!answers[q.id].length&&q.options?.length)answers[q.id]=[q.options[0]]; }
    });
    await FormsAPI.addResponse({form_id:form.id,name,answers});
  }

  render();
}

   APP: DICE
   ============================================================ */
const DICE_PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function diceFace(v, sides){
  if(sides===6){ const set=new Set(DICE_PIPS[v]||[]);
    return `<div class="die d6">`+Array.from({length:9},(_,i)=>`<span class="pip ${set.has(i)?'on':''}"></span>`).join('')+`</div>`; }
  return `<div class="die dn">${v}</div>`;
}
function buildDice(body){
  let count=2, sides=6, rolling=false;
  Store.get('dice',{count:2,sides:6}).then(d=>{ count=d.count||2; sides=d.sides||6; init(); });
  function init(){
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:12px">
        <div class="row" style="justify-content:center;gap:12px">
          <div class="row" style="gap:4px"><span class="muted">Dice</span>
            <button class="btn sm" data-minus>−</button><span class="pill" data-count>${count}</span><button class="btn sm" data-plus>＋</button></div>
          <select class="field" data-sides style="width:auto">
            ${[6,4,8,10,12,20].map(s=>`<option value="${s}" ${s===sides?'selected':''}>D${s}</option>`).join('')}
          </select>
        </div>
        <div class="dice-tray" data-tray></div>
        <div class="center-col" style="height:auto;gap:2px">
          <div class="big-num" data-total style="font-size:38px">—</div><div class="muted">total</div>
        </div>
        <button class="btn primary" data-roll>🎲 Roll</button>
      </div>`;
    const tray=body.querySelector('[data-tray]'), total=body.querySelector('[data-total]'), cnt=body.querySelector('[data-count]');
    const save=()=>Store.set('dice',{count,sides});
    function show(vals){ tray.innerHTML=vals.map(v=>diceFace(v,sides)).join(''); }
    show(Array.from({length:count},()=>1));
    body.querySelector('[data-minus]').onclick=()=>{ count=Math.max(1,count-1); cnt.textContent=count; save(); show(Array.from({length:count},()=>1)); total.textContent='—'; };
    body.querySelector('[data-plus]').onclick=()=>{ count=Math.min(8,count+1); cnt.textContent=count; save(); show(Array.from({length:count},()=>1)); total.textContent='—'; };
    body.querySelector('[data-sides]').onchange=e=>{ sides=+e.target.value; save(); show(Array.from({length:count},()=>1)); total.textContent='—'; };
    body.querySelector('[data-roll]').onclick=()=>{
      if(rolling)return; rolling=true; let ticks=0;
      const iv=setInterval(()=>{
        const vals=Array.from({length:count},()=>1+Math.floor(Math.random()*sides));
        show(vals);
        if(++ticks>11){ clearInterval(iv); rolling=false; total.textContent=vals.reduce((a,b)=>a+b,0); tone('blip'); }
      },55);
    };
  }
}

const SCORE_COLORS=['#3a8dde','#27ae60','#f1a23b','#e2574c','#8e6cef','#16b5b5','#e85aa0','#6aa84f'];
function buildScoreboard(body){
  if(!SCOREBOARD.length){
    SCOREBOARD=[{id:1,name:'Red',score:0,color:'#e2574c'},{id:2,name:'Blue',score:0,color:'#3a8dde'}];
    Store.set('scoreboard',SCOREBOARD);
  }
  const save=()=>Store.set('scoreboard',SCOREBOARD);
  function render(){
    body.innerHTML=`
      <div style="display:flex;flex-direction:column;height:100%;gap:8px">
        <div class="sb-wrap" data-wrap></div>
        <div class="row" style="align-items:center">
          <button class="btn sm" data-add>＋ Team</button>
          <button class="btn sm" data-reset>Reset</button>
          <span class="hint" style="flex:1;text-align:right">Tap a team to score · − to undo</span>
        </div>
      </div>`;
    const wrap=body.querySelector('[data-wrap]');
    function refresh(){
      const max=Math.max(...SCOREBOARD.map(t=>t.score));
      const tied=SCOREBOARD.filter(t=>t.score===max).length===SCOREBOARD.length;
      [...wrap.children].forEach((panel,i)=>{ const t=SCOREBOARD[i]; if(!t)return;
        panel.querySelector('.sb-score').textContent=t.score;
        panel.classList.toggle('leading', t.score===max && max>0 && !tied);
      });
    }
    SCOREBOARD.forEach(t=>{
      const panel=document.createElement('div'); panel.className='sb-panel'; panel.style.background=t.color;
      panel.innerHTML=`<span class="sb-crown">👑</span>
        <input class="sb-name" value="${esc(t.name)}" placeholder="Team">
        <div class="sb-score">${t.score}</div>
        <div class="sb-ctrls">
          <button class="sb-minus" title="Undo">−</button>
          ${SCOREBOARD.length>2?'<button class="sb-remove" title="Remove team">✕</button>':''}
        </div>`;
      panel.onclick=()=>{ t.score++; save(); refresh(); panel.classList.remove('pulse'); void panel.offsetWidth; panel.classList.add('pulse'); tone('blip'); };
      const nm=panel.querySelector('.sb-name');
      nm.onclick=e=>e.stopPropagation(); nm.onmousedown=e=>e.stopPropagation();
      nm.oninput=e=>{ t.name=e.target.value; save(); };
      panel.querySelector('.sb-minus').onclick=e=>{ e.stopPropagation(); t.score=Math.max(0,t.score-1); save(); refresh(); };
      const rm=panel.querySelector('.sb-remove'); if(rm) rm.onclick=e=>{ e.stopPropagation(); SCOREBOARD=SCOREBOARD.filter(x=>x.id!==t.id); save(); render(); };
      wrap.appendChild(panel);
    });
    refresh();
    body.querySelector('[data-add]').onclick=()=>{ SCOREBOARD.push({id:Date.now(),name:'Team '+(SCOREBOARD.length+1),score:0,color:SCORE_COLORS[SCOREBOARD.length%SCORE_COLORS.length]}); save(); render(); };
    body.querySelector('[data-reset]').onclick=()=>{ SCOREBOARD.forEach(t=>t.score=0); save(); render(); };
  }
  render();
}

/* ============================================================
   APP: SETTLE  (calming pulsing breather + seconds countdown)
   ============================================================ */
function buildSettle(body, win){
  body.style.padding='0';
  let secs=Math.max(3,Math.min(900, parseInt(SETTINGS.settleSecs)||30));
  let remaining=secs, tick=null, capTimer=null, state='setup', capIn=true; // setup|run|paused|done
  const fmt=n=>String(Math.max(0,Math.ceil(n)));
  const clearTimers=()=>{ clearInterval(tick); tick=null; clearInterval(capTimer); capTimer=null; };
  const gone=()=>!document.body.contains(body);
  function startTick(){
    clearInterval(tick); let last=Date.now();
    tick=setInterval(()=>{
      if(gone()){ clearTimers(); return; }
      const now=Date.now(); remaining-=(now-last)/1000; last=now;
      if(remaining<=0){ remaining=0; clearTimers(); state='done'; try{tone(toolSound('settle'));}catch(e){} render(); return; }
      const n=body.querySelector('.settle-num'); if(n) n.textContent=fmt(remaining);
    },200);
  }
  function startCap(wrap){
    const cap=wrap.querySelector('[data-cap]'); if(!cap)return;
    capIn=true; cap.textContent='Breathe in…'; clearInterval(capTimer);
    capTimer=setInterval(()=>{ if(gone()){clearTimers();return;} capIn=!capIn; cap.textContent=capIn?'Breathe in…':'Breathe out…'; },4000);
  }
  function render(){
    body.innerHTML='';
    const wrap=document.createElement('div'); wrap.className='settle-wrap';
    if(state==='setup'){
      wrap.innerHTML=`
        <div class="settle-title">🧘 Settle</div>
        <div class="settle-sub">A calm breathing countdown to bring the room back together.</div>
        <div class="settle-bignum">${secs}<span>s</span></div>
        <div class="settle-presets">${[15,30,60,120].map(v=>`<button class="btn sm ${v===secs?'primary':''}" data-pre="${v}">${v}s</button>`).join('')}</div>
        <div class="settle-controls">
          <button class="btn sm" data-d="-10">−10s</button>
          <input class="field settle-in" type="number" min="3" max="900" value="${secs}">
          <button class="btn sm" data-d="10">＋10s</button>
        </div>
        <button class="btn primary settle-start" data-start>▶ Start</button>
        <div class="settle-snd" data-sndrow>${soundPickerHTML(toolSound('settle'),'Chime when done')}</div>`;
      wireSoundPicker(wrap.querySelector('[data-sndrow]'), v=>setToolSound('settle',v));
      wrap.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ secs=+b.dataset.pre; render(); });
      wrap.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ secs=Math.max(3,Math.min(900,secs+ +b.dataset.d)); render(); });
      const inp=wrap.querySelector('.settle-in');
      inp.onchange=()=>{ secs=Math.max(3,Math.min(900, parseInt(inp.value)||30)); render(); };
      wrap.querySelector('[data-start]').onclick=()=>{ SETTINGS.settleSecs=secs; saveSettings(); remaining=secs; state='run'; render(); startTick(); };
    } else {
      const orbCls = state==='done' ? 'settle-orb' : ('settle-orb run'+(state==='paused'?' paused':''));
      wrap.innerHTML=`
        <div class="settle-orb-area">
          <div class="${orbCls}"></div>
          <div class="settle-num">${state==='done'?'😌':fmt(remaining)}</div>
        </div>
        <div class="settle-cap" data-cap>${state==='done'?'All settled':'\u00a0'}</div>
        <div class="settle-controls">${
          state==='done'
            ? `<button class="btn primary" data-restart>↻ Again</button><button class="btn sm" data-new>New time</button>`
            : `<button class="btn sm" data-toggle>${state==='run'?'⏸ Pause':'▶ Resume'}</button><button class="btn sm" data-stop>■ Stop</button>`
        }</div>`;
      const tg=wrap.querySelector('[data-toggle]');
      if(tg) tg.onclick=()=>{ if(state==='run'){ state='paused'; clearTimers(); render(); } else { state='run'; render(); startTick(); } };
      const sp=wrap.querySelector('[data-stop]'); if(sp) sp.onclick=()=>{ clearTimers(); state='setup'; render(); };
      const ag=wrap.querySelector('[data-restart]'); if(ag) ag.onclick=()=>{ remaining=secs; state='run'; render(); startTick(); };
      const nw=wrap.querySelector('[data-new]'); if(nw) nw.onclick=()=>{ clearTimers(); state='setup'; render(); };
      if(state==='run') startCap(wrap);
    }
    body.appendChild(wrap);
  }
  render();
}


/* ============================================================
   APP: CORKBOARD  (draggable sticky notes — fun & visual)
   ============================================================ */
const CORK_COLORS=['#fff3a8','#ffc7da','#bfe1ff','#c9f0c4','#ffd6a5','#e3d4ff','#b8f2e6'];
function buildCork(body, win){
  body.style.padding='0';
  body.innerHTML=`
    <div class="cork-wrap">
      <div class="cork-toolbar">
        <button class="btn sm primary" data-add>＋ Add note</button>
        <span class="hint" style="flex:1">Drag the pin strip to move · tap the pin to recolour · type on the note</span>
        <button class="btn sm danger ghost" data-clear>Clear all</button>
      </div>
      <div class="cork-board" data-board><div class="cork-empty" data-empty>📌 Tap “＋ Add note” to pin one up.</div></div>
    </div>`;
  const board=body.querySelector('[data-board]');
  const save=()=>Store.set('cork',CORK);
  function makeNote(note){
    const el=document.createElement('div'); el.className='cork-note'; el.dataset.id=note.id;
    el.style.left=note.x+'px'; el.style.top=note.y+'px'; el.style.transform='rotate('+(note.rot||0)+'deg)';
    el.style.setProperty('--paper', note.color||CORK_COLORS[0]);
    el.innerHTML=`<div class="cork-grip"><span class="cork-pin" title="Change colour"></span><button class="cork-del" title="Remove note">✕</button></div>
      <textarea class="cork-text" placeholder="Write here…" spellcheck="false">${esc(note.text||'')}</textarea>`;
    const ta=el.querySelector('.cork-text');
    ta.oninput=e=>{ note.text=e.target.value; save(); };
    el.querySelector('.cork-pin').onclick=()=>{ const i=CORK_COLORS.indexOf(note.color); note.color=CORK_COLORS[(i+1)%CORK_COLORS.length]; el.style.setProperty('--paper',note.color); save(); };
    el.querySelector('.cork-del').onclick=()=>{ CORK=CORK.filter(n=>n.id!==note.id); el.remove(); save(); toggleEmpty(); };
    // pointer drag via the grip strip
    const grip=el.querySelector('.cork-grip');
    grip.addEventListener('pointerdown',e=>{
      if(e.target.closest('.cork-del'))return;
      e.preventDefault(); grip.setPointerCapture(e.pointerId);
      const sx=e.clientX, sy=e.clientY, ox=note.x, oy=note.y;
      el.classList.add('dragging'); board.appendChild(el);
      const move=ev=>{ const b=board.getBoundingClientRect();
        let nx=Math.max(0,Math.min(b.width-el.offsetWidth, ox+ev.clientX-sx));
        let ny=Math.max(0,Math.min(b.height-el.offsetHeight, oy+ev.clientY-sy));
        note.x=nx; note.y=ny; el.style.left=nx+'px'; el.style.top=ny+'px'; };
      const up=()=>{ grip.releasePointerCapture(e.pointerId); grip.removeEventListener('pointermove',move); grip.removeEventListener('pointerup',up); el.classList.remove('dragging'); save(); };
      grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up);
    });
    return el;
  }
  function toggleEmpty(){ const e=board.querySelector('[data-empty]'); if(e) e.style.display=CORK.length?'none':''; }
  function render(){
    [...board.querySelectorAll('.cork-note')].forEach(n=>n.remove());
    CORK.forEach(n=>board.appendChild(makeNote(n)));
    toggleEmpty();
  }
  body.querySelector('[data-add]').onclick=()=>{
    if(CORK.length>=40){ return; }
    const b=board.getBoundingClientRect(), n=CORK.length;
    const x=Math.max(10,Math.min((b.width||600)-180, 26+(n%6)*36));
    const y=Math.max(10,Math.min((b.height||400)-180, 26+(n%6)*28));
    const note={id:Date.now()+Math.floor(Math.random()*99), text:'', color:CORK_COLORS[n%CORK_COLORS.length], x, y, rot:(Math.random()*8-4)};
    CORK.push(note); save();
    const el=makeNote(note); board.appendChild(el); toggleEmpty();
    const ta=el.querySelector('.cork-text'); if(ta) ta.focus();
  };
  body.querySelector('[data-clear]').onclick=e=>{
    const btn=e.currentTarget;
    if(btn.dataset.armed){ CORK=[]; save(); render(); }
    else { btn.dataset.armed='1'; btn.textContent='Clear all?'; setTimeout(()=>{ if(btn){btn.textContent='Clear all'; delete btn.dataset.armed;} },2200); }
  };
  render();
}

/* ============================================================
   APP: SEATING CHART  (drag desks to arrange, drag names onto them)
   ============================================================ */
/* Pure seating solver — no DOM, so it's testable in isolation. Given desks with
   adjacency, the class list, the keep-apart (flagged) and keep-together (pairs)
   constraints, returns {assign, clash, split}. Random-restart: clashes cost 10,
   splits cost 1, so it will always break a preferred pair before it seats two
   flagged students together. */
/* Pure adjacency rule — SIDE BY SIDE counts, in front/behind does not. Exposed so
   the "behind shouldn't link" behaviour can be tested without the DOM. */
function seatsAdjacent(ax,ay,bx,by, sw, sh){
  const dx=Math.abs((ax+sw/2)-(bx+sw/2)), dy=Math.abs((ay+sh/2)-(by+sh/2));
  return dy <= sh*0.6 && dx <= sw*1.35;
}
/* Ranked-preference seating: each student nominates up to three others, ranked.
   Unlike mutual pairs, preferences are DIRECTIONAL and WEIGHTED — being next to
   your #1 is worth more than your #3. The solver maximises total satisfied
   weight while still keeping flagged (🚩) students apart (that's a hard penalty
   that outranks any preference). prefs = { "amy": ["ben","cy","di"], … }.
   Pure + exported so the weighting is testable. */
const PREF_WEIGHT = [0, 3, 2, 1];   // index = rank (1st→3, 2nd→2, 3rd→1)
// pairwise keep-apart lookup builder (shared by both seating solvers)
function apartChecker(apart){
  const S=new Set((apart||[]).map(p=>[p[0].toLowerCase(),p[1].toLowerCase()].sort().join('\u0000')));
  return (a,b)=>{ if(!a||!b) return false; return S.has([a.toLowerCase(),b.toLowerCase()].sort().join('\u0000')); };
}
function prefScore(assign, adj, prefs, apart){
  const areApart=apartChecker(apart);
  const at={}; assign.forEach((nm,i)=>{ if(nm) at[nm.toLowerCase()]=i; });
  let clash=0, satisfied=0, weight=0;
  // count only SPECIFIC keep-apart pairs that ended up adjacent
  for(let i=0;i<assign.length;i++){ for(const j of adj[i]) if(j>i && areApart(assign[i],assign[j])) clash++; }
  for(const [who, list] of Object.entries(prefs||{})){
    const i=at[who.toLowerCase()]; if(i==null || !Array.isArray(list)) continue;
    list.forEach((pick,idx)=>{ if(!pick) return; const j=at[pick.toLowerCase()];
      if(j!=null && adj[i].includes(j)){ satisfied++; weight += PREF_WEIGHT[idx+1]||1; } });
  }
  return { total: clash*100 - weight, clash, satisfied, weight };
}
function seatingByPreference(opts){
  const {n, adj, students, apart, prefs, restarts=800} = opts;
  const areApart=apartChecker(apart);
  // would placing `stu` on desk `di` sit them beside a specific keep-apart partner?
  const wouldClash=(stu,di,assign)=>adj[di].some(nj=>areApart(stu,assign[nj]));
  // does a student have ANY keep-apart partner? (seat these first, they're constrained)
  const constrained=new Set();
  (apart||[]).forEach(p=>{ constrained.add(p[0].toLowerCase()); constrained.add(p[1].toLowerCase()); });
  const isC=s=>constrained.has(s.toLowerCase());
  let best=null, bestScore={total:Infinity,clash:0,satisfied:0,weight:0};
  for(let attempt=0; attempt<restarts; attempt++){
    const order=students.slice().sort(()=>Math.random()-.5);
    const dord=[...Array(n).keys()].sort(()=>Math.random()-.5);
    const assign=new Array(n).fill('');
    // seat keep-apart students first, avoiding their partners, then everyone else
    const constrainedStu=order.filter(isC), rest=order.filter(s=>!isC(s));
    for(const stu of constrainedStu){
      let t=dord.find(di=>!assign[di] && !wouldClash(stu,di,assign));
      if(t==null) t=dord.find(di=>!assign[di]);
      if(t!=null) assign[t]=stu;
    }
    for(const stu of rest){
      const myPicks=(prefs[stu.toLowerCase()]||[]).map(p=>p&&p.toLowerCase());
      let placed=false;
      for(let rank=0; rank<myPicks.length && !placed; rank++){
        const pick=myPicks[rank]; if(!pick) continue;
        for(const di of dord){ if(assign[di]) continue;
          if(adj[di].some(nj=>assign[nj] && assign[nj].toLowerCase()===pick) && !wouldClash(stu,di,assign)){ assign[di]=stu; placed=true; break; } }
      }
      if(!placed) for(const di of dord){ if(assign[di]) continue;
        if(wouldClash(stu,di,assign)) continue; assign[di]=stu; placed=true; break; }
      if(!placed){ const di=dord.find(d=>!assign[d]); if(di!=null) assign[di]=stu; }
    }
    const sc=prefScore(assign, adj, prefs, apart);
    if(sc.total<bestScore.total){ bestScore=sc; best=assign.slice(); }
  }
  return { assign:best||new Array(n).fill(''), clash:bestScore.clash, satisfied:bestScore.satisfied, weight:bestScore.weight };
}

function seatingAutoAssign(opts){
  const {n, adj, students, apart, pairs, restarts=600} = opts;
  const areApart=apartChecker(apart);
  // students who appear in ANY keep-apart pair — seat these first (constrained)
  const constrained=new Set(); (apart||[]).forEach(p=>{ constrained.add(p[0].toLowerCase()); constrained.add(p[1].toLowerCase()); });
  const isC=nm=>!!nm && constrained.has(nm.toLowerCase());
  const wouldClash=(stu,di,assign)=>adj[di].some(nj=>areApart(stu,assign[nj]));
  const partners = nm => { if(!nm) return []; const l=nm.toLowerCase();
    return pairs.filter(p=>p[0].toLowerCase()===l||p[1].toLowerCase()===l).map(p=>p[0].toLowerCase()===l?p[1]:p[0]); };
  const score = assign => {
    let clash=0, split=0;
    // count only SPECIFIC keep-apart pairs sitting side by side
    for(let i=0;i<n;i++){ for(const j of adj[i]) if(j>i && areApart(assign[i],assign[j])) clash++; }
    const at={}; assign.forEach((nm,i)=>{ if(nm) at[nm.toLowerCase()]=i; });
    for(const [a,b] of pairs){ const ia=at[a.toLowerCase()], ib=at[b.toLowerCase()];
      if(ia==null||ib==null) continue; if(!adj[ia].includes(ib)) split++; }
    return {total:clash*10+split, clash, split};
  };
  let best=null, bestScore={total:Infinity,clash:0,split:0};
  for(let attempt=0; attempt<restarts && bestScore.total>0; attempt++){
    const order=students.slice().sort(()=>Math.random()-.5);
    const constrainedStu=order.filter(isC), normalStu=order.filter(s=>!isC(s));
    const assign=new Array(n).fill(''); const dord=[...Array(n).keys()].sort(()=>Math.random()-.5);
    const placed=new Set();
    for(const stu of constrainedStu){
      let t=-1;
      for(const di of dord){ if(assign[di])continue; if(!wouldClash(stu,di,assign)){ t=di; break; } }
      if(t<0) for(const di of dord){ if(!assign[di]){ t=di; break; } }
      if(t>=0){ assign[t]=stu; placed.add(stu.toLowerCase()); }
    }
    const place=stu=>{
      if(placed.has(stu.toLowerCase())) return;
      const mates=partners(stu).map(m=>m.toLowerCase());
      for(let di=0; di<n; di++){ if(assign[di]) continue;
        if(adj[di].some(nj=>assign[nj] && mates.includes(assign[nj].toLowerCase()))
            && !wouldClash(stu,di,assign)){ assign[di]=stu; placed.add(stu.toLowerCase()); return; } }
      for(const di of dord){ if(assign[di]) continue;
        if(wouldClash(stu,di,assign)) continue;
        assign[di]=stu; placed.add(stu.toLowerCase()); return; }
      for(const di of dord){ if(!assign[di]){ assign[di]=stu; placed.add(stu.toLowerCase()); return; } }
    };
    normalStu.filter(s=>partners(s).length).forEach(place);
    normalStu.filter(s=>!partners(s).length).forEach(place);
    const sc=score(assign);
    if(sc.total<bestScore.total){ bestScore=sc; best=assign.slice(); }
  }
  return {assign:best||new Array(n).fill(''), clash:bestScore.clash, split:bestScore.split};
}

function buildSeating(body, win){
  body.style.padding='0';
  body.innerHTML=`
    <div class="seat-wrap">
      <div class="seat-toolbar">
        <button class="btn sm primary" data-add>＋ Desk</button>
        <button class="btn sm" data-row>＋ Row</button>
        <button class="btn sm" data-fill>🎲 Auto-seat</button>
        <div class="seg sm" data-seatmode style="display:inline-flex">
          <button data-sm="links" class="on">🔗 Links</button><button data-sm="prefs">⭐ Preferences</button>
        </div>
        <button class="btn sm" data-pairs>🔗 Link / 🚩 separate</button>
        <button class="btn sm" data-prefs style="display:none">⭐ Set preferences</button>
        <button class="btn sm" data-empty>⟲ Empty all</button>
        <button class="btn sm" data-kid>🙈 Kid-friendly</button>
        <button class="btn sm danger ghost" data-clear>Clear desks</button>
      </div>
      <div class="seat-floor" data-floor>
        <div class="seat-front">⬛ FRONT / WHITEBOARD</div>
        <svg class="seat-links"></svg>
        <div class="seat-warn" data-warn style="display:none"></div>
        <div class="seat-hint" data-fhint>Add desks, then drag student names up onto them.</div>
      </div>
      <div class="seat-pool" data-pool></div>
    </div>`;
  const floor=body.querySelector('[data-floor]'), poolEl=body.querySelector('[data-pool]');
  const save=()=>Store.set('seating',SEATING);
  const SW=108, SH=60, ADJ_DIST=132;
  if(!SEATING.seats) SEATING.seats=[];
  if('flagged' in SEATING) delete SEATING.flagged;   // old flat list retired
  /* apartPairs = "keep apart", now the pairwise mirror of pairs = "keep together".
     Both are name tuples [[a,b],…], deduped and order-insensitive. */
  if(!Array.isArray(SEATING.apartPairs)) SEATING.apartPairs=[];
  if(!Array.isArray(SEATING.pairs)) SEATING.pairs=[];
  /* prefs = ranked nominations { student: [1st,2nd,3rd] }. Separate system from
     pairs; used only in Preferences mode. Flagging applies in both modes. */
  if(!SEATING.prefs || typeof SEATING.prefs!=='object' || Array.isArray(SEATING.prefs)) SEATING.prefs={};
  let seatMode = SETTINGS.seatMode==='prefs' ? 'prefs' : 'links';
  const isFlagged=n=>isFlaggedAny(n);   // in ANY keep-apart pair (for the badge)
  const apartKey=(a,b)=>[a,b].map(x=>x.toLowerCase()).sort().join('\u0000');
  function areApartSeat(a,b){ if(!a||!b) return false; const k=apartKey(a,b);
    return SEATING.apartPairs.some(p=>apartKey(p[0],p[1])===k); }
  function apartMatesOf(n){ if(!n) return []; const l=n.toLowerCase();
    return SEATING.apartPairs.filter(p=>p[0].toLowerCase()===l||p[1].toLowerCase()===l)
      .map(p=>p[0].toLowerCase()===l?p[1]:p[0]); }
  function apartPair(a,b){ if(!a||!b||a===b||areApartSeat(a,b)) return; SEATING.apartPairs.push([a,b]); save(); render(); }
  function unApartPair(a,b){ const k=apartKey(a,b); SEATING.apartPairs=SEATING.apartPairs.filter(p=>apartKey(p[0],p[1])!==k); save(); render(); }
  function pruneApart(){
    const has=new Set(STUDENTS.map(s=>s.toLowerCase())); const before=SEATING.apartPairs.length;
    SEATING.apartPairs=SEATING.apartPairs.filter(p=>has.has(p[0].toLowerCase())&&has.has(p[1].toLowerCase()));
    if(SEATING.apartPairs.length!==before) save();
  }
  // --- pairing helpers ---
  const pairKey=(a,b)=>[a,b].map(x=>x.toLowerCase()).sort().join('\u0000');
  function arePaired(a,b){ if(!a||!b) return false; const k=pairKey(a,b); return SEATING.pairs.some(p=>pairKey(p[0],p[1])===k); }
  function partnersOf(n){ if(!n) return []; const l=n.toLowerCase();
    return SEATING.pairs.filter(p=>p[0].toLowerCase()===l||p[1].toLowerCase()===l)
      .map(p=>p[0].toLowerCase()===l?p[1]:p[0]); }
  function linkPair(a,b){ if(!a||!b||a===b||arePaired(a,b)) return; SEATING.pairs.push([a,b]); save(); render(); }
  function unlinkPair(a,b){ const k=pairKey(a,b); SEATING.pairs=SEATING.pairs.filter(p=>pairKey(p[0],p[1])!==k); save(); render(); }
  // drop pairs referring to names no longer in the class list, so a deleted
  // student can't leave a dangling link that the optimiser chases forever
  function prunePairs(){
    const has=new Set(STUDENTS.map(s=>s.toLowerCase()));
    const before=SEATING.pairs.length;
    SEATING.pairs=SEATING.pairs.filter(p=>has.has(p[0].toLowerCase())&&has.has(p[1].toLowerCase()));
    if(SEATING.pairs.length!==before) save();
  }
  prunePairs();
  pruneApart();
  // also drop preferences pointing at names no longer in the class
  function prunePrefs(){
    const has=new Set(STUDENTS.map(s=>s.toLowerCase())); let changed=false;
    for(const who of Object.keys(SEATING.prefs)){
      if(!has.has(who)){ delete SEATING.prefs[who]; changed=true; continue; }
      const cleaned=(SEATING.prefs[who]||[]).map(p=>p&&has.has(p.toLowerCase())?p:'');
      if(cleaned.some(Boolean)) SEATING.prefs[who]=cleaned; else { delete SEATING.prefs[who]; }
      changed=true;
    }
    if(changed) save();
  }
  prunePrefs();

  const kidMode=()=>!!SETTINGS.seatKidMode;   // hides flags from the room; logic still applies

  /* ---- lasso multi-select + group move ----
     Drag on empty floor to rubber-band a selection; drag any selected desk to
     move the whole group together. Selection is transient (not persisted). */
  let selected=new Set();   // seat ids
  function isSel(id){ return selected.has(id); }
  function clearSel(){ if(!selected.size) return; selected.clear(); paintSel(); }
  function paintSel(){ floor.querySelectorAll('.seat').forEach(el=>el.classList.toggle('sel', selected.has(+el.dataset.id))); }
  function lassoStart(e){
    // only when starting on bare floor (not a seat/handle) with the primary button
    if(e.button!==0) return;
    if(e.target.closest('.seat')) return;
    const b=floor.getBoundingClientRect();
    const x0=e.clientX-b.left, y0=e.clientY-b.top;
    if(!e.shiftKey) clearSel();          // shift-drag adds to the selection
    const box=document.createElement('div'); box.className='seat-lasso'; floor.appendChild(box);
    const base=new Set(selected);
    const draw=ev=>{
      const x1=ev.clientX-b.left, y1=ev.clientY-b.top;
      const l=Math.min(x0,x1), t=Math.min(y0,y1), w=Math.abs(x1-x0), h=Math.abs(y1-y0);
      box.style.left=l+'px'; box.style.top=t+'px'; box.style.width=w+'px'; box.style.height=h+'px';
      selected=new Set(base);
      SEATING.seats.forEach(s=>{ // seat overlaps the lasso rect?
        if(s.x< l+w && s.x+SW> l && s.y< t+h && s.y+SH> t) selected.add(s.id);
      });
      paintSel();
    };
    const stop=()=>{ document.removeEventListener('pointermove',draw); document.removeEventListener('pointerup',stop); box.remove();
      updateSelBar(); };
    document.addEventListener('pointermove',draw); document.addEventListener('pointerup',stop);
  }
  floor.addEventListener('pointerdown', lassoStart);

  // small floating bar shown while seats are selected
  function updateSelBar(){
    let bar=floor.querySelector('.seat-selbar');
    if(!selected.size){ if(bar) bar.remove(); return; }
    if(!bar){ bar=document.createElement('div'); bar.className='seat-selbar'; floor.appendChild(bar); }
    bar.innerHTML=`<b>${selected.size}</b> selected · drag any selected desk to move them together · <button data-seldel>delete</button> · <button data-selclear>clear</button>`;
    bar.querySelector('[data-selclear]').onclick=()=>{ clearSel(); updateSelBar(); };
    bar.querySelector('[data-seldel]').onclick=()=>{ SEATING.seats=SEATING.seats.filter(s=>!selected.has(s.id)); selected.clear(); save(); render(); };
  }


  function makeSeat(seat){
    const flagged=isFlagged(seat.student);
    const kids=kidMode();
    const el=document.createElement('div');
    el.className='seat'+(seat.student?' filled':'')+((flagged&&!kids)?' flagged':'');
    el.dataset.id=seat.id;
    el.style.left=seat.x+'px'; el.style.top=seat.y+'px';
    el.innerHTML=`${(seat.student&&!kids)?`<button class="seat-flag${flagged?' on':''}" title="${flagFrom===seat.student?'Click another name to keep apart — or click again to cancel':'Keep apart from another student'}">🚩</button>`:''}
      ${seat.student?'<span class="seat-grip" title="Drag the desk">⠿</span>':''}
      <span class="seat-name">${seat.student?esc(seat.student):'<span class="seat-empty">empty</span>'}</span>
      <button class="seat-x" title="${seat.student?'Remove '+esc(seat.student)+' from this desk':'Delete this desk'}">✕</button>`;
    el.querySelector('.seat-x').onclick=ev=>{ ev.stopPropagation();
      if(seat.student){ seat.student=''; } else { SEATING.seats=SEATING.seats.filter(s=>s.id!==seat.id); }
      save(); render(); };
    const fb=el.querySelector('.seat-flag');
    if(fb){ fb.addEventListener('pointerdown',ev=>ev.stopPropagation()); fb.onclick=ev=>{ ev.stopPropagation();
      const name=seat.student; linkFrom=null;
      if(flagFrom===name){ flagFrom=null; render(); }
      else if(flagFrom){ const a=flagFrom; flagFrom=null; apartPair(a,name); }
      else { flagFrom=name; render(); }
    }; }

    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('.seat-x')||e.target.closest('.seat-flag')) return;
      e.preventDefault();
      // An occupied desk has two gestures:
      //   grip (⠿) or empty desk -> move the DESK
      //   the name itself         -> pick the STUDENT up and move/remove them
      const moveDesk = !seat.student || !!e.target.closest('.seat-grip');
      if(moveDesk) return dragDesk(e, seat, el);
      dragStudent(e, seat, el);
    });
    return el;
  }

  /* move the desk around the floor — or the whole selection, if this desk is part of it */
  function dragDesk(e, seat, el){
    el.setPointerCapture(e.pointerId);
    const sx=e.clientX, sy=e.clientY;
    // if this desk is in the current selection, move the whole group; else just it
    const groupIds = (selected.size && selected.has(seat.id)) ? [...selected] : [seat.id];
    const group = groupIds.map(id=>{ const s=SEATING.seats.find(z=>z.id===id); const gel=floor.querySelector('.seat[data-id="'+id+'"]');
      return s&&gel?{s,el:gel,ox:s.x,oy:s.y}:null; }).filter(Boolean);
    group.forEach(g=>{ g.el.classList.add('dragging'); });
    const move=ev=>{ const b=floor.getBoundingClientRect();
      let dx=ev.clientX-sx, dy=ev.clientY-sy;
      // clamp the whole group so none leaves the floor
      const maxX=b.width-SW, maxY=b.height-SH;
      let minDX=-Infinity,maxDX=Infinity,minDY=-Infinity,maxDY=Infinity;
      group.forEach(g=>{ minDX=Math.max(minDX,-g.ox); maxDX=Math.min(maxDX,maxX-g.ox);
        minDY=Math.max(minDY,-g.oy); maxDY=Math.min(maxDY,maxY-g.oy); });
      dx=Math.max(minDX,Math.min(maxDX,dx)); dy=Math.max(minDY,Math.min(maxDY,dy));
      group.forEach(g=>{ g.s.x=g.ox+dx; g.s.y=g.oy+dy; g.el.style.left=g.s.x+'px'; g.el.style.top=g.s.y+'px'; });
      updateClashes(); };
    const up=()=>{ try{el.releasePointerCapture(e.pointerId);}catch(_){}
      el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
      group.forEach(g=>g.el.classList.remove('dragging')); save(); };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
  }

  /* lift the STUDENT off the desk — drop on another desk to swap/move,
     or drop anywhere off the floor to send them back to the list */
  function dragStudent(e, seat, el){
    const name=seat.student; if(!name) return;
    const ghost=document.createElement('div'); ghost.className='seat-ghost'; ghost.textContent=name;
    document.body.appendChild(ghost);
    const place=(x,y)=>{ ghost.style.left=x+'px'; ghost.style.top=y+'px'; };
    place(e.clientX,e.clientY);
    el.classList.add('lifting');
    poolEl.classList.add('drop-live');
    const move=ev=>{ place(ev.clientX,ev.clientY);
      const t=document.elementFromPoint(ev.clientX,ev.clientY);
      floor.querySelectorAll('.seat.over').forEach(s=>s.classList.remove('over'));
      const overSeat=t&&t.closest&&t.closest('.seat');
      if(overSeat&&floor.contains(overSeat)&&overSeat!==el) overSeat.classList.add('over');
      const overPool=t&&t.closest&&t.closest('.seat-pool');
      poolEl.classList.toggle('drop-hot', !!overPool);
    };
    const up=ev=>{
      document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      ghost.remove(); el.classList.remove('lifting');
      poolEl.classList.remove('drop-live','drop-hot');
      floor.querySelectorAll('.seat.over').forEach(s=>s.classList.remove('over'));
      const t=document.elementFromPoint(ev.clientX,ev.clientY);
      const overSeat=t&&t.closest&&t.closest('.seat');
      if(overSeat&&floor.contains(overSeat)&&overSeat!==el){
        const target=SEATING.seats.find(s=>s.id===+overSeat.dataset.id);
        if(target){ const swap=target.student; target.student=name; seat.student=swap||''; save(); render(); return; }
      }
      // dropped on the name list, or anywhere outside the floor → unseat
      const onFloor = t && floor.contains(t);
      if(!onFloor){ seat.student=''; save(); render(); return; }
      render();   // dropped back on itself / empty floor → no change
    };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  }
  let linkFrom=null;   // name awaiting a LINK partner, or null
  let flagFrom=null;   // name awaiting a KEEP-APART partner, or null
  function makeChip(name){
    const flagged=isFlagged(name), kids=kidMode();
    const mates=partnersOf(name);
    const foes=apartMatesOf(name);
    const linking = linkFrom===name, flagging = flagFrom===name;
    const chip=document.createElement('div');
    chip.className='seat-chip'+((flagged&&!kids)?' flagged':'')+(mates.length?' paired':'')+(linking?' linking':'')+(flagging?' flagging':'');
    chip.innerHTML=(kids?'':`<button class="chip-flag${flagged?' on':''}" title="${flagging?'Click another name to keep them apart — or click again to cancel':'Keep apart from another student (click, then click them)'}">🚩${(foes.length&&!flagging)?`<span class="chip-foenum">${foes.length}</span>`:''}</button>`)
      +`<span class="chip-name">${esc(name)}</span>`
      +(mates.length&&!kids?`<span class="chip-mates" title="Sits with: ${esc(mates.join(', '))}">🔗${mates.length>1?mates.length:''}</span>`:'')
      +(kids?'':`<button class="chip-link${linking?' on':''}" title="${linking?'Click another name to link — or click again to cancel':'Link with another student (they sit together)'}">🔗</button>`);
    const fb=chip.querySelector('.chip-flag');
    if(fb){ fb.addEventListener('pointerdown',e=>e.stopPropagation());
      fb.onclick=e=>{ e.stopPropagation();
        linkFrom=null;
        if(flagFrom===name){ flagFrom=null; render(); }              // toggle off
        else if(flagFrom){ const a=flagFrom; flagFrom=null; apartPair(a,name); }  // complete a keep-apart pair
        else { flagFrom=name; render(); }                            // arm
      }; }
    const lb=chip.querySelector('.chip-link');
    if(lb){ lb.addEventListener('pointerdown',e=>e.stopPropagation());
      lb.onclick=e=>{ e.stopPropagation();
        if(linkFrom===name){ linkFrom=null; render(); }         // toggle off
        else if(linkFrom){ const a=linkFrom; linkFrom=null; linkPair(a,name); }  // complete a link
        else { linkFrom=name; flagFrom=null; render(); }       // arm
      }; }
    // clicking the mates badge unlinks (with a confirm if there are several)
    const mb=chip.querySelector('.chip-mates');
    if(mb){ mb.addEventListener('pointerdown',e=>e.stopPropagation());
      mb.onclick=e=>{ e.stopPropagation();
        if(mates.length===1){ unlinkPair(name, mates[0]); }
        else { const who=prompt(`${name} sits with: ${mates.join(', ')}\n\nType a name to unlink, or Cancel:`);
          if(who){ const m=mates.find(x=>x.toLowerCase()===who.trim().toLowerCase()); if(m) unlinkPair(name,m); } }
      }; }
    chip.addEventListener('pointerdown',e=>{
      if(e.target.closest('.chip-flag')||e.target.closest('.chip-link')||e.target.closest('.chip-mates'))return;
      // in link mode, a plain click on another chip completes the link instead of dragging
      if(linkFrom && linkFrom!==name){ e.preventDefault(); const a=linkFrom; linkFrom=null; linkPair(a,name); return; }
      if(linkFrom===name){ e.preventDefault(); return; }
      e.preventDefault();
      const ghost=document.createElement('div'); ghost.className='seat-ghost'; ghost.textContent=name; document.body.appendChild(ghost);
      chip.classList.add('lifting');
      const place=(x,y)=>{ ghost.style.left=x+'px'; ghost.style.top=y+'px'; };
      place(e.clientX,e.clientY);
      const move=ev=>{ place(ev.clientX,ev.clientY);
        const el=document.elementFromPoint(ev.clientX,ev.clientY); const seat=el&&el.closest&&el.closest('.seat');
        floor.querySelectorAll('.seat.over').forEach(s=>s.classList.remove('over'));
        if(seat&&floor.contains(seat)) seat.classList.add('over'); };
      const up=ev=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
        const el=document.elementFromPoint(ev.clientX,ev.clientY); const seat=el&&el.closest&&el.closest('.seat');
        ghost.remove(); chip.classList.remove('lifting'); floor.querySelectorAll('.seat.over').forEach(s=>s.classList.remove('over'));
        if(seat&&floor.contains(seat)){ const t=SEATING.seats.find(s=>s.id===+seat.dataset.id);
          if(t){
            // if that desk is taken, send the sitting student back to the list rather than
            // silently overwriting them
            t.student=name; save(); render();
          } } };
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
    return chip;
  }
  // ----- adjacency + clash detection -----
  function buildAdj(seats){
    // "adjacent" = SIDE BY SIDE, not in front/behind (see seatsAdjacent). A desk
    // directly behind has a big vertical gap, so it no longer links.
    return seats.map((_,i)=>seats.map((_,j)=>j).filter(j=>
      j!==i && seatsAdjacent(seats[i].x,seats[i].y,seats[j].x,seats[j].y,SW,SH)));
  }
  function clashPairs(){
    const seats=SEATING.seats, adj=buildAdj(seats), out=[];
    // a clash is a SPECIFIC keep-apart pair sitting side by side — not just any
    // two flagged students near each other
    for(let i=0;i<seats.length;i++){
      for(const j of adj[i]){ if(j>i && areApartSeat(seats[i].student, seats[j].student)) out.push([i,j]); } }
    return out;
  }
  /* Paired students who are BOTH seated but NOT next to each other. This is the
     "we tried to keep them together and couldn't" list — surfaced, never silent. */
  function splitPairs(){
    const seats=SEATING.seats, adj=buildAdj(seats), out=[];
    const seatOf={}; seats.forEach((s,i)=>{ if(s.student) seatOf[s.student.toLowerCase()]=i; });
    for(const [a,b] of SEATING.pairs){
      const ia=seatOf[a.toLowerCase()], ib=seatOf[b.toLowerCase()];
      if(ia==null||ib==null) continue;                 // one of them isn't seated — not a failure
      if(!adj[ia].includes(ib)) out.push([ia,ib]);
    }
    return out;
  }
  function updateClashes(){
    const pairs=clashPairs();          // always computed — auto-seat and the teacher's
    const kids=kidMode();              // toolbar count rely on it, even when hidden
    const splits=splitPairs();
    const bad=new Set();
    if(!kids) pairs.forEach(([i,j])=>{ bad.add(SEATING.seats[i].id); bad.add(SEATING.seats[j].id); });
    const linked=new Set();            // seat ids of satisfied (adjacent) pairs
    const svg=floor.querySelector('.seat-links');
    if(svg){
      // bold green "kept together" links + dot endpoints for satisfied pairs;
      // red dashed for clashes. Both hidden in kid-friendly view, like the flags.
      let html='';
      if(!kids){
        const adj=buildAdj(SEATING.seats), seatOf={};
        SEATING.seats.forEach((s,i)=>{ if(s.student) seatOf[s.student.toLowerCase()]=i; });
        for(const [a,b] of SEATING.pairs){
          const ia=seatOf[a.toLowerCase()], ib=seatOf[b.toLowerCase()];
          if(ia==null||ib==null||!adj[ia].includes(ib)) continue;
          const p=SEATING.seats[ia], q=SEATING.seats[ib];
          const x1=p.x+SW/2, y1=p.y+SH/2, x2=q.x+SW/2, y2=q.y+SH/2;
          html+=`<line class="link-keep" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`
              + `<circle class="link-dot" cx="${x1}" cy="${y1}" r="6"/>`
              + `<circle class="link-dot" cx="${x2}" cy="${y2}" r="6"/>`;
          linked.add(p.id); linked.add(q.id);
        }
        html+=pairs.map(([i,j])=>{ const a=SEATING.seats[i],b=SEATING.seats[j];
          return `<line x1="${a.x+SW/2}" y1="${a.y+SH/2}" x2="${b.x+SW/2}" y2="${b.y+SH/2}"/>`; }).join('');
      }
      svg.innerHTML=html;
    }
    // apply seat treatments: clash (red) takes precedence over linked (green)
    floor.querySelectorAll('.seat').forEach(el=>{
      const id=+el.dataset.id;
      const isClash=bad.has(id);
      el.classList.toggle('clash', isClash);
      el.classList.toggle('linked', !isClash && linked.has(id));
    });
    const warn=floor.querySelector('[data-warn]');
    if(warn){
      const msgs=[];
      if(pairs.length && !kids) msgs.push(`⚠ ${pairs.length} identified pair${pairs.length>1?'s':''} seated together`);
      if(splits.length && !kids) msgs.push(`💛 ${splits.length} preferred pair${splits.length>1?'s':''} couldn't sit together`);
      if(msgs.length){ warn.style.display=''; warn.innerHTML=msgs.join(' &nbsp;·&nbsp; '); }
      else warn.style.display='none';
    }
    // quiet, teacher-only signal that stays available even with the room watching
    const kb=body.querySelector('[data-kid]');
    if(kb) kb.classList.toggle('has-clash', kids && pairs.length>0);
    if(kb) kb.title = kids
      ? (pairs.length ? `Kid-friendly view ON — ${pairs.length} flagged pair${pairs.length>1?'s':''} still seated together (only you can see this)` : 'Kid-friendly view ON — flags hidden from the room')
      : 'Hide the 🚩 flags from the room (they still work)';
    return pairs;
  }
  function render(){
    [...floor.querySelectorAll('.seat')].forEach(s=>s.remove());
    SEATING.seats.forEach(s=>floor.appendChild(makeSeat(s)));
    // drop selection ids for seats that no longer exist, then re-paint
    const ids=new Set(SEATING.seats.map(s=>s.id));
    [...selected].forEach(id=>{ if(!ids.has(id)) selected.delete(id); });
    paintSel(); updateSelBar();
    const fh=floor.querySelector('[data-fhint]'); if(fh) fh.style.display=SEATING.seats.length?'none':'';
    updateClashes();
    const seated=new Set(SEATING.seats.map(s=>s.student).filter(Boolean));
    const pool=STUDENTS.filter(n=>!seated.has(n));
    poolEl.innerHTML='';
    if(!STUDENTS.length){ poolEl.innerHTML='<div class="seat-poolhint">Add a class list (📋 Students or Settings ⚙️) to seat children.</div>'; return; }
    const apartN=SEATING.apartPairs.length;
    const lab=document.createElement('div'); lab.className='seat-poollab';
    const seatedN=SEATING.seats.filter(s=>s.student).length;
    if(flagFrom && !kidMode()){
      lab.innerHTML=`🚩 <b>Keeping ${esc(flagFrom)} apart</b> — click another name they shouldn't sit beside, or click 🚩 again to cancel.`;
    } else if(linkFrom && !kidMode()){
      lab.innerHTML=`🔗 <b>Linking ${esc(linkFrom)}</b> — click another name to sit them together, or click 🔗 again to cancel.`;
    } else {
      lab.innerHTML = (pool.length?`Drag a name onto a desk · ${pool.length} unseated`:'🎉 Everyone is seated')
        + (seatedN?` <span class="seat-poolhelp">· drag a seated name off to remove, or onto another desk to swap</span>`:'')
        + ((apartN && !kidMode())?` · <span class="seat-flagcount">🚩 ${apartN} kept apart</span>`:'')
        + ((SEATING.pairs.length && !kidMode())?` · <span class="seat-pairvcount">🔗 ${SEATING.pairs.length} linked</span>`:'');
    }
    poolEl.appendChild(lab);
    const chips=document.createElement('div'); chips.className='seat-chips';
    pool.forEach(n=>chips.appendChild(makeChip(n)));
    poolEl.appendChild(chips);
  }
  function addSeat(x,y){
    const b=floor.getBoundingClientRect(), n=SEATING.seats.length;
    const px=(x!=null)?x:Math.max(8,Math.min((b.width||600)-120, 24+(n%6)*120));
    const py=(y!=null)?y:Math.max(40,Math.min((b.height||400)-72, 56+Math.floor(n/6)*92));
    SEATING.seats.push({id:Date.now()+Math.floor(Math.random()*999)+n, x:px, y:py, student:''});
  }
  body.querySelector('[data-add]').onclick=()=>{ addSeat(); save(); render(); };
  body.querySelector('[data-row]').onclick=()=>{
    const b=floor.getBoundingClientRect();
    const band = SEATING.seats.length ? Math.max(...SEATING.seats.map(s=>s.y)) + 92 : 56;
    const y=Math.max(40,Math.min((b.height||400)-72, band));
    for(let i=0;i<5;i++){ SEATING.seats.push({id:Date.now()+i+Math.floor(Math.random()*999), x:24+i*120, y, student:''}); }
    save(); render();
  };
  // adjacency-aware auto-seat: branches on mode. Both keep 🚩 students apart.
  body.querySelector('[data-fill]').onclick=()=>{
    const seats=SEATING.seats, n=seats.length; if(!n) return;
    const adj=buildAdj(seats);
    if(seatMode==='prefs'){
      const {assign, satisfied, weight} = seatingByPreference({
        n, adj, students:STUDENTS, apart:SEATING.apartPairs, prefs:SEATING.prefs });
      seats.forEach((s,di)=>{ s.student=assign[di]||''; });
      save(); render();
      const total=Object.values(SEATING.prefs).reduce((a,l)=>a+(Array.isArray(l)?l.filter(Boolean).length:0),0);
      flash(total? `Seated by preference — ${satisfied}/${total} nominations placed side by side` : 'Seated (no preferences set yet — add some with ⭐)');
      return;
    }
    const {assign, split} = seatingAutoAssign({
      n, adj, students:STUDENTS, apart:SEATING.apartPairs, pairs:SEATING.pairs });
    seats.forEach((s,di)=>{ s.student=assign[di]||''; });
    save(); render();
    if(split>0) flash(`Seated — ${split} preferred pair${split>1?'s':''} couldn't fit together`);
    else if(SEATING.pairs.length) flash('Seated — all preferred pairs kept together');
  };
  // mode toggle — Links vs ranked Preferences. Swaps which management button shows.
  function applySeatMode(){
    body.querySelectorAll('[data-seatmode] button').forEach(b=>b.classList.toggle('on', b.dataset.sm===seatMode));
    body.querySelector('[data-pairs]').style.display = seatMode==='links'?'':'none';
    body.querySelector('[data-prefs]').style.display = seatMode==='prefs'?'':'none';
  }
  body.querySelectorAll('[data-seatmode] button').forEach(b=>b.onclick=()=>{
    seatMode=b.dataset.sm; SETTINGS.seatMode=seatMode; saveSettings(); applySeatMode(); render();
  });
  body.querySelector('[data-prefs]').onclick=()=>openPrefsManager();
  applySeatMode();
  body.querySelector('[data-empty]').onclick=()=>{ SEATING.seats.forEach(s=>s.student=''); save(); render(); };
  body.querySelector('[data-pairs]').onclick=()=>openPairsManager();

  /* Ranked-preference editor. Each student picks up to three classmates, ranked.
     Flagging (🚩 keep-apart) still applies and is shown here too. */
  function openPrefsManager(){
    const ov=document.createElement('div'); ov.className='modal-overlay';
    ov.innerHTML=`<div class="modal" style="width:min(620px,96vw)">
      <div class="modal-head">⭐ Seating preferences <span class="muted" style="font-weight:700;margin-left:auto;font-size:12px">who each student would like to sit near</span></div>
      <div class="modal-body">
        <div class="hint" style="margin-bottom:10px">Each child can nominate up to three classmates, ranked. <b>1st</b> choice pulls hardest, then 2nd, then 3rd. Auto-seat (in ⭐ Preferences mode) tries to place people beside their higher picks. 🚩 keep-apart still wins over any preference.</div>
        <div class="pref-list" data-preflist></div>
      </div>
      <div class="modal-foot"><button class="btn ghost sm" data-close>Done</button></div>
    </div>`;
    document.body.appendChild(ov);
    const list=ov.querySelector('[data-preflist]');
    function optionsFor(self, chosen){
      return '<option value="">—</option>'+STUDENTS.filter(s=>s!==self)
        .map(s=>`<option value="${esc(s)}"${chosen===s?' selected':''}>${esc(s)}</option>`).join('');
    }
    function draw(){
      list.innerHTML='';
      if(!STUDENTS.length){ list.innerHTML='<div class="empty">Add a class list first.</div>'; return; }
      STUDENTS.forEach(name=>{
        const picks=SEATING.prefs[name.toLowerCase()]||[];
        const flagged=isFlagged(name);
        const row=document.createElement('div'); row.className='pref-row';
        row.innerHTML=`<div class="pref-name">${esc(name)}${flagged?' <span class="pref-flag">🚩</span>':''}</div>
          <select class="field sm" data-r="0">${optionsFor(name,picks[0]||'')}</select>
          <select class="field sm" data-r="1">${optionsFor(name,picks[1]||'')}</select>
          <select class="field sm" data-r="2">${optionsFor(name,picks[2]||'')}</select>`;
        row.querySelectorAll('select').forEach(sel=>sel.onchange=()=>{
          const arr=[0,1,2].map(i=>row.querySelector(`[data-r="${i}"]`).value);
          // dedupe: a child can't pick the same person twice
          const seen=new Set(); const clean=arr.map(v=>{ const k=v.toLowerCase(); if(!v||seen.has(k))return''; seen.add(k); return v; });
          if(clean.some(Boolean)) SEATING.prefs[name.toLowerCase()]=clean; else delete SEATING.prefs[name.toLowerCase()];
          save();
          // reflect dedupe back into the selects
          [0,1,2].forEach(i=>{ row.querySelector(`[data-r="${i}"]`).value=clean[i]||''; });
        });
        list.appendChild(row);
      });
    }
    draw();
    ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ ov.remove(); render(); });
    ov.addEventListener('mousedown',e=>{ if(e.target===ov){ ov.remove(); render(); } });
  }
  /* The always-available home for links and flags. The per-chip 🔗/🚩 buttons only
     appear on UNSEATED names in the pool, so once a class is fully seated there's
     nowhere to manage them — this modal lists the whole class either way. */
  function openPairsManager(){
    const ov=document.createElement('div'); ov.className='modal-overlay';
    ov.innerHTML=`<div class="modal" style="width:min(560px,95vw)">
      <div class="modal-head">🔗 Link & 🚩 separate students <span class="muted" style="font-weight:700;margin-left:auto;font-size:12px">who sits together — and who doesn't</span></div>
      <div class="modal-body">
        <div class="hint" style="margin-bottom:10px">🔗 <b>Link</b> two names to seat them side by side. 🚩 <b>Separate</b> two names to keep them apart. Both work in pairs — pick one, then pick the other.</div>
        <div class="pm-pick" data-pick></div>
        <div data-list></div>
      </div>
      <div class="modal-foot"><span style="flex:1"></span><button class="btn primary" data-close>Done</button></div>
    </div>`;
    document.body.appendChild(ov);
    let pick=null;       // first name in the LINK flow
    let apartPick=null;  // first name in the SEPARATE flow
    const pickEl=ov.querySelector('[data-pick]'), listEl=ov.querySelector('[data-list]');
    function draw(){
      pickEl.innerHTML = pick
        ? `<div class="pm-arming">🔗 Linking <b>${esc(pick)}</b> with… <button class="btn sm ghost" data-cancel>cancel</button></div>`
        : apartPick
        ? `<div class="pm-arming">🚩 Keeping <b>${esc(apartPick)}</b> apart from… <button class="btn sm ghost" data-cancel>cancel</button></div>`
        : `<div class="pm-arming muted">🔗 <b>+ Link</b> or 🚩 to pair students together / apart.</div>`;
      const c=pickEl.querySelector('[data-cancel]'); if(c) c.onclick=()=>{ pick=null; apartPick=null; draw(); };
      listEl.innerHTML='';
      if(!STUDENTS.length){ listEl.innerHTML='<div class="hint">No class list yet.</div>'; return; }
      STUDENTS.forEach(name=>{
        const mates=partnersOf(name), foes=apartMatesOf(name);
        const flagArmed = apartPick===name;
        const row=document.createElement('div'); row.className='pm-row'+(pick===name?' arming':'')+(flagArmed?' arming-apart':'');
        row.innerHTML=`
          <button class="pm-flag${foes.length?' on':''}" title="Keep ${esc(name)} apart from another student">🚩${foes.length?`<span class="pm-foenum">${foes.length}</span>`:''}</button>
          <span class="pm-name">${esc(name)}</span>
          <span class="pm-mates">${mates.map(m=>`<span class="pm-mate" data-mate="${esc(m)}" title="Click to unlink">🔗 ${esc(m)} ✕</span>`).join('')}${foes.map(f=>`<span class="pm-foe" data-foe="${esc(f)}" title="Click to allow again">🚩 ${esc(f)} ✕</span>`).join('')}</span>
          <button class="pm-link" title="Link ${esc(name)} with another student">${pick===name?'…':'＋ Link'}</button>`;
        // 🚩 = pairwise separate flow (mirrors the link flow)
        row.querySelector('.pm-flag').onclick=()=>{
          pick=null;
          if(apartPick===name){ apartPick=null; }
          else if(apartPick){ apartPair(apartPick, name); apartPick=null; }
          else { apartPick=name; }
          draw();
        };
        row.querySelector('.pm-link').onclick=()=>{
          apartPick=null;
          if(pick===name){ pick=null; }
          else if(pick){ linkPair(pick, name); pick=null; }
          else { pick=name; }
          draw();
        };
        row.querySelectorAll('.pm-mate').forEach(m=>m.onclick=()=>{ unlinkPair(name, m.dataset.mate); draw(); });
        row.querySelectorAll('.pm-foe').forEach(f=>f.onclick=()=>{ unApartPair(name, f.dataset.foe); draw(); });
        // clicking a row while arming completes the current pairing
        row.onclick=e=>{ if(e.target.closest('button')||e.target.closest('.pm-mate')||e.target.closest('.pm-foe'))return;
          if(pick && pick!==name){ linkPair(pick,name); pick=null; draw(); }
          else if(apartPick && apartPick!==name){ apartPair(apartPick,name); apartPick=null; draw(); } };
        listEl.appendChild(row);
      });
    }
    ov.querySelector('[data-close]').onclick=()=>{ ov.remove(); render(); };
    ov.addEventListener('mousedown',e=>{ if(e.target===ov){ ov.remove(); render(); } });
    draw();
  }
  const kidBtn=body.querySelector('[data-kid]');
  function paintKid(){ kidBtn.classList.toggle('on', kidMode());
    kidBtn.textContent = kidMode() ? '🙈 Flags hidden' : '🙈 Kid-friendly'; }
  kidBtn.onclick=()=>{ SETTINGS.seatKidMode=!SETTINGS.seatKidMode; saveSettings(); paintKid(); render(); };
  paintKid();
  body.querySelector('[data-clear]').onclick=e=>{
    const btn=e.currentTarget;
    if(btn.dataset.armed){ SEATING.seats=[]; save(); render(); }
    else { btn.dataset.armed='1'; btn.textContent='Clear desks?'; setTimeout(()=>{ if(btn){btn.textContent='Clear desks'; delete btn.dataset.armed;} },2200); }
  };
  render();
}

/* ============================================================
   SHARE / TRANSFER SETUP  (export & import a config bundle)
   ============================================================ */
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(b){ return decodeURIComponent(escape(atob(b))); }
function downloadText(filename, text, mime){
  const blob=new Blob([text],{type:mime||'application/json'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function buildBundle(opts, name){
  const data={};
  if(opts.layout){ const s={...SETTINGS}; if(!opts.backend){ delete s.sbUrl; delete s.sbKey; delete s.formPage; } data.settings=s; }
  else if(opts.backend){ data.settings={sbUrl:SETTINGS.sbUrl||'',sbKey:SETTINGS.sbKey||'',formPage:SETTINGS.formPage||''}; }
  if(opts.schedule){ data.schedule=SCHEDULE; data.subjects=SUBJECTS; data.sched_tpl=SCHED_TPL; data.terms=TERMS; data.weekplan=WEEKPLAN; }
  if(opts.reminders) data.reminders=REMINDERS;
  if(opts.students) data.students=STUDENTS;
  if(opts.activities) data.activities=ACTIVITIES;
  if(opts.wheels){ data.spinner=SPINNER; data.jobs=JOBS; }
  if(opts.grid) data.grid=GRID;
  if(opts.forms) data.fl_forms=await Store.get('fl_forms',[]);
  return {v:1,name:name||'',created:new Date().toISOString(),data};
}
function parseBundle(text){
  text=(text||'').trim();
  if(text.startsWith('CLASSROOMOS1:')) text=b64dec(text.slice('CLASSROOMOS1:'.length));
  const obj=JSON.parse(text);
  if(!obj||!obj.data) throw new Error('invalid');
  return obj;
}
function describeBundle(d){
  const p=[];
  if(d.settings){ const has=[]; if(d.settings.theme!==undefined||d.settings.order||d.settings.enabled) has.push('layout & theme'); if(d.settings.sbUrl) has.push('backend keys'); p.push(has.join(' + ')||'settings'); }
  if(d.schedule) p.push('daily schedule');
  if(d.reminders) p.push(d.reminders.length+' reminder(s)');
  if(d.students) p.push(d.students.length+' student(s)');
  if(d.activities) p.push(d.activities.length+' activities');
  if(d.spinner||d.jobs) p.push('spinner & jobs');
  if(d.grid) p.push('task grid');
  if(d.fl_forms) p.push(d.fl_forms.length+' form(s)');
  return p;
}
async function applyImport(bundle){
  const d=bundle.data||{};
  if(d.settings){ await Store.set('settings', {...SETTINGS, ...d.settings}); }
  for(const k of ['schedule','subjects','sched_tpl','terms','weekplan','reminders','students','activities','spinner','jobs','grid','fl_forms']){
    if(k in d) await Store.set(k, d[k]);
  }
  location.reload();
}
/* ============================================================
   BACKUP & RECOVERY
   localStorage is wiped by "clear browsing data" — so the real setup must also
   live in a FILE, outside the browser.

   Two backends:
     1. File System Access API (Chrome/Edge, https or localhost only) — the app
        keeps a permanent handle to a folder the teacher picks. If they choose
        their OneDrive/Drive folder they ALSO get cross-device sync for free,
        with no server and no accounts.
     2. Download fallback (Firefox/Safari, or file://) — writes a .json into
        their Downloads folder, which browser-clearing never touches.
   ============================================================ */
const BACKUP_KEYS = ['settings','students','activities','reminders','spinner','jobs','jobassign',
  'points','behavior','task','countdown','grid','weather','schedule','scoreboard','dice','notes',
  'slide_embed','fl_forms','cork','seating','subjects','sched_tpl','terms','weekplan'];
const FSA_OK = (typeof window!=='undefined' && 'showDirectoryPicker' in window && window.isSecureContext);
let bkDirHandle=null;   // live handle for this session

async function buildFullBackup(){
  const data={};
  for(const k of BACKUP_KEYS){
    const v=await Store.get(k, undefined);
    if(v!==undefined) data[k]=v;
  }
  return {v:2, kind:'classroom-os-backup', created:new Date().toISOString(),
          students:(STUDENTS||[]).length, data};
}
async function restoreFullBackup(bundle){
  const d=(bundle&&bundle.data)||{};
  if(!Object.keys(d).length) throw new Error('empty backup');
  for(const k of Object.keys(d)) await Store.set(k, d[k]);
  await Store.set('seen', true);
  location.reload();
}
function backupFilename(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `classroom-os-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}

/* --- IndexedDB: the only place a directory handle can be persisted --- */
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('cos_backup',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbSet(k,v){ try{ const db=await idb(); return new Promise(res=>{
  const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }); }catch(e){ return false; } }
async function idbGet(k){ try{ const db=await idb(); return new Promise(res=>{
  const t=db.transaction('kv','readonly'); const q=t.objectStore('kv').get(k);
  q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); }catch(e){ return undefined; } }

/* --- pick a folder (once) --- */
async function chooseBackupFolder(){
  if(!FSA_OK) return false;
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite', startIn:'documents'});
    bkDirHandle=h;
    await idbSet('dir', h);
    SETTINGS.bkMode='folder'; saveSettings();
    await writeBackupToFolder(true);
    return true;
  }catch(e){ return false; }   // user cancelled
}
async function getSavedFolder(){
  if(!FSA_OK) return null;
  if(bkDirHandle) return bkDirHandle;
  const h=await idbGet('dir');
  if(!h) return null;
  try{
    const perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted'){ bkDirHandle=h; return h; }
    // 'prompt' — we can't ask without a user gesture, so defer
    return h;
  }catch(e){ return null; }
}
async function writeBackupToFolder(force){
  const h=await getSavedFolder(); if(!h) return false;
  try{
    let perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      if(!force) return false;                       // needs a gesture; try later
      perm=await h.requestPermission({mode:'readwrite'});
      if(perm!=='granted') return false;
    }
    const bundle=await buildFullBackup();
    // one rolling file (easy to find) + a dated copy (so a bad day is recoverable)
    for(const name of ['classroom-os-backup.json', backupFilename()]){
      const f=await h.getFileHandle(name,{create:true});
      const w=await f.createWritable();
      await w.write(JSON.stringify(bundle,null,2));
      await w.close();
    }
    SETTINGS.bkLast=Date.now(); saveSettings();
    return true;
  }catch(e){ console.warn('backup write failed',e); return false; }
}
async function downloadBackup(){
  const bundle=await buildFullBackup();
  downloadText(backupFilename(), JSON.stringify(bundle,null,2), 'application/json');
  SETTINGS.bkLast=Date.now(); saveSettings();
  return true;
}
/* the one call the rest of the app uses */
async function runBackup(force){
  if(demoMode) return false;                                  // never back up the sandbox
  if(!STUDENTS.length && !(SCHEDULE.days&&Object.keys(SCHEDULE.days).length)) return false;  // nothing worth saving
  if(SETTINGS.bkMode==='folder' && FSA_OK) return writeBackupToFolder(force);
  if(force && SETTINGS.bkMode==='download') return downloadBackup();
  return false;
}
/* once a day, quietly */
async function dailyBackup(){
  if(demoMode || SETTINGS.bkMode==='off' || !SETTINGS.bkMode) return;
  const last=SETTINGS.bkLast||0;
  if(Date.now()-last < 20*60*60*1000) return;    // ~once a day
  const ok=await runBackup(false);
  if(ok) pushNote({emoji:'💾', title:'Backed up', msg:'Today\'s copy of your setup was saved to your backup folder.'});
  else if(SETTINGS.bkMode==='download'){
    // can't silently download without a gesture — nudge instead
    nudgeBackup();
  }
}
/* --- recovery: storage is empty but this browser has been here before --- */
async function checkForDataLoss(){
  if(demoMode) return;
  const beenHere = await idbGet('everSetUp');
  const hasData  = STUDENTS.length || (SCHEDULE.days && Object.keys(SCHEDULE.days).length);
  if(hasData){ idbSet('everSetUp', true); return; }
  if(!beenHere) return;              // genuinely new — the welcome wizard handles it
  // Been here before, but the data is gone → almost certainly a browser wipe.
  const ov=document.createElement('div'); ov.className='modal-overlay welcome-overlay';
  ov.innerHTML=`<div class="modal welcome-modal" style="width:min(560px,95vw)">
    <div class="modal-body">
      <div class="wc-hero" style="background:linear-gradient(135deg,#ffd9d6,#fff3f2)">
        <div class="wc-hero-emoji">🔍</div>
        <div><div class="wc-hero-title">Your setup seems to be missing</div>
          <div class="wc-hero-sub">You've used Classroom OS in this browser before, but the saved data is gone.</div></div>
      </div>
      <div class="hint" style="margin-bottom:12px">This usually happens after <b>clearing browsing data</b>, or using a different browser or computer. Your work isn't lost if you have a backup file.</div>
      <div class="wc-tip">💡 Backup files are named <b>classroom-os-backup.json</b> — check your chosen backup folder, or your Downloads.</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-fresh>Start fresh</button>
      <span style="flex:1"></span>
      <button class="btn primary" data-restore>📂 Restore from backup</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('[data-fresh]').onclick=()=>{ ov.remove(); openWelcome(); };
  ov.querySelector('[data-restore]').onclick=()=>{ ov.remove(); pickRestoreFile(); };
}
function pickRestoreFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{
      const txt=await f.text();
      const b=JSON.parse(txt);
      if(!b || !b.data) throw new Error('not a backup file');
      const n=b.students!=null?b.students:'?';
      if(confirm(`Restore this backup?\n\nSaved: ${new Date(b.created).toLocaleString()}\nStudents: ${n}\n\nThis replaces anything currently set up.`)){
        await restoreFullBackup(b);
      }
    }catch(e){ alert('That doesn\'t look like a Classroom OS backup file.\n\n('+e.message+')'); }
  };
  inp.click();
}
/* gentle nudge for browsers without folder access */
function nudgeBackup(){
  if(document.getElementById('backup-nudge')) return;
  const b=document.createElement('div'); b.id='backup-nudge'; b.className='';

  document.body.appendChild(b);
  b.querySelector('[data-go]').onclick=async()=>{ await runBackup(true); b.remove(); };
  b.querySelector('.nudge-x').onclick=()=>b.remove();
}

function openImportSetup(){

      <button class="btn primary" data-apply disabled>Import & reload</button></div></div>`;
  document.body.appendChild(overlay);
  let parsed=null;
  const code=overlay.querySelector('[data-code]'), prev=overlay.querySelector('[data-preview]'), applyBtn=overlay.querySelector('[data-apply]');
