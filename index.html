      prev.innerHTML='<b>This setup includes:</b><br>'+(parts.length?parts.map(esc).join(' · '):'(nothing)')+(parsed.name?'<br>Name: '+esc(parsed.name):'');
      applyBtn.disabled=parts.length===0; }
    catch(e){ parsed=null; prev.textContent='Couldn’t read that — make sure you pasted the whole code.'; applyBtn.disabled=true; } }
  overlay.querySelector('[data-file]').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ code.value=r.result; doPreview(); }; r.readAsText(f); };
  overlay.querySelector('[data-check]').onclick=doPreview;
  code.oninput=()=>{ applyBtn.disabled=true; };
  overlay.querySelector('[data-cancel]').onclick=()=>overlay.remove();
  overlay.addEventListener('mousedown',e=>{ if(e.target===overlay)overlay.remove(); });
  applyBtn.onclick=async()=>{ if(!parsed)return; applyBtn.textContent='Importing…'; await applyImport(parsed); };
}

function isLight(hex){const c=hex.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*299+g*587+b*114)/1000>150;}

/* migrate / initialise GRID to the multi-board shape (used by boot and exitDemo) */
function normaliseGrid(){
  const defaultStages=[{emoji:'📝',label:'Planning'},{emoji:'✏️',label:'Beginning'},{emoji:'📖',label:'Middle'},{emoji:'🏁',label:'End'},{emoji:'⭐',label:'Publish'}];
  if(!GRID || typeof GRID!=='object' || Array.isArray(GRID)){ GRID={active:'b1',boards:[{id:'b1',name:'Writing',stages:defaultStages,status:{}}]}; }
  else if(!Array.isArray(GRID.boards)){ // old {stages,status} shape, or corrupt
    GRID={active:'b1',boards:[{id:'b1',name:'Writing',stages:(Array.isArray(GRID.stages)&&GRID.stages.length?GRID.stages:defaultStages),status:(GRID.status&&typeof GRID.status==='object')?GRID.status:{}}]};
  }
  GRID.boards=GRID.boards.filter(b=>b && typeof b==='object' && b.id);
  GRID.boards.forEach(b=>{ if(!Array.isArray(b.stages)||!b.stages.length) b.stages=defaultStages.map(s=>({...s}));
    if(!b.status||typeof b.status!=='object') b.status={}; if(!b.name) b.name='Board';
    // notes are additive: absent on every existing board. Keep only string values.
    if(!b.notes||typeof b.notes!=='object'||Array.isArray(b.notes)) b.notes={};
    else Object.keys(b.notes).forEach(k=>{ if(typeof b.notes[k]!=='string'||!b.notes[k].trim()) delete b.notes[k]; }); });
  if(!GRID.boards.length){ GRID.boards=[{id:'b1',name:'Writing',stages:defaultStages,status:{}}]; }
  if(!GRID.active || !GRID.boards.some(b=>b.id===GRID.active)) GRID.active=GRID.boards[0].id;
}

/* ============================================================
   PWA — offline support + a clean update path
   The service worker never forces an update mid-lesson: it installs quietly in
   the background and we offer a reload. Teacher data lives in localStorage /
   IndexedDB, which updating never touches.
   ============================================================ */
function initPWA(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol==='file:') return;          // needs a real origin
  navigator.serviceWorker.register('./service-worker.js').then(reg=>{
    // a new version was found and is waiting to take over
    const offer=()=>{ if(reg.waiting) showUpdatePrompt(reg); };
    if(reg.waiting) offer();
    reg.addEventListener('updatefound',()=>{
      const sw=reg.installing;
      if(!sw) return;
      sw.addEventListener('statechange',()=>{
        // "installed" + an existing controller means this is an UPDATE, not a first install
        if(sw.state==='installed' && navigator.serviceWorker.controller) showUpdatePrompt(reg);
      });
    });
    // check again periodically — a teacher may leave the tab open for days
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
  }).catch(e=>console.warn('[pwa] registration failed', e));

  // once the new worker takes control, reload to run it
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading) return; reloading=true; location.reload();
  });
}
function showUpdatePrompt(reg){
  if(document.getElementById('update-bar')) return;
  const b=document.createElement('div'); b.id='update-bar';
  b.innerHTML=`<span>✨ <b>A new version of Classroom OS is ready.</b> Your setup is safe — nothing will be lost.</span>
    <button class="btn sm primary" data-go>Reload to update</button>
    <button class="nudge-x" title="Later">✕</button>`;
  document.body.appendChild(b);
  b.querySelector('[data-go]').onclick=()=>{
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');   // controllerchange then reloads us
    else location.reload();
  };
  b.querySelector('.nudge-x').onclick=()=>b.remove();
}

/* Type-safe loaders. Storage can hold anything — a half-finished write, a value
   from an older version, or plain corruption. Any of those reaching a `.forEach`
   or `.slice` kills boot() outright, and because boot is async, everything after
   it silently never runs (this is exactly how the schedule rail once vanished).
   These guarantee the shape, so a bad value degrades to a default instead. */
async function getArr(key, def){
  const v = await Store.get(key, undefined);
  return Array.isArray(v) ? v : (def||[]).slice();
}
async function getObj(key, def){
  const v = await Store.get(key, undefined);
  return (v && typeof v==='object' && !Array.isArray(v)) ? v : {...(def||{})};
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  SETTINGS   = await getObj('settings', {theme:'daylight',accent:null,enabled:{},order:[]});
  if(!SETTINGS.enabled || typeof SETTINGS.enabled!=='object') SETTINGS.enabled={};
  if(!Array.isArray(SETTINGS.order)) SETTINGS.order=[];
  // new in 1.2.0 — absent on every existing setup, which simply means "nothing folded"
  SETTINGS.weekCollapsed = Array.isArray(SETTINGS.weekCollapsed)
    ? SETTINGS.weekCollapsed.filter(x=>typeof x==='string') : [];
  STUDENTS   = await getArr('students', []);
  ACTIVITIES = await getArr('activities', DEFAULT_ACTIVITIES);
  REMINDERS  = await getArr('reminders', []);
  SPINNER    = await getArr('spinner', ['Heads','Tails']);
  JOBS       = await getArr('jobs', ['Line monitor','Tech helper','Librarian','Tidy crew']);
  JOBASSIGN  = await getObj('jobassign', {});
  POINTS     = await getObj('points', {mode:'class',class:0,students:{}});
  if(typeof POINTS.students!=='object'||!POINTS.students) POINTS.students={};
  BEHAVIOR   = await getArr('behavior', []);
  GRID       = await Store.get('grid', null);
  normaliseGrid();

  // notifications (today only)
  const notesData = await getObj('notes', {date:'',items:[]});
  NOTES = (notesData.date===new Date().toDateString()) ? (Array.isArray(notesData.items)?notesData.items:[]) : [];
  SCOREBOARD = await getArr('scoreboard', []);
  CORK    = await getArr('cork', []);
  SEATING = await getObj('seating', {seats:[]});
  if(!Array.isArray(SEATING.seats))   SEATING.seats=[];
  // MIGRATION: the old flat `flagged` list is ambiguous under the new pairwise
  // keep-apart model (it couldn't say WHICH pairs must be apart), so we drop it
  // and start fresh — teachers re-flag with the precise pair system.
  if('flagged' in SEATING) delete SEATING.flagged;
  // pairs AND apartPairs: keep only well-formed [a,b] string tuples — a corrupt
  // entry must not reach the auto-seater, which would chase a phantom constraint.
  const cleanTuples = arr => Array.isArray(arr)
    ? arr.filter(p=>Array.isArray(p)&&p.length===2&&typeof p[0]==='string'&&typeof p[1]==='string'&&p[0]&&p[1])
    : [];
  SEATING.pairs = cleanTuples(SEATING.pairs);
  SEATING.apartPairs = cleanTuples(SEATING.apartPairs);
  WEATHER = await Store.get('weather', WEATHER);
  // schedule (seed weekdays with a default on first run)
  SCHEDULE = await getObj('schedule', null);
  if(!SCHEDULE || !Object.keys(SCHEDULE).length){
    SCHEDULE={side:'left',days:{}}; [1,2,3,4,5].forEach(d=>SCHEDULE.days[d]=DEFAULT_SCHEDULE_DAY.map(x=>({...x})));
    await Store.set('schedule',SCHEDULE);
  }
  if(!SCHEDULE.days || typeof SCHEDULE.days!=='object' || Array.isArray(SCHEDULE.days)) SCHEDULE.days={};
  // every day must be an array — a corrupt day would break the rail and the editor
  Object.keys(SCHEDULE.days).forEach(d=>{ if(!Array.isArray(SCHEDULE.days[d])) SCHEDULE.days[d]=[]; });
  // subject library ("velcro cards") + day templates
  SUBJECTS = await getArr('subjects', []);
  if(!SUBJECTS.length){ SUBJECTS = seedSubjects(); await Store.set('subjects', SUBJECTS); }
  SUBJECTS = SUBJECTS.filter(s=>s && typeof s==='object');
  SUBJECTS.forEach(s=>{ if(!Array.isArray(s.links)) s.links=[]; if(!s.id) s.id=newSubjId(); });
  SCHED_TPL = (await getArr('sched_tpl', [])).filter(t=>t && Array.isArray(t.slots));
  /* the year. Both are additive: absent (every existing install) => empty => the
     app behaves exactly as it did before terms existed. */
  TERMS = (await getArr('terms', [])).filter(t=>t && typeof t==='object' && ymdToDate(t.start) && ymdToDate(t.end))
                                     .map((t,i)=>({n:Number(t.n)||i+1, start:t.start, end:t.end}));
  WEEKPLAN = await getObj('weekplan', {});
  // a corrupt week, or a corrupt day inside one, must degrade to "use the usual
  // timetable" rather than take the schedule down with it
  Object.keys(WEEKPLAN).forEach(k=>{
    const wk=WEEKPLAN[k];
    if(!wk || typeof wk!=='object' || Array.isArray(wk)){ delete WEEKPLAN[k]; return; }
    Object.keys(wk).forEach(d=>{ if(!Array.isArray(wk[d])) delete wk[d]; });
    if(!Object.keys(wk).length) delete WEEKPLAN[k];
  });
  schedEnabled = SETTINGS.schedEnabled!==false;
  schedLevel   = (SETTINGS.schedLevel==='bar'||SETTINGS.schedLevel==='hidden') ? 'hidden' : 'mini';
  schedLocked  = !!SETTINGS.schedLocked;
  // seed the default wellbeing form into the local library on first run
  const seededForms = await Store.get('fl_forms', null);
  if(seededForms===null){ await Store.set('fl_forms', [{...DEFAULT_WELLBEING, created_at:new Date().toISOString()}]); }

  applyTheme();
  // each init is independent — one failing must never take the rest of the UI down
  const safe=(fn,n)=>{ try{ fn(); }catch(e){ console.error('init '+n+' failed',e); logError('init', e, n); } };
  safe(initErrors,'errors');
  safe(initPWA,'pwa');
  safe(initDock,'dock');
  safe(initNotif,'notif');
  safe(initUndo,'undo');
  safe(initModalEnhancer,'modals');
  safe(initKeys,'keys');
  safe(initWeather,'weather');
  safe(initSchedule,'schedule');
  safe(initSlides,'slides');
  SLIDE_EMBED = await Store.get('slide_embed', '');
  clock(); setInterval(clock,1000);
  setInterval(reminderLoop, 5000);
  // prime audio on first interaction so reminder dings aren't blocked by the
  // browser's autoplay policy
  window.addEventListener('pointerdown',primeAudio);
  window.addEventListener('keydown',primeAudio);
  window.addEventListener('touchstart',primeAudio);
  // catch up the moment the tab regains focus — setInterval is throttled/paused
  // while backgrounded, so a reminder's minute may have been skipped entirely
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reminderLoop(); });
  window.addEventListener('focus',reminderLoop);

  // First run → onboarding. The class list drives the name picker, groups, seating,
  // points and jobs, so getting it in is by far the highest-value first action.
  // `seen` is set as soon as they finish OR skip, so we never nag on later loads.
  const everOpened = await Store.get('seen', false);
  if(!everOpened) openWelcome();
  else if(!STUDENTS.length) nudgeClassList();   // gentle, dismissible reminder instead
  checkEnvironment();                           // logs to 🔔 notifications, so it never covers the room
  // backup: spot a wipe, then take today's copy
  await checkForDataLoss();
  dailyBackup();
  // and save on the way out, so the last thing they did isn't lost
  window.addEventListener('beforeunload',()=>{ if(!demoMode && SETTINGS.bkMode==='folder') runBackup(false); });
  // put back whatever tools were open last time — but not for the iPad student
  // view, which is a dedicated full-screen surface with no teacher windows
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('grid')!=='student') await restoreSession();
  }catch(e){}
  openFromQuery();                              // PWA shortcut deep links (?open=timer)
  initDevFloor();                               // ?dev — live fit-floor tuning
  // re-fit scaled tool content when the viewport changes size
  let _fitT; window.addEventListener('resize',()=>{ clearTimeout(_fitT); _fitT=setTimeout(fitAllWindows,120); });
  // marker: boot reached the end. A throw anywhere above silently skips the rest of
  // init (this is exactly how the schedule rail once vanished), so the smoke test
  // asserts this flag rather than merely that boot() didn't throw.
  try{ globalThis.__bootDone = true; }catch(e){}
  HIST.init();   // baseline snapshot — everything after this is undoable
}
/* ---------- keyboard shortcuts ---------- */
const KEYS = [
  {k:'t', id:'timer',    d:'Timer'},
  {k:'n', id:'names',    d:'Name picker'},
  {k:'g', id:'groups',   d:'Groups'},
  {k:'q', id:'queue',    d:'Queue'},
  {k:'r', id:'seating',  d:'Seating chart'},
  {k:'c', id:'cork',     d:'Corkboard'},
  {k:'d', id:'dice',     d:'Dice'},
  {k:'w', id:'spinner',  d:'Spinner'},
  {k:'p', id:'points',   d:'Points'},
  {k:'b', id:'scoreboard', d:'Scoreboard'},
  {k:'h', id:'behavior', d:'Behaviour log'},
  {k:'j', id:'jobs',     d:'Job wheel'},
  {k:'k', id:'task',     d:'Task display'},
  {k:'m', id:'noise',    d:'Noise meter'},
  {k:'e', id:'settle',   d:'Settle'},
  {k:'o', id:'countdown',d:'Countdown'},
  {k:'i', id:'slides',   d:'Slides'},
  {k:'f', id:'forms',    d:'Forms & poll'},
  {k:',', id:'settings', d:'Settings'},
];
function shortcutsHelp(){
  const rows = KEYS.filter(x=>APPS[x.id]).map(x=>
    `<div class="ks-row"><kbd>${x.k===','?',':x.k.toUpperCase()}</kbd><span>${APPS[x.id].emoji} ${esc(x.d)}</span></div>`).join('');
  const extra = [
    ['S','Toggle schedule rail'],['L','Arrange open tools'],['Z','Undo'],['Y','Redo'],
    ['Esc','Close top window / exit slides'],['?','This list'],
  ].map(([k,d])=>`<div class="ks-row"><kbd>${k}</kbd><span>${d}</span></div>`).join('');
  const ov=document.createElement('div'); ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal wide" style="width:min(620px,94vw)">
    <div class="modal-head">⌨️ Keyboard shortcuts<button class="x" data-close style="margin-left:auto">✕</button></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:10px">Press a key on its own to open that tool. Hold <kbd>Shift</kbd> with a tool key to open a <b>second</b> copy. Shortcuts are ignored while you're typing.</div>
      <div class="ks-grid">${rows}</div>
      <div style="font-weight:900;margin:14px 0 6px">Other</div>
      <div class="ks-grid">${extra}</div>
    </div>
    <div class="modal-foot"><button class="btn primary" data-close style="margin-left:auto">Done</button></div>
  </div>`;
  const close=()=>ov.remove();
  ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  ov.onclick=e=>{ if(e.target===ov) close(); };
  document.body.appendChild(ov);
}
function initKeys(){
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;              // leave modifier combos alone (undo etc.)
    const t=e.target, tag=(t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
    if(document.querySelector('.modal-overlay')) return;    // a dialog owns the keyboard
    if(stageOn) return;                                     // slides own the keyboard while presenting
    const k=(e.key||'').toLowerCase();
    if(k==='?'||(k==='/'&&e.shiftKey)){ e.preventDefault(); shortcutsHelp(); return; }
    if(k==='escape'){
      const wins=[...document.querySelectorAll('.win')];
      if(wins.length){ const top=wins.reduce((a,b)=>(+b.style.zIndex||0)>(+a.style.zIndex||0)?b:a);
        const c=top.querySelector('.win-btn.close'); if(c){ e.preventDefault(); c.click(); } }
      return;
    }
    if(k==='s'){ e.preventDefault(); openApp('schedule'); return; }   // openApp routes toggles to toggleSchedule()
    if(k==='l'){ e.preventDefault(); autoSnap(); return; }            // arrange open windows
    if(k==='z'){ e.preventDefault(); HIST.doUndo(); return; }
    if(k==='y'){ e.preventDefault(); HIST.doRedo(); return; }
    const hit=KEYS.find(x=>x.k===k);
    if(hit && APPS[hit.id]){ e.preventDefault(); openApp(hit.id, e.shiftKey); }
  });
}

/* Every modal gets the resize grip + double-click-to-maximise, without each call
   site having to remember. Watches for overlays being added to the page. */
function initModalEnhancer(){
  const enhance=el=>{
    const m=el.classList && el.classList.contains('modal-overlay') ? el.querySelector('.modal') : null;
    if(m && !m.dataset.enh){ m.dataset.enh='1'; try{ makeModalResizable(m); }catch(e){} }
  };
  new MutationObserver(muts=>{
    muts.forEach(mu=>mu.addedNodes.forEach(n=>{ if(n.nodeType===1) enhance(n); }));
  }).observe(document.body,{childList:true});
}

function initUndo(){
  const u=document.getElementById('undo-btn'), r=document.getElementById('redo-btn');
  if(u) u.onclick=()=>HIST.doUndo();
  if(r) r.onclick=()=>HIST.doRedo();
  const af=document.getElementById('appfull-btn');
  if(af) af.onclick=()=>toggleAppFull();
  document.addEventListener('keydown',e=>{
    if(!(e.ctrlKey||e.metaKey)) return;
    const k=(e.key||'').toLowerCase();
    if(k!=='z'&&k!=='y') return;
    // don't steal the browser's own undo while typing in a field
    const t=e.target, tag=(t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||(t&&t.isContentEditable)) return;
    e.preventDefault();
    if(k==='y'||e.shiftKey) HIST.doRedo(); else HIST.doUndo();
  });
  HIST.paint();
}

boot().catch(e=>{
  console.error('boot failed', e);
  // last resort: at least get the dock + schedule up so the room isn't left with a blank wall
  try{ initDock(); }catch(_){}
  try{ initSchedule(); }catch(_){}
});
</script>
